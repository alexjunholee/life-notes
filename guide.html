# Ch.21 — 조직 변화와 다음 선택지 준비

어제까지 필요하던 프로젝트가 오늘 중단될 수 있다. 인수합병 뒤 누구에게 보고하는지가
바뀌고, 새 팀장이 우선순위를 다시 정하며, 감원으로 남은 사람의 역할이
넓어지기도 한다. 이런 변화는 개인의 성과와 무관하게 시작될 수 있다.
조직이 먼저 조건을 바꿨는데도 당사자는 “내가 부족해서 이런 일이 생겼나”라고
해석하기 쉽다.

Akkermans와 동료들은 경력 충격(career shock)을 개인이 통제할 수 없는 요인이
적어도 일부 작용해 경력을 다시 생각하게 만드는 사건으로 설명했다. 사건 자체와 이후의
경로는 같은 것이 아니다. 팀 해체는 통제 밖에서 일어날 수 있지만 내부
이동을 알아볼지, 다른 회사로 갈지, 잠시 멈출지에는 개인의 자원과 제도가
관여한다. 반대로 모든 충격을 성장의 계기라고 부르면 소득 손실과 건강,
비자와 돌봄 같은 실제 피해를 지우게 된다.

## 공식 결정 전의 고용 불안

고용 불안은 실제 해고와 같지 않다. 현재 일자리의 지속성이 위협받는다고
느끼는 상태를 가리킨다. Cheng과 Chan은 133개 연구에서 얻은 172개 독립 표본,
총 132,927명의 자료를 종합했다. 고용 불안은 낮은 직무 수행, 좋지 않은 건강
상태, 높은 이직 의도와 관련됐다. 고용 불안과 이직 의도·건강 사이의 관련성은
연령과 근속에 따라 강도가 달랐다. 그러나
종단 연구도 첫 시점의 상관을 사용한 경우가 있어, 불안이 모든 결과의 원인이라고
확정하기는 어렵다.

조직 변화에 관한 정보는 세 상태로 나눈다. **공식 사실**은 회사가 대상과
시행일을 밝혀 알린 내용이다. **관찰 신호**는 사업 중단, 채용 동결, 핵심
인력의 이탈, 예산 변경처럼 직접 확인했지만 결론은 아직 발표되지 않은
변화다. **소문**은 출처와 적용 범위를 확인하지 못한 말이다. 관찰 신호를
무시할 필요는 없지만 소문을 공식 결정처럼 다루면 현재 선택지를 잘못
그리게 된다.

변화가 보이면 다음 순서로 적는다.

1. 공식 사실, 관찰 신호, 소문을 구분한다.
2. 시행 날짜, 대상 팀, 보고 관계·인원·프로젝트·계약에서 무엇이 바뀌는지 확인한다.
3. 자신의 업무, 평가, 근무지, 보상, 비자와 보험에 미치는 영향을 적는다.
4. 답변할 담당자와 답변 시점을 확인한다. 모르는 항목은 추측으로 채우지
   않는다.
5. 기다리는 동안에도 지켜야 할 건강·소득·주거 조건이 있는지 본다.

정보 상태는 한 번 적고 끝내지 않는다. 관찰 신호가 공식 발표로 바뀌거나
적용 대상에서 자신의 팀이 빠지면 선택지도 달라진다. 확인 날짜를 함께 남겨
오래된 소문과 새 사실이 한 목록에 섞이지 않게 한다.

공식 답을 기다리는 기간이 길면 `아직 모른다`는 사실 자체가 생활 비용이
된다. 그 기간에 수면이나 업무 기능이 크게 흔들리면 단지 정보가 나올 때까지
버티는 문제로만 보지 않는다. 회사의 EAP, 의료기관, 노동·법률 상담처럼
현재 상황에 맞는 도움을 따로 찾을 수 있다.

## 이미 준비한 것을 바뀐 조건에 맞추기

변화에 대비할 자료를 여기서 새로 정리할 필요는 없다.
첫 직장에서 맡은 일과 경험의 변화를 기록하는 법은 Ch.19, 조직 밖 관계를
이어 가는 법은 Ch.18, 소득·보험·주거·돌봄 같은 생활 조건은 Ch.12에서
다뤘다. 조직 변화가 생기면 이 기록에서 **달라진 것과 끊길 것**만 갱신한다.

중단된 프로젝트에서 어디까지 완료했는지, 앞으로 누구에게 보고하며 어떤 책임과
권한을 맡는지, 함께 일하던 사람 가운데 실제로 남는 사람이 누구인지 확인한다.
회사 자료의 공개 범위는 그대로 지키되 자신의 기여와 판단은 설명할 수 있게
정리한다. 이어 계약 종료일, 보험과 비자, 주거와 돌봄에 변화가 생기는 날짜를
맞춘다. 평소의 경력 준비를 처음부터 다시 하는 것이 아니라 조직이 바꾼
조건이 기존 선택지에서 무엇을 지웠는지 찾는 일이다.

## 하나가 아닌 다음 자리

조직이 바뀌면 외부 이직만 떠올리기 쉽지만 실제 경로는 더 나뉜다. 같은
회사 안에서 팀이나 역할을 옮길 수 있고, 다른 조직으로 갈 수도 있다. 건강·
돌봄·이주 때문에 잠시 일을 멈추거나, 교육 뒤 다른 분야로 들어가는 경우도
있다. 모두에게 네 경로가 열려 있는 것은 아니다. 내부 공모가 있어도 상사의
승인이 필요할 수 있고, 중단은 소득과 비자에 큰 비용을 줄 수 있으며, 재교육이
채용을 보장하지도 않는다.

De Vos와 동료들의 경력 전환 문헌고찰은 전환과 고용가능성의 관계가 전환의
종류, 전후 맥락, 개인이 가진 자원에 따라 달라진다고 정리했다. Rudolph와
동료들은 90개 연구에서 경력 적응성과 여러 적응 관련 변인의 관계를 종합했다.
여기서 경력 적응성은 미래 과제를 준비하는 관심, 자신의 경력 발달에 책임을
지는 통제, 가능한 미래를 살피는 호기심, 경력 문제를 해결할 수 있다는
자신감으로 이루어진 심리사회적 자원이다. 타고난 성격이나 해고를 잘 견디는
능력과 같은 말은 아니다.

선택지를 비교할 때에는 바뀐 조직에 남았을 때의 실제 역할, 내부 이동 뒤의
조건, 외부 제안의 업무와 계약, 중단 기간의 생활비와 복귀 경로를 모두 같은
기준일에 확인한다. 예전 팀이 좋았다는 기억과 앞으로 생길지 모르는 자리를
비교하면 판단 기준이 어긋난다. 이미 사라진 조건은 현재 선택지에서 빼야
한다.

조직 변화 뒤에는 자신의 가치를 평가하기 전에 실제로 남은 조건부터 확인한다.
회사가 바꾼 조건을 확인하고, 지금까지 쌓은 일을 다른 조직에서도 이해할 수
있게 정리하며, 생활을 지킬 조건을 계산한다. 그 자료를 놓고 기다릴지, 내부에서
옮길지, 밖으로 나갈지 판단한다.

[Rudolph, Lavigne, & Zacher (2017), “Career Adaptability”](https://doi.org/10.1016/j.jvb.2016.09.002),
[De Vos, Jacobs, & Verbruggen (2021), “Career Transitions and Employability”](https://doi.org/10.1016/j.jvb.2020.103475)을
참조했다.

# Ch.22 — 번아웃과 조직 조건

며칠 몰아서 일한 뒤 지친 상태, 오래 일하면서 생긴 냉소, 우울과 불안은
겉으로 일부 비슷할 수 있다. 모두를 번아웃이라고 부르면 원인을 찾기 어렵고,
번아웃을 단순 피로라고 부르면 업무 조건을 놓친다. 먼저 이 말이 가리키는
범위를 고정할 필요가 있다.

## WHO가 말하는 번아웃

세계보건기구(WHO)는 ICD-11에서 번아웃을 질병이 아닌 직업 관련 현상으로
분류한다. 성공적으로 관리되지 않은 만성적인 직장 스트레스에서 비롯된다고
설명하며, 에너지 고갈이나 탈진, 일과의 심리적 거리 증가 또는 부정적·냉소적
감정, 직업 효능감 저하의 세 차원을 제시한다. 이 정의는 직업 맥락에만
적용된다.

세 차원은 온라인 자가진단표가 아니다. 피곤한 하루가 있었다고 번아웃으로
판정할 수도 없고, 수면 변화나 집중 곤란만으로 다른 정신건강 상태와 구분할
수도 없다. WHO의 분류가 주는 핵심 정보는 증상 개수가 아니라 **만성적인
직장 스트레스와의 관계**다. 개인의 의지와 시간관리만 살펴서는 이 정의가
지목한 원인을 다 볼 수 없다.

## 업무 요구와 자원 같이 보기

직무요구-자원 이론은 업무 요구와 직무 자원을 나누어 본다. 업무 요구는
지속적인 신체적·심리적 노력이 필요하고, 생리적·심리적 비용과 관련되는 직무
특성이다. 업무량, 시간 압박, 감정노동, 복잡한 판단, 역할 충돌이 여기에
들어갈 수 있다. 직무 자원은 목표 달성을 돕고, 업무 요구와 그에 따른 비용을
줄이거나, 성장·학습·발달을 돕는 직무 특성이다. 업무를 통제할 범위, 상사와
동료의 지원, 명확한 역할, 피드백, 회복 시간이 여기에 해당한다. 요구가 있다는
사실만으로 나쁜 직업은 아니다. 적절한 자원 없이
높은 요구가 만성적으로 이어질 때 소진 위험을 살펴야 한다.

Bakker와 동료들의 2023년 종합 검토는 이 이론의 최근 연구를 정리하면서
개인과 상황의 상호작용, 팀 수준, 일과 가정의 자원까지 다뤘다. 이 틀은 `업무량이
많으면 번아웃`이라는 한 줄보다 실제로 손댈 곳을 찾는 데 유용하다. 같은
업무량이라도 우선순위를 바꿀 권한이 있는지, 질문할 사람이 있는지, 장애
뒤 회복 시간이 있는지에 따라 일의 조건이 달라진다.

종단연구만 모아 업무환경과 번아웃을 살핀 Aronsson과 동료들의 체계적 고찰·
메타분석은 기준을 충족한 25편을 검토했다. 높은 통제와 이후의 낮은 정서적
소진, 낮은 직장 지원과 높은 소진의 관계에는 중간 수준의 근거가 있었다.
높은 직무 요구와 많은 업무량, 낮은 보상, 낮은 공정성, 고용 불안이 소진과
관련된다는 데에는 제한된 근거가 보고됐다.
연구 대부분이 소진에 집중했고 지역도 유럽·북미·호주·뉴질랜드에 치우쳤다.
위험요인마다 같은 확실성으로 말할 수는 없다.

그래도 이 결과는 “마음가짐을 바꾸면 된다”는 설명이 부족하다는 점을 분명히
한다. 업무량을 정하는 사람, 인력을 배치하는 조직, 장애 대응 규칙, 괴롭힘과
차별을 처리하는 절차가 개인 밖에 있기 때문이다.

## 조직이 만든 조건 바꾸기

Ch.20에서는 현재 문제의 지속성과 수정 가능성을 보고 남거나 떠나는 결정을
다뤘다. 여기서는 번아웃과 관련된 조건의 결정권이 어디에 있는지를 본다.

| 조건 | 주된 결정권 | 확인할 변화 |
|---|---|---|
| 업무량·마감·우선순위 | 상사, 팀, 조직 | 동시에 맡는 일과 시간 압박이 실제로 줄었는가 |
| 역할·권한·지원 | 상사, 팀, 조직 | 책임에 필요한 결정권, 인력, 정보, 피드백이 생겼는가 |
| 당직·장애 대응·회복 | 팀, 조직 | 호출 빈도와 순번, 보상, 복구 뒤 휴식이 바뀌었는가 |
| 괴롭힘·차별·불공정·안전 | 조직 | 보호 절차가 작동하고 보복 없이 접근할 수 있는가 |
| 지속되는 정신·신체 상태와 기능 저하 | 당사자와 보건의료 전문가 | 상태를 평가하고 필요한 도움에 접근할 수 있는가 |

개인이 수면과 휴식을 챙기고 업무 밖의 도움을 찾는 일은 필요할 수 있다.
그러나 다음 주의 업무량, 야간 호출, 인력과 보호 절차를 정하는 권한까지
개인에게 있지는 않다. 직속 상사도 우선순위는 조정할 수 있지만 채용 동결이나
인력 예산은 바꾸지 못할 수 있다. 누가 결정할 수 있는 조건인지 밝혀야 조직의
책임이 개인의 회복 과제로 넘어가지 않는다.

## 조직 개입의 결과 확인하기

WHO의 2022년 *Guidelines on Mental Health at Work*는 조직 개입, 관리자
교육, 근로자 교육, 개인 개입, 업무 복귀, 취업 지원을 서로 다른 영역의 권고로
다룬다. 조직 개입은 유연근무 같은 제도를 추가하는 데서 끝나지 않고 업무
환경의 심리사회적 위험을 평가하고 줄이거나 없애는 데 초점을 둔다.

Bes와 동료들이 조직 수준의 번아웃 개입을 종합한 메타분석에서는 소진을
낮추는 효과가 보고됐지만, 연구와 개입의 차이가 컸고 업무량을 직접 바꾼
연구는 더 필요했다. `웰니스 주간`이나 교육을 열었다는 사실만으로 만성적인
업무 요구가 줄었다고 볼 수 없는 이유다. 개입 뒤에는 실제 업무량, 통제,
지원, 회복 시간이 달라졌는지 확인해야 한다.

휴식과 개인 상담은 조직 개입을 기다리는 동안에도 필요할 수 있다. 동시에
조직이 만들고 유지하는 위험은 업무 재설계와 인력·일정·보호 절차의 문제로
남는다.

번아웃과 우울·불안은 함께 나타날 수 있지만 같은 개념이 아니다. 어려움이
오래 이어지거나 악화되고 수면·식사, 일상 기능, 안전에 영향을 준다면 직장
스트레스라는 설명 안에 머물지 말고 다음 장의 도움 경로를 확인한다.

# Ch.23 — 도움을 구할 시점과 경로

일이 손에 잡히지 않는 날, 실패 뒤 며칠 동안 가라앉는 일, 계속 자격이
없다고 느끼는 일, 수면과 식사가 무너진 채 오래 지내는 일은 같은 상태가
아니다. 시작된 계기와 지속 기간도 다르고 일상에 미치는 영향도 다르다.
그런데 스스로 정확한 이름을 붙여야 도움을 받을 수 있다고 생각하면 병명을
찾느라 시간을 보내게 된다.

도움을 구하기 전에 진단을 마칠 필요는 없다. 지금 겪는 괴로움이 얼마나
심한지, 얼마나 이어졌는지, 평소 하던 일을 얼마나 바꾸었는지, 안전이
걱정되는지를 말할 수 있으면 출발할 수 있다. 진단과 치료는 그 정보를 함께
보는 전문가의 역할이다.

## 사건 뒤 반응과 오래 이어지는 어려움

발표를 망치거나 시험에 떨어지고, 지원 결과가 좋지 않았을 때 마음이 크게
흔들릴 수 있다. 특정 사건이 분명하면 사실과 자기평가를 나눈다. 처리할 일이
남았다면 기한을 확인하고, 쉬거나 주변 사람에게 도움을 청한다. 사건이
뚜렷해도 언제나 혼자 회복해야 하는 것은 아니다.

계기가 뚜렷하지 않거나, 사건이 지나간 뒤에도 어려움이 계속될 수 있다.
수면과 식사, 집중, 수업과 출근, 사람을 만나는 일이 평소와 달라지고 그
변화가 이어지면 `이번 실패를 잘 해석하면 된다`는 방법만으로는 부족하다.
무슨 일 때문에 시작됐는지 모른다는 이유로 도움을 미룰 필요도 없다.

상태를 설명할 때에는 다음 내용을 짧게 적어 두면 유용하다.

- 언제 시작됐고 최근에 어떻게 달라졌는가
- 하루나 한 주에 얼마나 자주 나타나며 어느 때 심해지는가
- 수면, 식사, 집중, 학업·업무, 관계에 어떤 변화가 생겼는가
- 최근의 큰 사건, 복용 중인 약, 신체 건강 문제 가운데 함께 알려야 할 것이
  있는가
- 지금 자신이나 다른 사람의 안전이 걱정되는가

이 기록은 점수를 합쳐 병명을 정하는 표가 아니다. 상담기관이나 의료진에게
상황을 전달하고, 자신이 빠뜨린 변화를 확인하기 위한 메모다. 기록하기조차
어렵다면 그 상태 그대로 도움을 요청할 수 있다.

## 진단명이 아닌 임포스터 현상

새 팀이나 어려운 수업에서 “다른 사람은 이미 아는데 나만 모른다”고 느낄
수 있다. 성과를 내고도 운이 좋았거나 평가자가 잘못 봤다고 생각하며 자신의
자격을 계속 의심하기도 한다. 흔히 임포스터 증후군이라고 부르지만, 이
경험은 정식 임상 진단이 아니다. 이 책에서는 임포스터 현상 또는 임포스터
감정이라고 부른다.

Bravata와 동료들은 62개 연구, 14,161명을 검토했다. 임포스터 현상을 겪는
사람의 비율은 사용한 측정도구와 절단점에 따라 9%에서 82%까지 크게 달랐다.
불안, 우울, 직무만족, 번아웃 등과 관련이 있다는 보고도 있지만 연구가 매우 이질적이고
상당수가 한 시점의 조사였다. 포함된 연구 가운데 치료 효과를 평가한 연구는
없었다.

따라서 `대학생 대부분이 겪는다`거나 특정 방법으로 고칠 수 있다고 말할
근거는 부족하다. 먼저 외부 비교와 자격 의심을 나누어 볼 수 있다. 눈에 띄는
동료의 최고 성과만 보고 자신의 평균과 비교한다면 비교 자료를 바꿔야 한다.
이미 통과한 평가와 실제로 끝낸 일까지 우연으로 돌리고 있다면, 자신이 맡은
작은 기여와 받은 피드백을 기록해 생각과 자료를 대조할 수 있다.

이 방법을 써도 괴로움이 이어지거나 일상 기능이 떨어지면 임포스터라는 이름
안에서 혼자 해결하려 하지 않는다. 우울·불안 증상이 함께 있는지, 다른
도움이 필요한지는 전문가와 확인할 문제다.

## 자기관리에서 전문적 도움으로

미국 국립정신건강연구소(NIMH)의 2025년 개정 일반인 안내는 증상의 강도와
지속 기간, 일상 기능을 함께 보도록 한다. 가벼운 증상이 2주보다 짧게 이어지고
자신과 다른 사람을 돌보며 평소 활동을 할 수 있을 때에는 수면, 운동, 사람과의
연결 같은 자기관리를 시도할 수 있다고 안내한다. 심한 증상이 2주 이상
이어지고 간단한 결정이나 평소 할 일을 수행하기 어렵다면 전문적 도움을
구하라고 한다. 증상이 악화되거나 자기관리가 도움이 되지 않을 때에도 의료진과
상담하도록 권한다.

여기서 2주는 모든 정신질환의 진단 기준이 아니며, 상담을 받기 위해 기다려야
하는 최소 기간도 아니다. 증상이 매우 심하거나 기능이 빠르게 떨어지거나
안전이 걱정되면 기간과 관계없이 바로 도움을 구한다. NIMH 자료는 미국의
일반 안내이므로 한국의 진료와 위기 연락처는 국내 공식 자원을 따라야 한다.

어디서 시작할지는 접근 가능한 자원에 따라 다르다. 대학의 학생상담센터는
학생을 대상으로 상담을 제공할 수 있고, 회사의 근로자 지원 프로그램(EAP)은
직원에게 외부 상담을 연결하기도 한다. 제공 여부, 비용, 이용 횟수, 비밀보장과
위기 대응 범위는 학교와 회사마다 다르다. 안내문을 확인하되, 한 곳에서
필요한 도움을 받지 못했더라도 다른 기관이나 방법을 알아볼 수 있다.

일차의료기관에서 현재 상태를 말하고 정신건강 전문가에게 연결받을 수도
있다. 정신건강의학과 의사, 임상심리사 등 전문가의 역할과 제공 서비스는
자격과 기관에 따라 다르므로 예약 전에 확인한다. 지역 정신건강복지센터는
상담과 지역 자원 연결을 제공한다. 동료와 가족은 예약할 곳이나 절차를 알아보거나 함께
가고, 일상을 확인하는 데 도움을 줄 수 있지만 진단과 위기 대응을 대신하지는
않는다.

의료진이나 상담자에게 말할 때 완성된 설명을 준비할 필요는 없다. 앞에서
적은 시작 시점, 빈도, 기능의 변화, 안전 우려를 보여 주고 어디서부터
설명해야 할지 모르겠다고 말해도 된다. 치료 방식이나 약물의 시작·중단은
이 장에서 정하지 않는다. 당사자와 자격을 갖춘 전문가가 상태와 선택지를
살핀 뒤 결정할 일이다.

## 즉시 도움이 필요한 경우

자해·자살 생각이 있거나 자신 또는 다른 사람에게 즉각적인 생명·신체 위험이
있다면 자기관리 목록을 더 시험하거나 2주를 기다릴 때가 아니다. 자살 위기는
109에 연락할 수 있고, 현장에 경찰의 즉시 개입이 필요하면 112, 응급의료·
구급이 필요하면 119를 이용한다.

> **대한민국 위기 자원 — 2026년 8월 31일 확인**
>
> - **자살예방상담전화 109**: 24시간. 보건복지상담센터
>   [공식 안내](https://www.129.go.kr/109)

>   국가정신건강정보포털

번호와 운영 범위는 바뀔 수 있으므로 이 글을 공개하거나 다시 배포할 때

응급번호와 위기 상담 자원을 이용한다.

도움을 구하는 기준을 완벽하게 판정하려다 도움 요청을 늦출 필요는 없다. 전문가에게
연락하는 일은 진단을 스스로 확정했다는 뜻도, 바로 특정 치료를 선택했다는
뜻도 아니다. 지금 겪는 변화와 안전을 다른 사람과 함께 살펴보겠다는 첫
행동이다.

# Ch.24 — 직업 하나에 맡기지 않는 행복

직업은 삶의 여러 조건을 한꺼번에 바꾼다. 소득과 사는 곳을 정하고, 하루의
시간표와 만나는 사람을 바꾸며, 무엇을 잘하는 사람인지 설명할 말도 준다.
일에서 의미와 소속을 얻는 사람에게 직업은 단순한 생계 수단보다 크다. 그래서
직업이 흔들리면 삶 전체가 흔들린 것처럼 느끼기도 한다.

일을 덜 중요하게 생각한다고 이 문제가 풀리지는 않는다. 해야 할 일은 직업이
실제로 맡고 있는 몫을 보고, 직업 하나가 떠맡지 않아도 될 몫까지 가져갔는지
살피는 것이다.

## 직업이 동시에 움직이는 행복의 칸

Ch.2에서는 행복을 소득·주거·건강·시간·관계 같은 생활 조건과 삶의 평가,
정서, 의미와 기능으로 나누어 보았다. 여기서는 그 구분을 다시 설명하지 않고,
한 직업이 여러 칸을 동시에 어떻게 움직이는지만 본다.

연봉 인상은 소득과 주거의 선택 폭을 넓힐 수 있다. 같은 이동에서 긴 통근과
야간 연락이 생기면 수면과 관계에 쓸 시간이 줄어들기도 한다. 어려운 문제에서
유능감과 의미를 얻더라도 고용이 불안하면 생활 계획을 세우기 어렵다. 반복
업무가 지루한 자리에서도 안정된 근무시간과 소득이 건강과 돌봄을 지키는 조건이
될 수 있다. `좋은 직업`이라는 한 칸으로 합치면 서로 다른 변화가 보이지
않는다.

일에서 가치와 유능감을 얻는 동안에도 생활의 다른 칸은 따로 움직인다. 의미 있는 일을 해도 매일의 탈진은 남고, 요즘 기분이 좋아도 주거와 고용은 따로 움직인다. 직업 선택은 일의 만족과 생활의 변화를
한꺼번에 보되 같은 점수로 뭉개지 않는 일이다.

## 남는 시간이 아닌 일 밖의 시간

여가는 일을 모두 마친 뒤 우연히 남는 시간이 아니다. Kuykendall과 동료들이
37개 효과크기, 11,834명을 종합한 메타분석에서 여가 참여와 주관적 웰빙은
중간 정도의 관련을 보였다. 종단 분석에서는 여가 만족이 이후의 웰빙과,
웰빙이 이후의 여가 만족과 모두 관련됐다. 실험 연구의 수가 적고 여가의
정의도 다양해, 취미 시간을 늘리면 정해진 만큼 행복해진다고 말할 수는 없다.

Wendsche와 Lohmann-Haislah는 퇴근 뒤 일 생각에서 벗어나는 심리적 분리를
다룬 86개 출판물의 91개 독립 표본, 총 38,124명의 자료를 종합했다. 자기보고 자료에서는
심리적 분리 정도가 클수록 소진·피로·신체 불편감이 적었다. 삶의 만족과
전반적인 안녕감, 긍정 정서는 높고 수면과 회복 상태는 더 좋은 경향이 있었다.
연구 결과의 차이가 컸고 대부분 상관·자기보고 설계였으므로 연락을 끊으면
자동으로 행복해진다는 인과 처방은 아니다.

직업마다 심리적 분리가 가능한 조건이 다르다. 당직과 현장
대응이 있는 일에서는 연락을 완전히 끊기 어렵다. 대신 호출 빈도와 순번,
보상, 복구 뒤 휴식이 있는지 볼 수 있다. 평일 저녁에 연락이 없더라도 머릿속에서
계속 해결하지 못한 일을 되풀이한다면 시간표만으로 분리를 판단하기 어렵다.
자신에게 회복이 시작되는 조건이 무엇인지 확인해야 한다.

## 관계를 일터 하나에 모으지 않기

직장은 사람을 만나는 중요한 장소다. 동료에게서 기술과 도움을 얻고, 함께
결과를 만들며 소속을 느낄 수 있다. 일을 통해 생긴 관계를 가볍게 볼 이유는
없다. 다만 상사 교체나 이직, 감원으로 직장 관계가 한꺼번에 바뀔 수 있으므로
일 밖의 관계가 완전히 사라지지 않게 해야 한다.

Holt-Lunstad와 동료들이 148개 전향 관찰연구, 308,849명을 종합한 결과,
더 강한 사회적 관계를 가진 집단은 평균적으로 더 높은 생존 가능성을 보였다.
관찰연구라 개인의 인과 효과나 수명 변화를 예측할 수는 없다. 여기서 관계는
직업 성과를 위한 도구가 아니라 건강과 삶의 독립된 조건으로 다룬다.

가족이나 파트너가 있는 사람에게는 일과 생활의 침범 방향도 따로 볼 필요가
있다. Amstad와 동료들은 427개 효과크기를 분석해 일이 가족생활을 방해하는
갈등과 가족생활이 일을 방해하는 갈등을 구분했다. 두 방향의 갈등은 직무와
조직생활, 결혼과 가족생활에 관한 결과와 모두 관련됐다. 삶의 만족, 건강,
심리적 고통처럼 어느 한쪽에만 속하지 않는 결과와도 관련이 있었다. 가족 형태와 성별 역할, 시대와 문화가 다른 연구를 모았기 때문에
모든 사람에게 같은 균형을 처방하지는 못한다. 그래도 돌봄과 관계를 업무
밖의 개인 문제로 밀어내면 직업 선택의 실제 비용을 놓친다는 점은 남는다.

## 일 밖의 역할을 일정에 넣기

사람은 직함 하나로만 살지 않는다. 누군가의 친구나 가족이고, 돌보는 사람이나
배우는 사람이며, 운동·창작·지역 활동처럼 일과 다른 기준으로 계속하는 일이
있을 수 있다. 어떤 역할을 가져야 한다는 목록은 없고, 중요하다고 말하는 역할이 실제 달력과 관계에서 사라졌는지만 확인할 수 있다.

직업 밖 역할은 남는 시간에만 하는 취미라는 뜻이 아니다. 병원에 갈 시간,
가까운 사람을 만날 시간, 돌봄 약속, 혼자 회복하는 시간처럼 먼저 자리를
잡아야 유지되는 일도 있다. 새 직업의 시간표를 그릴 때에는 근무와 통근을
넣고 남은 칸을 보는 데서 끝내지 않는다. 이번 시기에 지키려는 역할 하나나
둘을 먼저 적고, 그 역할에 필요한 시간과 장소가 실제로 남는지 본다.

직업이 바뀌면 직함과 동료, 잘한다고 인정받던 기준도 함께 바뀔 수 있다.
직업의 의미를 줄일 필요는 없다. 직함이 바뀌어도 이어 갈 역할과 관계가 일 밖에 있는지만 확인한다.

## 다음 선택표에 생활 다시 넣기

직업 조건이 생활에 번지는 경로를 적으면 막연한 워라밸보다 확인할 것이
분명해진다.

| 직업에서 볼 조건 | 생활에 번지는 경로 | 확인할 자료 |
|---|---|---|
| 보상과 고용 | 주거, 의료, 저축, 실업 때의 여유 | 확정 보상, 계약 기간, 보험, 월 고정비 |
| 시간과 장소 | 수면, 통근, 돌봄, 중요한 사람을 만날 시간 | 평시·성수기 근무, 출근 빈도, 호출과 출장 |
| 일의 경계 | 회복, 여가, 퇴근 뒤 정신적 분리 | 연락 규칙, 대기 순번, 휴가 사용, 업무량의 변동 |
| 사람과 문화 | 소속, 도움, 갈등, 일 밖 관계에 남는 에너지 | 직속 상사, 팀 이동, 갈등 처리, 퇴근 뒤 상태 |
| 의미와 정체성 | 삶의 만족, 유능감, 일이 흔들릴 때의 자기평가 | 가치 있다고 느끼는 과업과 직업 밖의 역할 |

표의 모든 칸을 좋게 만들 필요는 없다. 시기에 따라 일을 배우는 데 시간을
더 쓰거나, 소득을 높이기 위해 통근을 감수할 수 있다. 다만 그 비용을
`지금만`이라고 적었다면 언제 다시 볼지와 무엇이 달라져야 끝나는지도 함께
정한다. 기한 없는 희생은 선택이라기보다 생활의 기본값으로 굳기 쉽다.

안정도 두 뜻으로 나누어야 한다. 예측 가능한 소득과 일정은 실제로 비교할
수 있는 생활 조건이다. 어느 자리에 도착하면 불안이 영원히 사라질 것이라는
기대는 직업이 보장할 수 없다. 승진, 정규직 전환, 더 유명한 회사가 구체적인
조건을 개선할 수는 있지만 건강과 관계, 삶의 의미까지 한꺼번에 해결하지는
않는다. 다음 단계가 무엇을 바꾸고 무엇은 그대로 둘지 적어야 한다.

인생은 선택의 연속이고 우리는 행복해지고 싶다. 직업은 그 선택 가운데 시간과
생활을 크게 바꾸는 하나다. 직업을 고를 때에는 일의 내용과 보상뿐 아니라 건강,
관계, 사는 곳, 회복 시간, 직업 밖 역할도 적는다. 지킬 바닥과 이번 시기의 방향,
감수할 비용을 정하고, 모르는 것은 확인한다. 한 번의 선택으로 행복을 완성할 수는
없다. 고른 뒤에는 실제 경험이 쌓일 시간을 주고, 정해 둔 날짜에 지금 만드는
생활이 내가 원한 쪽으로 가고 있는지 다시 본다.

Outcomes”](https://doi.org/10.1037/a0022170)을 참조했다.

</textarea>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function() {
  'use strict';

  var DOC_TITLE = "Life Notes";
  var TOPBAR_TITLE = "Life Notes";
  var OVERVIEW_TITLE = "Life Notes";
  var SEARCH_PLACEHOLDER = "챕터/섹션 검색... (Ctrl+K)";
  var STORAGE_KEY = "life-notes-lang";
  var CHAPTER_GROUPS = [
    {
      label: "Part 1 · 무엇을 위해 고르는가",
      intro: "행복은 한 점수로 계산되지 않는다. 선택 앞에서는 먼저 바닥을 적는다. 좋은 과정이 언제나 좋은 결과를 만들지는 않는다.",
      items: [{"kind":"chapter","num":1},{"kind":"chapter","num":2},{"kind":"chapter","num":3},{"kind":"chapter","num":4}]
    },
    {
      label: "Part 2 · 모를 때의 탐색",
      intro: "선택을 막는 빈칸은 생각만으로 채워지지 않을 때가 많다. 비슷한 경험만 반복하면 비슷한 정보만 들어온다. 필요한 정보를 어느 정도 모았고 바닥을 넘는 선택지가 있다면 한곳을 고른다.",
      items: [{"kind":"chapter","num":5},{"kind":"chapter","num":6},{"kind":"chapter","num":7},{"kind":"chapter","num":8}]
    },
    {
      label: "Part 3 · 삶의 조건인 직업",
      intro: "직업을 고르면 직무만 따라오는 것도 아니다. 급여, 근무시간, 사는 곳, 함께 일할 사람, 고용 안정성, 퇴근 뒤 남는 체력이 한꺼번에 바뀐다.",
      items: [{"kind":"chapter","num":9},{"kind":"chapter","num":10},{"kind":"chapter","num":11},{"kind":"chapter","num":12},{"kind":"chapter","num":13},{"kind":"chapter","num":14}]
    },
    {
      label: "Part 4 · 선택지를 늘리는 사람 되기",
      intro: "역량, 제안, 관계를 통해 다음 선택지를 늘리고 싶다면 15–18장이 이어진다.",
      items: [{"kind":"chapter","num":15},{"kind":"chapter","num":16},{"kind":"chapter","num":17},{"kind":"chapter","num":18}]
    },
    {
      label: "Part 5 · 들어간 뒤에 다시 고르기",
      intro: "입사 뒤 남을지 옮길지 고민한다면 19–21장을 먼저 읽어도 된다.",
      items: [{"kind":"chapter","num":19},{"kind":"chapter","num":20},{"kind":"chapter","num":21}]
    },
    {
      label: "Part 6 · 오래 살 수 있는 선택",
      intro: "번아웃과 정신건강, 일 밖의 생활은 22–24장에서 다룬다.",
      items: [{"kind":"chapter","num":22},{"kind":"chapter","num":23},{"kind":"chapter","num":24}]
    }
  ];

  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
      }
      try { return hljs.highlightAuto(code).value; } catch(e) {}
      return code;
    },
    breaks: false,
    gfm: true
  });
  marked.use({ renderer: { del: function(token) { return '~' + (token.text || token) + '~'; } } });

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  }

  function protectMath(src) {
    var placeholders = [];
    var idx = 0;
    var codeBlocks = [];
    src = src.replace(new RegExp('\\x60\\x60\\x60[\\s\\S]*?\\x60\\x60\\x60', 'g'), function(m) {
      codeBlocks.push(m);
      return '%%CODEBLOCK' + (codeBlocks.length - 1) + '%%';
    });
    var inlineCodes = [];
    src = src.replace(new RegExp('\\x60[^\\x60\\n]+\\x60', 'g'), function(m) {
      inlineCodes.push(m);
      return '%%INLINECODE' + (inlineCodes.length - 1) + '%%';
    });
    src = src.replace(/\$\$([\s\S]*?)\$\$/g, function(m, math) {
      placeholders.push({ display: true, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/\$([^\s$](?:[^$]*[^\s$])?)\$/g, function(m, math) {
      placeholders.push({ display: false, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/%%CODEBLOCK(\d+)%%/g, function(m, i) { return codeBlocks[parseInt(i, 10)]; });
    src = src.replace(/%%INLINECODE(\d+)%%/g, function(m, i) { return inlineCodes[parseInt(i, 10)]; });
    return { src: src, placeholders: placeholders };
  }

  function restoreAndRenderMath(html, placeholders) {
    return html.replace(/%%MATH(\d+)%%/g, function(m, i) {
      var p = placeholders[parseInt(i, 10)];
      try {
        return katex.renderToString(p.math, { displayMode: p.display, throwOnError: false, trust: true });
      } catch(e) {
        return p.display ? '$$' + p.math + '$$' : '$' + p.math + '$';
      }
    });
  }

  var state = { observer: null, scrollHandler: null };
  var contentEl = document.getElementById('content');
  var loadingEl = document.getElementById('loading');
  var tocContainer = document.getElementById('toc-container');

  function applyChrome() {
    document.documentElement.lang = 'ko';
    document.title = DOC_TITLE;
    document.getElementById('topbar-title').textContent = TOPBAR_TITLE;
    document.getElementById('search-input').placeholder = SEARCH_PLACEHOLDER;
    document.getElementById('toc-no-results').textContent = '검색 결과 없음';
    document.getElementById('loading-text').textContent = '가이드 렌더링 중...';
    document.querySelectorAll('#lang-toggle a').forEach(function(a) { a.classList.add('active'); });
    try { localStorage.setItem(STORAGE_KEY, 'ko'); } catch(e) {}
  }

  function parseHeading(text) {
    var ch = text.trim().match(/^Ch\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ch) return { kind: 'chapter', num: parseInt(ch[1], 10), title: ch[2].trim(), label: 'Ch.' + parseInt(ch[1], 10) };
    var ex = text.trim().match(/^E\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ex) return { kind: 'excerpt', num: parseInt(ex[1], 10), title: ex[2].trim(), label: 'E.' + parseInt(ex[1], 10) };
    return null;
  }

  function parseGroupLabel(label) {
    var parts = label.split('·');
    if (parts.length < 2) return { kicker: '', title: label.trim() };
    return { kicker: parts[0].trim(), title: parts.slice(1).join('·').trim() };
  }

  function findEntryHeading(item) {
    var h1s = contentEl.querySelectorAll('h1');
    for (var i = 0; i < h1s.length; i++) {
      var parsed = parseHeading(h1s[i].textContent);
      if (parsed && parsed.kind === item.kind && parsed.num === item.num) return h1s[i];
    }
    return null;
  }

  function annotateEntryHeadings() {
    contentEl.querySelectorAll('h1').forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      h1.classList.add(parsed.kind === 'excerpt' ? 'excerpt-heading' : 'chapter-heading');
    });
  }

  function buildPartIntros() {
    annotateEntryHeadings();
    CHAPTER_GROUPS.forEach(function(group, index) {
      var first = null;
      for (var i = 0; i < group.items.length; i++) {
        first = findEntryHeading(group.items[i]);
        if (first) break;
      }
      if (!first) return;

      var meta = parseGroupLabel(group.label);
      var partId = 'part-' + index + '-' + slugify(meta.title);
      if (document.getElementById(partId)) return;

      var section = document.createElement('section');
      section.className = 'part-intro';

      var kicker = document.createElement('div');
      kicker.className = 'part-kicker';
      kicker.textContent = meta.kicker || 'Part';
      section.appendChild(kicker);

      var title = document.createElement('h1');
      title.className = 'part-title';
      title.id = partId;
      title.textContent = meta.title;
      section.appendChild(title);

      if (group.intro) {
        var intro = document.createElement('p');
        intro.textContent = group.intro;
        section.appendChild(intro);
      }

      first.parentNode.insertBefore(section, first);
    });
  }

  function render() {
    applyChrome();
    contentEl.style.display = 'none';
    loadingEl.style.display = 'flex';

    requestAnimationFrame(function() {
      var src = document.getElementById('md-source-ko').value;
      src = src.replace(/\*\*([^*\n]+)\*\*(?=[가-힣])/g, '<strong>$1</strong>');
      var mathData = protectMath(src);
      var html = marked.parse(mathData.src);
      html = restoreAndRenderMath(html, mathData.placeholders);
      contentEl.innerHTML = html;
      contentEl.querySelectorAll('a[href]').forEach(function(link) {
        var url = new URL(link.getAttribute('href'), window.location.href);
        if ((url.protocol === 'http:' || url.protocol === 'https:') && url.origin !== window.location.origin) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
      });

      if (window.mermaid) {
        var mermaidBlocks = contentEl.querySelectorAll('pre > code.language-mermaid');
        mermaidBlocks.forEach(function(code, i) {
          var pre = code.parentElement;
          var container = document.createElement('div');
          container.className = 'mermaid';
          container.id = 'mermaid-ko-' + i;
          container.textContent = code.textContent;
          pre.replaceWith(container);
        });
        try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}
      }

      tocContainer.innerHTML = '';
      buildPartIntros();
      buildOverview();
      buildTOC();
      contentEl.style.display = 'block';
      loadingEl.style.display = 'none';
      setupScrollTracking();

      if (window.location.hash) {
        var initId = window.location.hash.slice(1);
        var initTarget = document.getElementById(initId);
        if (initTarget) window.scrollTo(0, initTarget.getBoundingClientRect().top + window.scrollY - 60);
      }
    });
  }

  render();
  setupSearch();
  setupProgressBar();
  setupMobileMenu();
  setupKeyboard();
  setupTocDelegation();

  function setupTocDelegation() {
    tocContainer.addEventListener('click', function(e) {
      if (e.target.closest('.toc-item')) closeMobileSidebar();
    });
  }

  function buildOverview() {
    var h1s = contentEl.querySelectorAll('h1');
    var entries = {};

    h1s.forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      var sections = [];
      var node = h1.nextElementSibling;
      while (node && node.tagName !== 'H1') {
        if (node.tagName === 'H2') {
          if (!node.id) node.id = slugify(node.textContent);
          sections.push({ text: node.textContent.trim(), id: node.id });
        }
        node = node.nextElementSibling;
      }
      entries[parsed.kind + '-' + parsed.num] = {
        kind: parsed.kind,
        num: parsed.num,
        label: parsed.label,
        title: parsed.title,
        id: h1.id,
        sections: sections
      };
    });

    if (Object.keys(entries).length === 0) return;

    var overview = document.createElement('section');
    overview.className = 'guide-overview';
    var header = document.createElement('div');
    header.className = 'overview-header';
    var oTitle = document.createElement('h1');
    oTitle.className = 'overview-title';
    oTitle.textContent = OVERVIEW_TITLE;
    header.appendChild(oTitle);
    overview.appendChild(header);

    CHAPTER_GROUPS.forEach(function(group) {
      var valid = group.items.map(function(item) { return entries[item.kind + '-' + item.num]; }).filter(Boolean);
      if (!valid.length) return;
      var groupEl = document.createElement('div');
      groupEl.className = 'overview-group';
      var label = document.createElement('div');
      label.className = 'overview-group-label';
      label.setAttribute('role', 'heading');
      label.setAttribute('aria-level', '2');
      label.textContent = group.label;
      groupEl.appendChild(label);
      if (group.intro) {
        var intro = document.createElement('p');
        intro.className = 'overview-group-intro';
        intro.textContent = group.intro;
        groupEl.appendChild(intro);
      }

      valid.forEach(function(entry) {
        var wrap = document.createElement('div');
        wrap.className = 'overview-chapter';
        var link = document.createElement('a');
        link.className = 'overview-chapter-link';
        link.href = '#' + entry.id;
        var num = document.createElement('span');
        num.className = 'overview-chapter-num';
        num.textContent = entry.label;
        link.appendChild(num);
        link.appendChild(document.createTextNode(entry.title));
        wrap.appendChild(link);
        groupEl.appendChild(wrap);
      });
      overview.appendChild(groupEl);
    });

    var about = contentEl.querySelector('.about-document');
    if (about) contentEl.insertBefore(overview, about.nextSibling);
    else contentEl.insertBefore(overview, contentEl.firstChild);
  }

  function buildTOC() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var fragment = document.createDocumentFragment();
    headings.forEach(function(heading) {
      if (!heading.id) heading.id = slugify(heading.textContent);
      if (heading.classList.contains('overview-title')) return;

      var link = document.createElement('a');
      var parsed = parseHeading(heading.textContent);
      var tocClass = 'toc-section';
      if (heading.classList.contains('part-title')) tocClass = 'toc-part';
      else if (parsed) tocClass = 'toc-chapter' + (parsed.kind === 'excerpt' ? ' toc-excerpt' : '');
      link.className = 'toc-item ' + tocClass;
      link.href = '#' + heading.id;
      if (heading.classList.contains('part-title')) {
        var kicker = heading.parentElement ? heading.parentElement.querySelector('.part-kicker') : null;
        link.textContent = (kicker ? kicker.textContent + ' · ' : '') + heading.textContent;
      } else {
        link.textContent = heading.textContent;
      }
      link.dataset.headingId = heading.id;
      fragment.appendChild(link);
    });
    tocContainer.appendChild(fragment);
  }

  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/<[^>]+>/g, '')
      .replace(/[^\w\s가-힣-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 80) || 'section';
  }

  function setupScrollTracking() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var tocItems = tocContainer.querySelectorAll('.toc-item');
    if (headings.length === 0) return;
    if (state.observer) state.observer.disconnect();

    var tocMap = {};
    tocItems.forEach(function(item) { tocMap[item.dataset.headingId] = item; });
    var currentActive = null;
    var observer = new IntersectionObserver(function(entries) {
      var topHeading = null;
      var topOffset = Infinity;
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var rect = entry.target.getBoundingClientRect();
          if (rect.top < topOffset) { topOffset = rect.top; topHeading = entry.target; }
        }
      });
      if (topHeading) {
        if (currentActive) currentActive.classList.remove('active');
        var item = tocMap[topHeading.id];
        if (item) {
          item.classList.add('active');
          currentActive = item;
          var itemRect = item.getBoundingClientRect();
          var containerRect = tocContainer.getBoundingClientRect();
          if (itemRect.top < containerRect.top || itemRect.bottom > containerRect.bottom) item.scrollIntoView({ block: 'center', behavior: 'auto' });
        }
      }
    }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });
    headings.forEach(function(h) { observer.observe(h); });
    state.observer = observer;

    if (!state.scrollHandler) {
      var ticking = false;
      state.scrollHandler = function() {
        if (!ticking) {
          requestAnimationFrame(function() {
            var curHeadings = contentEl.querySelectorAll('h1, h2');
            var curTocItems = tocContainer.querySelectorAll('.toc-item');
            var curMap = {};
            curTocItems.forEach(function(item) { curMap[item.dataset.headingId] = item; });
            var found = null;
            var scrollTop = window.scrollY + 80;
            for (var i = curHeadings.length - 1; i >= 0; i--) {
              if (curHeadings[i].offsetTop <= scrollTop) { found = curHeadings[i]; break; }
            }
            if (found) {
              var active = tocContainer.querySelector('.toc-item.active');
              if (active) active.classList.remove('active');
              var item = curMap[found.id];
              if (item) item.classList.add('active');
            }
            ticking = false;
          });
          ticking = true;
        }
      };
      window.addEventListener('scroll', state.scrollHandler);
    }
  }

  function setupSearch() {
    var searchInput = document.getElementById('search-input');
    var noResults = document.getElementById('toc-no-results');
    searchInput.addEventListener('input', function() {
      var query = this.value.trim().toLowerCase();
      var tocItems = tocContainer.querySelectorAll('.toc-item');
      if (!query) {
        tocItems.forEach(function(item) { item.classList.remove('toc-hidden'); });
        noResults.style.display = 'none';
        return;
      }
      var matchCount = 0;
      tocItems.forEach(function(item) {
        var text = item.textContent.toLowerCase();
        if (text.includes(query)) { item.classList.remove('toc-hidden'); matchCount++; }
        else item.classList.add('toc-hidden');
      });
      noResults.style.display = matchCount === 0 ? 'block' : 'none';
    });
  }

  function setupProgressBar() {
    var progressBar = document.getElementById('progress-bar');
    var ticking = false;
    function updateProgress() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = Math.min(progress, 100) + '%';
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() { updateProgress(); ticking = false; });
        ticking = true;
      }
    });
    updateProgress();
  }

  function setupMobileMenu() {
    var toggle = document.getElementById('menu-toggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.querySelector('#sidebar-overlay');
    toggle.addEventListener('click', function() {
      var isOpen = sidebar.classList.toggle('open');
      overlay.classList.toggle('visible', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    overlay.addEventListener('click', closeMobileSidebar);
  }

  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.querySelector('#sidebar-overlay').classList.remove('visible');
    document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
  }

  function setupKeyboard() {
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });
  }
})();
</script>
