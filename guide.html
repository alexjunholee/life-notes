<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Notes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f7;
  --bg-sidebar: #f5f5f7;
  --bg-code: #f5f5f7;
  --bg-surface: #f5f5f7;

  --text: #1d1d1f;
  --text-body: rgba(0, 0, 0, 0.8);
  --text-muted: rgba(0, 0, 0, 0.56);
  --text-tertiary: rgba(0, 0, 0, 0.48);
  --text-heading: #1d1d1f;

  --accent: #0071e3;
  --link: #0066cc;

  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);

  --sidebar-width: 300px;
  --topbar-height: 52px;
  --progress-height: 3px;

  --shadow-elev: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px;
}

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  font-feature-settings: "kern", "liga", "calt";
  word-break: keep-all;
  overflow-wrap: break-word;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: var(--progress-height);
  background: linear-gradient(90deg, #0071e3, #2997ff);
  z-index: 10000;
  transition: width 0.1s linear;
  width: 0%;
}

#topbar {
  position: fixed;
  top: var(--progress-height);
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
}

#topbar .menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  margin-right: 12px;
  padding: 6px 10px;
  border-radius: 8px;
}

#topbar .menu-toggle:hover { background: rgba(0,0,0,0.04); }

#topbar .title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  letter-spacing: -0.022em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#topbar .back-link {
  margin-left: 16px;
  color: var(--link);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 980px;
  border: 1px solid var(--border);
  letter-spacing: -0.014em;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

#topbar .back-link:hover {
  background: rgba(0, 113, 227, 0.06);
  border-color: var(--accent);
  color: var(--accent);
}

/* Language toggle — inline link style (no box) */
#topbar .lang-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  letter-spacing: -0.010em;
}
#topbar .lang-toggle a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 2px;
  transition: color 0.15s;
  cursor: pointer;
}
#topbar .lang-toggle a:hover { color: var(--text); }
#topbar .lang-toggle a.active {
  color: var(--text-heading);
  font-weight: 600;
}
#topbar .lang-toggle .sep { color: var(--border-strong); }

#sidebar {
  position: fixed;
  top: calc(var(--progress-height) + var(--topbar-height));
  left: 0;
  width: var(--sidebar-width);
  height: calc(100vh - var(--topbar-height) - var(--progress-height));
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 999;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,0.16) transparent;
}

#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: 3px; }

#search-box {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.6);
  flex-shrink: 0;
}

#search-input {
  width: 100%;
  padding: 9px 12px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  font-family: inherit;
  letter-spacing: -0.016em;
  transition: border-color 0.15s, box-shadow 0.15s;
}

#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
#search-input::placeholder { color: var(--text-muted); }

#toc-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 32px;
}

#toc-container::-webkit-scrollbar { width: 4px; }
#toc-container::-webkit-scrollbar-track { background: transparent; }
#toc-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

/* Chapter level (h1) */
.toc-item {
  display: block;
  padding: 8px 16px 8px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.014em;
  border-left: 3px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  cursor: pointer;
}

/* Section (h2) */
.toc-item.toc-h2 {
  padding: 5px 16px 5px 36px;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: -0.012em;
}

.toc-item.toc-h2 + .toc-item:not(.toc-h2) { margin-top: 6px; }

.toc-item:hover {
  color: var(--text);
  background: rgba(0, 0, 0, 0.04);
}

.toc-item.toc-h2:hover { color: var(--text); }

.toc-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(0, 113, 227, 0.08);
  font-weight: 700;
}

.toc-item.toc-h2.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-part {
  padding: 14px 16px 8px 20px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  letter-spacing: 0;
}

.toc-item.toc-part:not(:first-child) { margin-top: 16px; }

.toc-item.toc-chapter {
  padding: 6px 16px 6px 31px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0;
}

.toc-item.toc-section {
  padding: 4px 16px 4px 46px;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0;
}

.toc-item.toc-section:hover { color: var(--text); }

.toc-item.toc-section.active {
  font-weight: 500;
  color: var(--accent);
}

.toc-item.toc-hidden { display: none; }

.toc-no-results {
  padding: 20px 16px;
  color: var(--text-muted);
  font-size: 13.5px;
  text-align: center;
  display: none;
  letter-spacing: -0.014em;
}

#main-content {
  margin-left: var(--sidebar-width);
  margin-top: calc(var(--progress-height) + var(--topbar-height));
  min-height: calc(100vh - var(--topbar-height) - var(--progress-height));
  padding: 56px 56px 96px;
}

#content {
  max-width: 820px;
  margin: 0 auto;
}

#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  color: var(--text-heading);
  font-feature-settings: "ss01", "kern";
  scroll-margin-top: 72px;
}

#content h1 {
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  margin: 0 0 28px 0;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

#content h1:not(:first-of-type) {
  margin-top: 96px;
}

#content h1 + blockquote {
  border-left: none;
  background: transparent;
  text-align: center;
  font-size: 18px;
  color: var(--text-muted);
  padding: 8px 0 24px;
  letter-spacing: -0.018em;
}

#content h2 {
  font-size: 30px;
  font-weight: 600;
  line-height: 1.10;
  letter-spacing: -0.014em;
  margin: 56px 0 18px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

#content h3 {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.16;
  letter-spacing: -0.012em;
  margin: 40px 0 12px 0;
}

#content h4 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.010em;
  margin: 28px 0 10px 0;
}

#content h5, #content h6 {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  margin: 24px 0 8px 0;
}

#content p { margin: 0 0 16px 0; color: var(--text-body); }

#content a {
  color: var(--link);
  text-decoration: none;
  transition: color 0.15s;
}

#content a:hover { text-decoration: underline; text-underline-offset: 2px; }

#content ul, #content ol {
  margin: 0 0 16px 0;
  padding-left: 28px;
}

#content li { margin-bottom: 6px; color: var(--text-body); }
#content li > ul, #content li > ol { margin-top: 6px; margin-bottom: 6px; }

#content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 56px 0;
}

#content strong { color: var(--text); font-weight: 600; }

#content img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  margin: 12px 0;
}

#content code {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.82em;
  letter-spacing: 0;
}

#content :not(pre) > code {
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 5px;
  color: var(--text);
}

#content pre {
  background: var(--bg-code);
  border: none;
  border-radius: 12px;
  padding: 18px 20px;
  overflow-x: auto;
  margin: 0 0 20px 0;
  font-size: 13px;
  line-height: 1.55;
}

#content pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
}

#content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 20px 0;
  font-size: 15px;
  display: block;
  overflow-x: auto;
}

#content thead { background: var(--bg-surface); }

#content th {
  padding: 12px 16px;
  text-align: left;
  color: var(--text-heading);
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid var(--border-strong);
  letter-spacing: -0.012em;
}

#content td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text-body);
  letter-spacing: -0.016em;
}

#content tbody tr:hover { background: rgba(0, 113, 227, 0.04); }

#content blockquote {
  border-left: 3px solid var(--accent);
  background: var(--bg-surface);
  padding: 14px 22px;
  margin: 0 0 20px 0;
  border-radius: 0 8px 8px 0;
  color: var(--text-body);
}

#content blockquote p { margin-bottom: 8px; }
#content blockquote p:last-child { margin-bottom: 0; }

#content blockquote strong { color: var(--accent); }

.katex { font-size: 1.05em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 20px 0; }

::selection { background: rgba(0, 113, 227, 0.20); color: var(--text); }

mark.search-highlight {
  background: rgba(0, 113, 227, 0.18);
  color: inherit;
  padding: 1px 3px;
  border-radius: 3px;
}

/* About This Document (university-math style) */
.about-document {
  margin: 0 0 56px 0;
  padding: 24px 28px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.about-document h2 {
  border-bottom: none !important;
  margin: 0 0 14px 0 !important;
  padding-bottom: 0 !important;
  font-size: 24px !important;
  line-height: 1.18 !important;
}
.about-document h4 {
  color: var(--link) !important;
  margin-top: 22px !important;
}
.about-document table { margin-top: 10px !important; }
.about-document p:last-child,
.about-document ul:last-child { margin-bottom: 0 !important; }
.about-document .source-tag {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 18px;
}

/* Guide Overview (at top of content) */
.guide-overview {
  margin: 0 0 80px 0;
  padding: 0 0 48px 0;
  border-bottom: 1px solid var(--border);
}
.guide-overview .overview-header { margin-bottom: 44px; }
.guide-overview .overview-title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 48px;
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.018em;
  color: var(--text-heading);
  margin: 0 0 10px 0;
}
.overview-group {
  margin-top: 44px;
  padding-left: 22px;
  border-left: 2px solid var(--border);
}
.overview-group:first-child { margin-top: 0; }
.overview-group-label {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 24px;
  font-weight: 650;
  line-height: 1.22;
  color: var(--text-heading);
  letter-spacing: 0;
  margin: 0 0 8px 0;
}
.overview-group-intro {
  max-width: 760px;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.62;
  margin: 0 0 22px 0;
}
.overview-chapter { margin: 0 0 16px 14px; }
.overview-chapter:last-child { margin-bottom: 0; }
.overview-chapter-link {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-heading);
  text-decoration: none;
  letter-spacing: 0;
  display: inline-block;
}
.overview-chapter-link:hover { color: var(--accent); }
.overview-chapter-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 10px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

#content .part-intro {
  margin: 92px 0 34px;
  padding: 42px 0 30px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.guide-overview + .part-intro { margin-top: 70px; }

#content .part-kicker {
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

#content h1.part-title {
  font-size: 52px;
  font-weight: 650;
  line-height: 1.07;
  letter-spacing: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

#content .part-intro p {
  max-width: 760px;
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1.68;
  margin: 18px 0 0 0;
}

#content h1.chapter-heading,
#content h1.excerpt-heading {
  font-size: 34px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: 0;
  margin-top: 56px;
  padding-bottom: 10px;
}

#content .part-intro + h1.chapter-heading,
#content .part-intro + h1.excerpt-heading {
  margin-top: 36px;
}

@media (max-width: 900px) {
  #content h1.part-title { font-size: 40px; }
  #content h1.chapter-heading,
  #content h1.excerpt-heading { font-size: 30px; }
}

@media (max-width: 600px) {
  .overview-group { padding-left: 16px; }
  .overview-group-label { font-size: 21px; }
  #content .part-intro { margin-top: 72px; padding: 34px 0 26px; }
  #content h1.part-title { font-size: 32px; }
  #content .part-intro p { font-size: 16px; }
  #content h1.chapter-heading,
  #content h1.excerpt-heading { font-size: 28px; }
}
@media (max-width: 1024px) {
  #main-content { padding-left: 40px; padding-right: 40px; }
}

@media (max-width: 900px) {
  #topbar .menu-toggle { display: block; }

  #sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    box-shadow: none;
  }

  #sidebar.open {
    transform: translateX(0);
    box-shadow: var(--shadow-elev);
  }

  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 998;
  }

  #sidebar-overlay.visible { display: block; }

  #main-content { margin-left: 0; padding: 24px 24px 56px; }

  #content h1 { font-size: 36px; }
  #content h2 { font-size: 26px; margin-top: 44px; }
  #content h3 { font-size: 20px; }
  #content h4 { font-size: 17px; }
}

@media (max-width: 600px) {
  body { font-size: 16px; }
  #content h1 { font-size: 30px; }
  #content h2 { font-size: 22px; }
  #content h3 { font-size: 18px; }
  #main-content { padding: 20px 20px 48px; }
}

@media print {
  #progress-bar, #topbar, #sidebar, #sidebar-overlay, #search-box, .menu-toggle { display: none !important; }
  #main-content { margin: 0 !important; padding: 0 !important; }
  #content { max-width: 100%; color: #000; }
  #content h1, #content h2, #content h3, #content h4, #content strong { color: #000; }
  #content a { color: #1a0dab; text-decoration: underline; }
  #content pre, #content code { background: #f5f5f7; color: #000; border: none; }
  #content blockquote { background: #f5f5f7; border-left-color: #999; }
  #content table { border: 1px solid #ccc; }
  #content th, #content td { border: 1px solid #ccc; }
  body { background: #fff; }
}
</style>
</head>
<body>

<div id="progress-bar"></div>

<div id="topbar">
  <button class="menu-toggle" id="menu-toggle" aria-label="목차" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
  <span class="title" id="topbar-title">Life Notes</span>
  <div class="lang-toggle" id="lang-toggle" aria-hidden="true"></div>
  <a href="../" class="back-link">← repos</a>
</div>

<div id="sidebar-overlay"></div>

<nav id="sidebar" aria-label="문서 목차">
  <div id="search-box">
    <input type="text" id="search-input" aria-label="챕터 및 섹션 검색" placeholder="챕터/섹션 검색... (Ctrl+K)">
  </div>
  <div id="toc-container"></div>
  <div class="toc-no-results" id="toc-no-results">검색 결과 없음</div>
</nav>

<main id="main-content">
  <div id="loading">
    <div class="spinner"></div>
    <span id="loading-text">가이드 렌더링 중...</span>
  </div>
  <div id="content" style="display:none;"></div>
</main>

<textarea id="md-source-ko" style="display:none;">
<div class="about-document">
<h2>이 안내서에 대하여</h2>

<h4>출처 자료</h4>
<p>각 장 끝에는 본문에서 실제로 참고한 논문과 공공기관 자료를 달아 두었다. 연구 결과를 인용할 때는 그 연구의 대상과 설계가 어디까지 말할 수 있는지도 본문 안에 함께 적어, 과장된 일반화를 피하려 했다.</p>

<table>

<p>인생은 선택의 연속이고, 기왕이면 잘 선택해 행복하게 살고 싶다. 이 책은 진로를 고민하는 공학계열 학부생과 초기 경력 엔지니어를 위해 자료를 바탕으로 쓴 안내서다. 정답인 직업을 하나 골라 주는 대신, 행복을 이루는 생활 조건을 나누어 보고, 모르는 것을 직접 확인한 뒤, 일정 기간 실행해 보고 다시 판단하는 방법을 다룬다. 연구직도 제품·인프라·현장·기술 관리와 나란히 놓인 여러 진로 가운데 하나로 살핀다.</p>

# 1장 어떤 선택을 할 것인가

인생은 선택의 연속이고, 기왕이면 더 나은 선택을 해 행복하게 살고 싶다. 하지만 막상 갈림길에 서면 막막함이 먼저 찾아온다. 선택에 전략이 필요한 이유는 단순하다. 우리가 바라는 조건을 한꺼번에 채워 주는 선택지는 드물고, 어떤 결과를 낳을지는 직접 겪어 봐야 비로소 드러나기 때문이다. 새로운 정보 없이 머릿속으로만 고민을 굴리면 이미 아는 장단점을 제자리에서 되풀이하게 된다. 그래서 잘한 선택인지 따질 때도 결과가 옳았는지부터 묻기 전에, 결정하던 순간에 무엇을 지키려 했는지, 무엇을 모른 채로 두었는지, 언제 다시 점검하기로 약속했는지를 먼저 살핀다.

결국 모든 선택은 다음 한 문장으로 돌아온다.

> 지금 이 선택으로 어떤 삶을 만들려고 하는가?

이 질문에 곧바로 완벽한 답을 내놓을 필요는 없다. 대신 막연한 고민을 실제로 움직일 수 있는 순서로 풀어 놓아야 한다.

## 선택의 한 바퀴

하나의 선택은 아래 다섯 단계를 차례로 밟으며 한 바퀴를 돈다.

| 단계 | 할 일 | 다음 단계로 넘어갈 때 남길 것 |
|---|---|---|
| 바닥 | 건강, 안전, 생활비처럼 깨지면 선택을 유지하기 어려운 조건을 찾는다 | 탈락시킬 조건 |
| 방향 | 이번 시기에 더 얻고 싶은 것을 정한다 | 우선할 방향 한두 개 |
| 탐색 | 선택을 뒤집을 만큼 중요한 빈칸을 줄인다 | 새로 확인한 사실과 남은 의문 |
| 실행 | 충분한 선택 하나에 시간과 행동을 배정한다 | 실행 구간과 첫 행동 |
| 재검토 | 결과와 과정을 나누어 보고 계속·수정·중단을 정한다 | 바꿀 조건과 다음 검토일 |

한 바퀴가 끝나고 재검토에서 새 정보를 얻으면 다음 바닥과 방향을 다시 조정하기도 한다. 그렇다고 어제의 결정을 매일 아침 백지로 되돌리지는 않는다. 각 단계를 지날 때 다음 단계로 넘길 기록을 단 한 줄이라도 남기면, 끝없는 고민과 실제 실행이 자연스럽게 구분된다.

## 바닥과 방향 먼저 고르기

첫 두 단계인 바닥과 방향을 세우려면 행복을 이루는 조건부터 뜯어보아야 한다. 행복은 기분 하나로 결정되지 않고 여러 생활 조건이 맞물려 돌아간다. OECD의 웰빙 틀 역시 소득, 건강, 일, 주거, 관계, 안전처럼 서로 다른 조건을 한데 뭉뚱그리지 않고 따로 살핀다. 개인의 선택에서도 이 틀을 빠뜨린 조건이 없는지 점검하는 목록으로 빌려 쓸 수 있다(→ [2장](./chapter_02_multidimensional_happiness.md)).

선택지 앞에 섰다면 가장 먼저 '바닥'부터 적는다. 건강이나 안전, 최소 생활비, 돌봄과 체류 조건처럼 다른 장점이 아무리 커도 쉽게 메울 수 없는 조건들이다. 그 바닥을 지킨 위에서 이번 시기에 집중할 '방향'을 한두 개 고른다. 기술을 빠르게 쌓아야 할 때인지, 무너진 생활을 안정시킬 때인지, 더 큰 책임이나 자율성을 시험해 볼 때인지에 따라 똑같은 선택지의 의미도 전혀 달라진다(→ [3장](./chapter_03_decision_criteria.md)).

특히 직업을 고를 때는 직무 이름 하나만 보지 않아야 한다. 직업을 정하는 순간 급여와 근무시간, 사는 곳, 함께 일할 사람, 고용 안정성, 퇴근 뒤 남는 체력까지 하루의 풍경이 한꺼번에 바뀐다. 회사 이름이나 직무명에 점수를 매기기 전에, 그 선택이 내 하루를 어떻게 바꾸어 놓을지부터 적어야 하는 이유가 여기에 있다. 3부에서는 엔지니어의 실제 과업과 조직 조건을 바로 이 생활 단위로 내려가 살핀다.

## 움직여서 모르는 것 줄이기

기준을 세웠어도 막상 비교하려 하면 빈칸이 남는다. 게다가 선택을 막는 빈칸은 책상 앞에서 생각만 굴린다고 채워지지 않을 때가 많다. 실제 업무가 어떤지 모르면 현직자에게 하루의 시간 배분과 책임을 묻고, 내가 그 작업을 견딜 수 있는지 모르면 작은 프로젝트나 현장 경험으로 몸을 움직여 확인한다. 물론 한 번의 시도로 직업 전체를 판정할 수는 없다. 그래도 한 번 부딪혀 보면 다음 질문만큼은 훨씬 뾰족해진다.

이때 익숙한 경험만 되풀이하면 들어오는 정보도 늘 비슷한 틀에 갇힌다. 그래서 가끔은 지금 걷고 있는 경로 밖의 경험을 작게 섞어 볼 필요가 있다. 이 책에서 말하는 **랜덤 워크**가 바로 이것이다. 수학의 random walk나 강화학습의 탐색 정책과는 다른 뜻으로, 잃어도 감당할 수 있는 상한과 끝낼 날짜를 미리 정해 두고 가볍게 시도해 보는 탐색을 가리킨다(→ [7장](./chapter_07_random_walk.md)).

탐색에는 내 생각뿐 아니라 다른 사람의 반응도 필요하다. 아직 덜 다듬어진 생각이라도 가설이라고 밝힌 채 밖에 내놓고, 무엇을 확인하고 싶은지 말하며, 작은 시험에 필요한 도움을 청해 보아야 한다. **헛소리를 잘한다**는 말은 바로 이처럼 설익은 가설을 꺼내 놓는 능력을 뜻한다. 반대로 **셀링**은 상대가 다음 행동을 판단할 수 있도록 문제의 핵심과 내가 하려는 시험을 또렷하게 설명하는 일이다(→ [17장](./chapter_17_babble_selling.md)).

## 고른 뒤 실행 구간 주기

필요한 정보를 어느 정도 모았고 바닥을 넘기는 선택지가 나타났다면, 이제 한곳을 골라 움직일 차례다. 완벽한 확신이 들 때까지 기다리지 않아도 된다. 어느 쪽을 택해도 엇비슷해 보인다면 되돌리기 쉬운 쪽, 그리고 설령 틀리더라도 다음 판단에 쓸 능력이나 정보를 남기는 쪽으로 먼저 발을 내디딜 수 있다.

한 번 **결정했으면 한동안 돌아보지 마라.** 한 학기, 인턴 한 번, 프로젝트 한 주기처럼 실제 작업이 손에 잡히고 피드백이 돌아올 시간 동안은 다른 선택지와 저울질하기를 멈추라는 뜻이다. 그 시간 동안에는 첫 행동을 달력에 박아 두고, 막혔을 때 누구에게 무엇을 물을지도 미리 정해 둔다(→ [8장](./chapter_08_commit.md)).

물론 정해 둔 날짜 전이라도 예외 없이 결정을 다시 열어야 할 때가 있다. 바로 바닥이 깨졌을 때다. 건강과 안전이 눈에 띄게 나빠졌거나, 약속받은 역할과 실제 맡은 일이 크게 다르거나, 계속 버틸수록 되돌리기 어려운 손실이 빠르게 불어난다면 기다리지 않고 멈춰 서야 한다(→ [20장](./chapter_20_stay_or_leave.md)).

## 결과와 판단 나누어 보기

실행 구간을 지나고 나면 결과를 마주하게 된다. 그런데 아무리 꼼꼼한 과정을 거쳐도 결과가 늘 좋게 나오는 것은 아니다. Baron과 Hershey의 실험에서도 참가자들은 결정에 이르는 과정이 똑같았는데도 좋은 결과가 붙은 판단을 더 높게 평가했다. 다만 이 실험은 실제 진로를 추적한 연구가 아니므로, 결과를 알고 나면 당시의 판단 과정과 사후에 알게 된 새 정보를 뒤섞어 평가하기 쉽다는 점까지 확인해 줄 뿐이다(→ [4장](./chapter_04_decision_vs_outcome.md)).

그래서 돌아보는 일도 거창할 필요 없이 다음 두 줄을 나누어 적는 것으로 시작할 수 있다.

```text
당시 정보로 고칠 수 있었던 과정:
이번 결과로 새로 알게 된 조건:
```

첫째 줄에 적은 '당시 정보로 고칠 수 있었던 과정'은 다음 결정을 준비하고 자료를 모으는 방식을 손보는 데 쓴다. 둘째 줄에 적은 '이번 결과로 새로 알게 된 조건'은 선택지를 두고 내가 세웠던 예상을 현실에 맞게 고치는 데 쓴다. 이 두 줄을 떼어 놓고 볼 수 있어야 운에 일희일비하지 않고 다음 한 바퀴를 더 단단하게 돌 수 있다.

지금까지 선택의 큰 흐름을 훑어보았다. 그렇다면 모든 단계의 출발점인 '행복한 삶'은 구체적으로 어떤 조각들로 이루어져 있을까? 다음 장에서는 막연한 행복이라는 말을 여러 생활 조건과 질문으로 나누어 살펴본다.

# 2장 행복의 여러 측면

선택을 잘하려면 무엇을 더 낫게 만들려는지부터 분명해야 한다. 하지만 막상 "행복해지고 싶다"고 말해 놓고 보면 그 안에 서로 다른 질문이 한데 엉켜 있는 경우가 많다. 요즘 기분이 괜찮은지, 내 삶 전체에 대체로 만족하는지, 지금 하는 일이 가치 있다고 느끼는지, 아니면 건강과 돈, 시간과 관계 면에서 오늘의 생활이 버틸 만한지를 묻고 있을 수도 있다. 문제는 이 질문들의 답이 늘 같은 방향으로 움직이지 않는다는 점이다. 답이 서로 엇갈릴수록 우리는 무엇을 행복이라 부르며 고를지부터 나누어 보아야 한다.

## 오늘의 기분과 삶 전체의 평가

OECD의 주관적 웰빙 측정 지침은 사람들이 느끼는 행복을 크게 삶의 평가, 정서, 유다이모니아 세 갈래로 나눈다. 삶의 평가는 자기 삶 전체를 한 걸음 물러나 돌아보며 내리는 판단이고, 정서는 비교적 짧은 기간에 겪은 즐거움, 걱정, 분노, 평온 같은 감정 경험에 가깝다. 마지막으로 유다이모니아는 자신이 사람답게 제대로 기능하고 있는지, 지금 하는 일이 가치 있다고 느끼는지를 살피는 차원이다.

현실에서는 이 세 가지가 제각각 움직일 때가 흔하다. 하루하루는 고되지만 의미 있는 일을 해내는 시기가 있는가 하면, 생활은 안정됐는데 어쩐지 하루가 무기력하게 흘러가는 때도 있다. 오늘 기분이 나쁘다고 해서 삶 전체를 실패로 단정해 버리면 정작 고쳐야 할 지점을 찾기 어렵다. 반대로 목표가 가치 있다는 말로 매일 쌓이는 피로와 괴로움을 덮어 두어서도 안 된다.

경험 자료 역시 이 셋을 뭉뚱그리지 말아야 할 이유를 보여 준다. Busseri는 삶의 만족, 긍정 정서, 부정 정서의 관계를 다룬 40개 표본, 34,298명의 자료를 메타분석했다. 그 결과 세 측면은 예상한 방향으로 중간 정도 관련을 맺으면서도 주관적 웰빙이라는 상위 요인에 상당한 정도로 묶였다. 한편 Diener와 Emmons의 연구를 보면 긍정 정서와 부정 정서 사이의 음의 상관은 강한 감정을 겪는 바로 그 순간에 가장 컸지만, 돌아보는 기간이 길어질수록 점차 약해져 1년 단위에서는 두 정서가 거의 독립적으로 움직였다. OECD 지침이 긍정 정서와 부정 정서를 따로 묻도록 권하는 것도 같은 맥락이다. 개인이 선택을 돌아볼 때 역시 오늘의 기분과 삶 전체에 대한 만족, 그리고 일의 의미를 한 칸에 섞지 말고 따로 물어보아야 한다.

## 감정 밖의 생활 조건

느낌만으로 삶의 상태를 다 파악할 수는 없다. 감정 바깥에서 우리의 하루를 실제로 떠받치는 물질적·사회적 조건이 있기 때문이다. OECD의 *How’s Life? 2024*는 현재의 웰빙을 소득과 자산, 일과 일자리의 질, 주거, 건강, 지식과 기술, 환경, 주관적 웰빙, 안전, 일과 삶의 균형, 사회적 연결, 시민 참여라는 열한 가지 영역으로 살핀다. 여기에 더해 앞으로 그 삶을 계속 이어 갈 바탕이 되는 자연·경제·인적·사회적 자원은 따로 떼어 본다.

이 틀은 원래 국가와 사회를 비교하려고 만든 것이지만, 개인이 선택 앞에서 빠뜨린 조건을 찾아내는 점검표로도 손색이 없다. 예컨대 급여가 오르는 대신 통근 시간이 길어지면 당장 수면과 관계에 쓸 시간이 깎여 나간다. 반대로 새 기술을 배우는 자리로 옮기면 인적 자원은 두터워지지만 당장의 안정성은 낮아질 수 있다. 어느 한 칸이 커진 것만 보고 "전체적으로 더 좋아졌다"고 성급히 말하면 다른 칸에서 소리 없이 새어 나가는 손실을 놓치기 쉽다.

물론 행복을 이렇게 여러 요소로 쪼개어 본다고 해서 돈과 직업의 무게가 줄어드는 것은 아니다. 돈에 따라 주거와 건강, 안전은 물론 내가 선택할 수 있는 시간의 폭까지 달라지고, 직업에 따라서는 하루의 시간표와 만나는 사람, 사는 곳까지 한꺼번에 바뀐다. 다만 돈과 직업이 중요하기 때문에라도, 그 선택이 나머지 생활 조건을 어떻게 건드리는지는 별도의 칸으로 떼어 내어 꼼꼼히 따져야 한다.

## 자율성·유능감·관계성을 질문으로 쓰기

생활 조건과 더불어 심리적인 기본 욕구가 얼마나 채워지는지도 삶의 질과 맞닿아 있다. Martela와 동료들은 유럽사회조사 27개국의 15세 이상 48,550명 자료를 분석해 자율성, 유능감, 관계성 욕구의 충족 정도를 살폈다. 세 욕구가 채워진 정도를 묶은 값은 행복과 강한 양의 관계를, 우울 증상과는 강한 음의 관계를 보였고, 삶의 만족 및 삶의 의미와도 유의한 양의 관련이 있었다. 소득이나 사회경제적 위치 같은 조건을 통제한 뒤에도 이 관련성은 사라지지 않았다.

다만 이 결과를 해석할 때는 연구 설계가 허용하는 선을 지켜야 한다. 표본은 각 나라의 확률표집으로 모았지만, 자료 자체는 한 시점을 잘라 본 횡단조사다. 자율성이 높아서 행복한 것인지, 이미 행복한 사람이 자기 삶을 더 자율적이라고 느끼는 것인지는 이 자료만으로 가릴 수 없다. 게다가 개별 욕구를 잰 척도의 신뢰도도 낮았다. 따라서 "세 욕구를 채우면 반드시 행복해진다"고 단정하면 연구가 말한 것보다 한참 앞서 나가는 셈이 된다.

이 연구에서 우리가 실제 선택으로 가져올 것은 인과 법칙이 아니라 일의 현장을 들여다보는 질문이다. 선택지 앞에서는 다음 세 가지를 물어보면 좋다.

- 내가 스스로 정할 수 있는 일의 범위는 어디까지인가.
- 일을 하면서 배우고 능숙해졌다는 피드백을 받을 수 있는가.
- 막힐 때 도움을 청하고, 의견이 달라도 함께 지낼 만한 관계가 있는가.

겉으로 보이는 학교나 회사의 이름이 똑같아도 이 세 질문의 답은 어떤 팀에서 어떤 역할을 맡느냐에 따라 크게 갈린다. 직함이나 간판보다 그곳에 들어가 실제로 보내게 될 하루를 구체적으로 물어야 하는 이유가 바로 여기에 있다.

## 행복 계기판

앞에서 나눈 측면들을 한눈에 점검할 수 있도록 표로 묶으면 '행복 계기판'이 된다. 이 계기판은 지금 생활에서 이미 금이 간 칸이 어디인지, 그리고 눈앞의 선택이 어느 칸을 움직일지 찾아내는 데 쓴다.

| 볼 것 | 적을 질문 |
|---|---|
| 생활의 바닥 | 건강, 수면, 안전, 생활비, 돌봄 가운데 이미 깨진 것은 무엇인가 |
| 삶의 평가 | 지금 생활을 1년 더 이어도 괜찮다고 보는가. 아니라면 가장 큰 이유는 무엇인가 |
| 정서 | 최근에 자주 겪은 좋은 감정과 힘든 감정은 각각 무엇인가 |
| 의미와 기능 | 가치 있다고 느끼는 일, 늘고 있다고 느끼는 능력은 무엇인가 |
| 시간과 관계 | 회복과 관계를 위해 실제로 남는 시간이 있는가 |
| 미래의 선택지 | 이 선택이 돈, 기술, 건강, 사람 가운데 무엇을 쌓거나 깎는가 |

현실에서 이 모든 칸을 한꺼번에 끌어올리는 선택지는 좀처럼 나오지 않는다. 그러므로 먼저 바닥이 깨진 칸부터 살핀 뒤, 이번 시기에 꼭 올리고 싶은 한두 칸을 고르고 나머지 칸에서는 어느 정도 손실까지 감수할지 함께 적어 둔다. 이렇게 기준을 세워 두면 "어느 쪽이 더 행복한 선택일까"라는 막연한 저울질 대신, 구체적으로 어느 생활 조건을 얻고 무엇을 내주는지 또렷하게 따질 수 있다.

한 가지 분명히 선을 그어 둘 점이 있다. 정신건강 문제는 이 계기판만으로 다루어서는 안 된다. 정신질환의 진단은 공식 진단 기준에 따라 전문가가 내리는 영역이다. 일상 기능이 무너질 만큼 힘들거나 우울·불안이 오래 이어지고 위기 신호가 보인다면, 선택의 손익 계산과 분리해 공식 기준과 전문적인 도움 경로를 따라야 한다(→ [23장](./chapter_23_mental_health_help.md)).

행복이 여러 측면으로 나뉜다는 사실을 확인했다면, 이제 그 조건들을 실제 선택지를 고르는 잣대로 바꿀 차례다. 다음 장에서는 매력적인 선택지에 휘둘리지 않고 나만의 선택 기준표를 세우는 방법을 다룬다.

# 3장 내 선택 기준 만들기

앞 장에서 살핀 것처럼 행복을 이루는 조건은 여럿이지만, 정작 선택지들을 책상 위에 펼쳐 놓는 순간 우리의 기준은 쉽게 흔들린다. 이름이 널리 알려진 곳을 보면 명성이 중요해 보이고, 높은 급여 숫자를 보면 돈의 비중이 슬그머니 올라간다. 이렇게 눈앞에 놓인 선택지 가운데 좋아 보이는 것의 장점을 뒤늦게 내 기준이라고 부르기 시작하면, 비교표는 합리적인 판단 도구가 아니라 그 선택을 정당화하는 문서로 변질된다.

그래서 무엇을 비교하기 전에 내가 무엇을 지키려는지부터 못 박아 두어야 한다.

## 대안보다 가치 먼저 적기

의사결정 연구자 Ralph Keeney는 주어진 대안을 놓고 저울질하기보다 대안을 가치를 이루는 수단으로 보자고 제안했다. 이 결정에서 달성하려는 가치를 먼저 밝힌 뒤에야 선택지 A와 B를 그 기준 위에 올려놓고 비교하는 방식이다. 이렇게 순서를 바꾸면 기존 선택지를 평가할 잣대가 선명해질 뿐 아니라, 애초에 목록에 없던 새로운 대안까지 눈에 들어오게 된다.

다만 Keeney의 접근은 규범적 의사결정 분석에 속한다. 실제 진로 선택자들을 무작위로 나누어 행복이나 경력 성과를 비교한 실증 연구가 이 방식을 뒷받침하는 것은 아니다. 여기서 우리가 확실히 기댈 수 있는 것은, 기준을 먼저 세워 두면 특정 선택지의 매력에 끌려 사후에 기준을 슬쩍 바꾸는 일을 막을 수 있다는 절차의 논리까지다.

기준을 먼저 적기로 했다면 추상적인 단어도 손보아야 한다. '성장', '안정', '워라밸' 같은 큼직한 말만 적어 두고 끝내면 어떤 선택지에나 그럴듯한 이유를 갖다 붙일 수 있기 때문이다. 실제로 내 생활에서 확인할 수 있는 문장으로 내려 적어야 비로소 기준이 작동한다. 예컨대 성장은 "6개월마다 더 어려운 문제를 맡고 피드백을 받는다", 안정은 "예상하지 못한 소득 중단을 몇 달까지 감당할 수 있다", 시간은 "평일 저녁 몇 번은 일 없이 비워 둔다"처럼 구체적인 모습으로 옮겨 적는다.

## 바닥과 방향 가르기

구체적인 문장으로 바꾼 기준은 역할에 따라 아래 네 묶음으로 나눌 수 있다.

| 구분 | 역할 | 적을 내용 |
|---|---|---|
| 바닥 | 깨지면 탈락시킨다 | 건강, 안전, 생활비, 돌봄, 체류 조건, 최소한의 존중 |
| 방향 | 이번 시기에 더 얻고 싶은 것을 고른다 | 기술, 책임, 자율성, 사람, 해 보고 싶은 일 |
| 비용 | 장점을 얻으려고 감수할 상한을 정한다 | 시간, 돈, 이동, 초보로 지낼 기간, 불확실성 |
| 시간 범위 | 지금과 나중의 손익을 나눈다 | 6개월의 생활, 몇 년 뒤 남을 능력과 선택지 |

이 네 묶음 가운데 가장 먼저 걸러 내야 할 것은 바닥이다. 바닥은 다른 항목에서 아무리 높은 점수를 받아도 메울 수 없는 조건이다. 건강을 유지하기 어려운 자리를 높은 명성으로 상쇄하거나, 기본적인 생활비조차 댈 수 없는 보수를 흥미 점수로 덮어 두면 머지않아 그 선택을 버텨 내기 어려워진다. 바닥을 통과한 선택지만 테이블에 남긴 뒤에야 방향과 비용을 놓고 비교를 시작한다.

방향은 욕심을 줄여 한두 개만 남긴다. 이것도 좋고 저것도 중요하다고 모든 항목에 동그라미를 쳐 놓으면 어떤 선택지도 가려낼 수 없기 때문이다. 기술을 배우는 속도를 최우선으로 둘지, 무너진 건강을 회복하고 생활을 안정시키는 일을 먼저 챙길지는 지금 내가 지나고 있는 시기에 따라 달라진다.

여기에 시간 범위까지 함께 적으면 당장 고된 선택과 장기적으로 나를 깎아먹는 선택을 구분할 수 있다. 가령 수면을 계속 줄여야만 굴러가는 자리라면, 초보 기간이 지나고 익숙해진 뒤에도 그 구조가 그대로일지 따져 보아야 한다. "지금 당장 힘들다"는 사실과 "오래 이렇게 지낼 수 없다"는 구조적 한계는 따로 적어야 헷갈리지 않는다.

## 최고 대신 충분한 선택 찾기

기준이 서더라도 "과연 이보다 더 나은 선택지가 어딘가에 있지 않을까" 하는 불안이 남곤 한다. Herbert Simon은 바로 이 지점을 짚었다. 그는 1955년 논문에서 정보와 계산 능력이 제한된 인간이 모든 대안을 샅샅이 비교해 최댓값을 찾는다는 고전적 가정을 문제 삼았다. 그 대신 사람이 각자의 포부수준(aspiration level)을 정해 두고 그 수준에 이르는 대안이 나오면 선택하는 모형을 내놓았고, 이듬해인 1956년 논문에서는 이런 의사결정 방식을 만족화(satisficing)라고 불렀다. 만족화는 탐색 자체에 시간과 비용이 드는 현실에서 언제 비교를 멈추고 실행으로 넘어갈지 정해 주는 현실적인 규칙이다.

진로와 직업을 고르는 상황은 전형적으로 정보가 불완전한 환경이다. 우리가 실제로 알 수 있는 회사와 팀은 전체 가운데 극히 일부에 지나지 않으며, 입사하기 전에는 상사와 동료가 어떤 사람인지, 매일 마주할 실제 업무가 무엇인지도 상당 부분 가려져 있다. 그 상태에서 100점짜리 정답을 찾겠다고 매달리면 정작 새로운 정보를 얻기보다 머릿속 순위표만 계속 고쳐 쓰기 쉽다. 바닥을 넘기고 지금 정한 방향에 충분히 들어맞으며, 설령 내 예상이 틀렸을 때도 감당할 수 있는 선택이 눈에 띄었다면 일단 일정 기간 그 선택대로 움직여 보는 편이 낫다.

실제 결정에 들어가기 전에는 다음 한 장을 채워 생각을 고정해 둔다.

```text
이번 결정:

반드시 지킬 바닥:
-
-

이번 시기에 원하는 방향(한두 가지):
-
-

감수할 비용과 상한:
-

지금 확인하지 못한 것:
-

이 빈칸을 확인할 가장 싼 방법:
-

충분한 선택이라고 판단할 조건:
-

결정 뒤 다시 볼 날짜:
```

이 양식은 Keeney, Simon, OECD의 틀을 한데 묶어 정리한 도구일 뿐, 타당도 검증을 거친 심리척도는 아니다. 점수를 내어 우열을 가리기보다는 내가 세운 기준과 아직 확인하지 못한 빈칸을 한 종이 위에 나란히 적어 두는 용도로 쓴다.

## 순위가 뒤집히는 이유 보기

어느 정도 후보가 추려져 비교표가 필요하다면 숫자를 적어 볼 수도 있다. 다만 이때 7점과 8점의 차이는 정밀한 측정치가 아니라 대략의 어림짐작으로 읽고, 각 항목의 가중치를 조금씩 움직여 보는 편이 현명하다. 성장의 비중을 살짝 낮추거나 통근 비용의 무게를 올렸을 때 A와 B의 순위가 곧바로 뒤집힌다면, 내 결정이 몇 가지 불확실한 가정 위에 위태롭게 서 있다는 신호다. 그럴 때는 "A가 82점으로 앞선다"는 총점을 믿을 것이 아니라, 순위를 흔드는 가정을 확인할 자료를 더 찾거나 아니면 어느 쪽을 골라도 결정적인 차이가 없음을 받아들이면 된다.

이처럼 민감도 검사를 해 볼 때는 바닥을 통과한 후보만 남긴 상태에서, 아직 확신하기 어려운 기준 하나의 가중치나 값을 현실적으로 가능한 범위 안에서 바꾸어 본다. 값을 움직여도 순위가 그대로라면 그 가정에 대해서는 당장 더 파고들 필요가 적다. 반대로 특정 지점에서 순위가 뒤집힌다면 바로 그 경계값이 다음에 확인해야 할 핵심 질문이 된다.

결론을 뒤집는 정보부터 쫓아가면 조사해야 할 범위가 크게 줄어든다. 예를 들어 통근시간 때문에 주 2일 출근을 가정하면 A가 낫고 주 5일 출근이면 B가 낫다면, 종합점수의 소수점을 따지기 전에 실제 출근 원칙부터 확인하는 것이 순서다. 성과급을 전액 받을 때만 순위가 바뀐다면 최근 몇 년의 실제 지급 범위를 물으면 되고, 성장 가능성처럼 숫자로 옮기기 모호한 항목이 걸린다면 신입이 최근에 맡은 과업과 피드백 주기를 구체적으로 물어보면 된다.

비교를 거듭해도 답이 나오지 않는다면, 선택지가 너무 많아서 막힌 것인지 아니면 정보와 기준 자체가 비어서 막힌 것인지부터 따로 진단해야 한다(→ [5장](./chapter_05_similar_options.md)). 후보 수를 섣불리 줄이기 전에 내가 세운 기준과 가정이 결론을 얼마나 흔드는지 먼저 살펴보는 것만으로도 불필요한 고민을 많이 덜 수 있다.

마지막으로 기준표를 다 채웠다면 한 가지 질문만 더 던져 본다. "이 선택이 기대와 달리 실패로 끝나더라도, 왜 이 길을 골랐는지 스스로 설명할 수 있는가?" 물론 이 설명이 미래의 성공을 보장해 주지는 않는다. 그 대신 결과가 나온 뒤에 내가 무엇을 배워야 할지 가려내는 귀한 기준점이 된다. 다음 장에서는 바로 그 결과와 과정의 관계를 조금 더 깊이 뜯어본다.

# 4장 좋은 선택과 좋은 결과 가르기

앞 장에서 기준을 세우고 설명할 수 있는 선택을 하려 애써도, 현실에서 돌아오는 결과는 늘 내 뜻대로만 움직이지 않는다. 문제는 결과가 나온 뒤에 찾아온다. 결과가 좋으면 과거의 내 판단도 괜히 영리해 보이고, 결과가 나쁘면 결정 당시에는 도저히 알 수 없던 정보까지 내가 놓친 것처럼 느껴진다. 그렇다면 결과가 손에 쥐어진 뒤에 우리는 과거의 무엇을 평가하고, 앞으로의 무엇을 고쳐야 할까.

## 같은 결정에 다른 결과를 붙인 실험

사람들이 결과를 알고 난 뒤 판단을 얼마나 달리 보는지 확인한 고전적인 실험이 있다. Jonathan Baron과 John Hershey는 학부생들에게 불확실한 의료 결정과 금전 선택 시나리오를 제시했다. 참가자들은 결정자가 판단하던 시점에 알 수 있었던 관련 정보를 모두 똑같이 넘겨받았다. 연구진은 결정에 이르는 과정은 완전히 같게 두고, 오직 마지막 결과만 성공과 실패로 바꾸어 놓았다. 다섯 차례의 실험에서 참가자들은 결과가 좋을 때 결정자의 사고 과정과 능력을 더 높게 평가했을 뿐 아니라, 그 사람에게 자기 대신 결정을 맡기겠다는 의향도 더 크게 보였다. 심지어 금전 선택에서는 결정자가 고르지 않은 다른 대안의 사후 결과까지 끌어와 평가에 반영했다.

이 현상이 바로 결과 편향이다. 흥미로운 점은 참가자들에게 따로 물었을 때 대부분 "결과를 과정 평가에 넣으면 안 된다"고 답하면서도, 실제 평가에서는 결과를 반영했다는 사실이다. 물론 이 논문이 다룬 대상은 가상 시나리오를 읽은 학부생의 판단이다. 따라서 이 실험으로 말할 수 있는 범위는 당시 정보가 동일하더라도 사후 결과를 알면 평가가 바뀐다는 데까지이며, 실제 채용이나 이직 결정을 추적해 얻은 결과는 아니다.

그럼에도 이 편향은 진로 선택에서 특히 경계할 만하다. 진로에서는 내가 내린 선택과 최종 결과 사이에 내가 정할 수 없는 변수가 수없이 끼어들기 때문이다. 경기 흐름과 조직 개편, 배정된 팀, 함께 일하는 동료, 우연히 맡은 첫 업무에 따라 결과는 크게 출렁인다. 별다른 준비 없이 고른 자리도 운이 맞아 잘 풀릴 수 있다. 만약 결과만 들여다보며 복기한다면, 운이 만들어 낸 결과를 내 실력이나 판단 실패로 오독하고 그 잘못된 해석을 다음 선택에까지 그대로 끌고 가게 된다.

## 두 번 복기하기

결과 편향에 휘둘리지 않으려면 복기를 한 번에 끝내지 말고 두 차례로 나누어 진행해야 한다. 첫 번째 복기에서는 결과를 일부러 가려 둔다. 결정을 내리던 날까지 실제로 손에 쥘 수 있었던 자료만 책상 위에 올려놓고, 그때의 과정이 제대로 굴러갔는지만 묻는다.

- 지켜야 할 바닥과 이번 시기의 방향을 미리 적었는가.
- 눈앞의 한두 개 말고 현실적인 다른 선택지도 함께 보았는가.
- 아직 모르는 항목을 아는 척 덮어 두지 않고 빈칸으로 표시했는가.
- 실패했을 때 감당할 비용과 빠져나올 길을 확인했는가.
- 왜 골랐는지 이유를 남기고 언제 다시 볼지 조건을 정했는가.

이 다섯 가지 질문에서 비어 있는 지점이 있다면, 그것이 바로 결과와 무관하게 고쳐야 할 과정의 결함이다. 예컨대 입사 전에 충분히 확인할 수 있던 팀의 근무 방식을 묻지 않았다면 다음번 정보 수집 방식을 손봐야 한다. 건강을 바닥이라고 적어 놓고도 막판에 무시했다면 기준을 적용하는 태도를 고쳐야 한다. 반대로 결정 당시에 알 도리가 없던 조직 폐쇄가 일어났다면, 그것은 판단 실수가 아니라 이후 판단에 보탤 새로운 정보로 기록해 둔다.

과정을 다 짚은 뒤에야 두 번째 복기에서 결과를 연다. 이번에는 잘했느냐 못했느냐를 따지기보다, 다음 선택에 써먹을 현실 정보를 캐내는 데 집중한다. 내가 예상했던 위험이 실제로 얼마나 자주 그리고 얼마나 크게 일어났는지, 입사 전에 좋다고 본 조건이 막상 생활 속에서도 좋았는지 따져 본다. 아울러 이번에 겪은 일이 특정 회사나 팀에서만 벌어진 예외적 사건인지, 아니면 비슷한 자리로 가도 되풀이될 구조적 특징인지도 함께 가린다.

이처럼 과정 평가와 결과 학습은 역할을 나누어 맡겨야 한다. Baron과 Hershey 역시 이미 내려진 단일 결정의 질을 평가할 때와, 비슷한 결정이 되풀이되는 상황에서 결과를 바탕으로 확률 추정치를 고쳐 잡을 때를 엄격히 나누어 보았다. 결과는 다음 판단을 정교하게 다듬는 자료로 쓰고, 과거의 판단 과정 자체를 소급해서 깎아내리거나 미화하는 데는 쓰지 않는 것이 원칙이다.

## 한 번과 반복을 다르게 보기

결과를 해석할 때는 그것이 한 번 벌어진 일인지, 여러 번 되풀이된 일인지도 갈라 보아야 한다. 한 번의 결과에는 운이 크게 개입한다. 하지만 비슷한 유형의 결과가 여러 차례 반복된다면 그때는 운으로만 돌리기 어렵다. 가령 입사 전에 매번 업무 범위를 확인했는데도 여러 직장에서 약속과 실제 일이 계속 어긋났다면, 내가 던지는 질문의 방식이나 정보를 얻는 통로 자체를 바꾸어야 한다. 반대로 한 팀에서 겪은 특정 문제를 그 직업 전체의 본질인 양 넓혀 버리면, 단 하나의 나쁜 사례 때문에 멀쩡한 진로 하나를 통째로 지워 버리는 실수를 범한다.

반복되는 경험을 분석할 때는 사건의 단위를 작고 구체적으로 맞추어야 한다. "엔지니어 일이 전반적으로 힘들었다"처럼 크게 뭉뚱그려 적어 놓으면 다음 선택에서 바꿀 만한 단서가 남지 않는다. 잦은 일정 변경이 버거웠는지, 수면을 깎아 먹는 운영 대기가 힘들었는지, 아니면 낯선 남의 코드를 읽는 작업 자체가 맞지 않았는지 잘게 쪼개어 보아야 한다. 다음 선택에서 실제로 조정할 수 있는 조건까지 내려가야 비로소 결과가 쓸모 있는 정보로 바뀐다.

일이 잘 풀린 좋은 결과 역시 똑같은 눈으로 뜯어보아야 한다. 우연히 좋은 프로젝트에 배정되어 수월하게 성과를 낸 일까지 내 안목 덕분이라고 치켜세워서는 안 된다. 그 대신 내가 미리 준비한 기술이나 막혔을 때 도움을 구한 방식, 팀의 코드 리뷰 문화처럼 다음 선택에서도 내가 다시 찾거나 연습해서 재현할 수 있는 요소가 무엇인지 가려내야 한다.

## 당시 정보를 보존하는 결정 기록

아무리 다짐해도 막상 결과를 알고 나면 그 전의 내가 무슨 생각으로 그 길을 골랐는지 정확히 되살리기는 어렵다. 기억이 사후 결과에 맞게 슬그머니 재편집되기 때문이다. 그래서 결정을 내리기 직전에 짧은 메모를 남겨 두어야 나중에 두 번 복기하는 작업이 실제로 가능해진다.

```text
[결정 전]
무엇을 얻으려 하는가:
무엇을 포기하지 않을 것인가:
현재 아는 사실:
아직 모르는 사실:
가장 걱정하는 실패와 예상 범위:
계속·수정·중단을 가를 신호:
다시 검토할 날짜:

[결과를 가리고]
당시 과정에서 빠진 질문:
당시 정보로도 달리 판단할 수 있었던 지점:

[결과를 열고]
예상과 달랐던 사실:
다음 결정의 확률·기준·질문에서 바꿀 것:
이번 한 사례로는 아직 말할 수 없는 것:
```

물론 결정 일지를 쓴다는 행위 자체가 의사결정의 질을 높여 준다는 강한 개입 근거가 확립된 것은 아니다. 이 양식은 어디까지나 사후의 결과가 당시의 기억을 덮어쓰기 전에 판단의 출발선을 기록해 두는 장치로만 쓴다. 복기를 마칠 때는 긴 반성문 대신, 다음번에 고칠 수 있는 과정 하나와 새로 얻은 정보 하나만 또렷하게 건져 내면 충분하다.

지금까지 1부에서는 무엇을 위해 고르고, 어떤 기준으로 판단하며, 어떻게 과정과 결과를 나누어 돌아볼지 살폈다. 그런데 막상 결정을 내리려 할 때 우리를 붙잡는 또 다른 벽이 있다. 기준은 대충 알겠는데 눈앞의 선택지들이 전부 비슷비슷해 보여 한 걸음도 못 떼는 순간이다. 이제 2부 '모를 때의 탐색'으로 넘어가, 먼저 무엇이 결정을 막고 있는지부터 뜯어보자.

---

**출처.** [Baron & Hershey (1988), “Outcome Bias in Decision Evaluation”](https://doi.org/10.1037/0022-3514.54.4.569)을 참조했다. 두 번 복기하는 방법과 결정 기록 양식은 이 실험의 구분을 실제 선택에 적용하려고 이 장에서 만들었고, 양식 자체의 효과는 검증되지 않았다.

# 5장 선택지가 비슷해 보일 때

앞 장까지 기준을 세우고 결과를 분리해 보는 틀을 훑었지만, 현실의 갈림길 앞에서는 종종 그 전 단계에서 발이 묶인다. 사람은 비교할 기준이 없을 때도, 직업에 대한 정보가 비어 있을 때도, 주변에서 들려오는 말이 서로 어긋날 때도 똑같이 "다 비슷해 보인다"고 말한다. 물론 실제로 선택지 사이의 차이가 미미할 때도 같은 말을 꺼낸다. 문제는 겉으로 나오는 말은 하나인데, 경우마다 다음에 취해야 할 행동이 전혀 다르다는 점이다. 그러니 막막함을 느낄 때는 성급히 결론을 내리려 들지 말고 내 결정이 지금 어디에서 막혔는지부터 짚어 보아야 한다.

## ‘결정을 못 하겠다’ 풀어 쓰기

진로 결정이 막히는 이유를 체계적으로 갈라 본 연구가 있다. Gati, Krausz, Osipow는 사람들이 겪는 진로 결정의 어려움을 크게 준비 부족, 정보 부족, 그리고 정보 충돌(일관되지 않은 정보)이라는 세 갈래로 나누었다. 이들은 의사결정 이론에서 분류의 틀을 잡은 뒤, 실제 진로 상담을 받은 200명과 진로 상담 전문가 10명이 기술한 어려움과 대조해 목록을 다듬었고, 이어 진로 선택을 시작하던 이스라엘 청년 259명과 미국 대학생 304명을 44문항 질문지로 조사했다.

세 갈래를 조금 더 들여다보면 결이 분명해진다. 준비 부족에는 결정을 시작할 동기 자체가 약한 상태, 진로가 아니더라도 전반적으로 결정을 어려워하는 성향, 비현실적인 직업관이 들어간다. 정보 부족은 어떻게 결정해야 하는지 방법 자체를 모르거나, 나 자신과 직업 세계에 대한 정보, 나아가 그 정보를 어디서 구할지 모르는 경우를 가리킨다. 반면 정보 충돌에는 믿기 어려운 자료가 뒤섞여 있는 상황, 내 안의 기준끼리 부딪히는 갈등, 가족이나 중요한 사람들과 겪는 의견 충돌이 포함된다.

이 분류가 유용한 이유는 스스로에게 "나는 우유부단한 사람"이라는 딱지를 붙이기 전에 다음에 던질 질문을 좁혀 주기 때문이다. 지금 당장 결정해야 할 이유가 납득되지 않는다면 직무 설명회를 더 찾아다니기 전에 그 이유부터 따져 보아야 한다. 실제 업무가 어떻게 돌아가는지 몰라 막힌 것이라면 가치관 검사를 몇 번이나 다시 풀어도 빈칸은 메워지지 않는다. 마찬가지로 부모의 기대와 내가 원하는 생활 조건이 정면으로 부딪히는 상황이라면 연봉 비교표를 아무리 만져 봐야 결론이 나지 않는다.

이후 다른 연구자들도 이 분류가 넓은 범위에서 통하는지 대규모 자료로 다시 점검했다. Levin과 동료들은 영어판 질문지에 직접 응답한 7개국 32,556명의 자료에 확인적 요인분석을 적용했다. 그 결과 원래 제안된 세 묶음과 열 개의 세부 범주가 대체로 지지되었고, 국가와 성별, 연령이 달라도 질문지가 비슷하게 작동한다는 척도 불변성 역시 확인됐다. 다만 진로를 이미 결정했는지 여부에 따른 불변성은 지지되지 않아서, 결정 상태가 다른 집단의 점수를 같은 잣대로 맞비교하기는 어렵다. 게다가 영어 온라인 질문지에 자발적으로 응한 표본이라는 한계도 남아 있다. 그러므로 이런 진단 도구의 점수는 나를 규정짓는 판정이 아니라, 지금 어디가 막혀 있는지 묻는 출발점으로만 활용하는 편이 알맞다.

## ‘정보가 없다’ 나누기

만약 막힌 지점이 정보 부족으로 좁혀졌다면, 그다음에는 자기 정보와 환경 정보를 갈라 보아야 한다. 내가 어떤 작업에 오래 집중하는지, 싫더라도 견뎌 낼 수 있는 불편은 어디까지인지, 막혔을 때 어떤 방식으로 도움을 청하는지는 나 자신을 관찰해야 알 수 있는 자기 정보다. 반면 특정 직무에서 실제로 매일 무엇을 하는지, 입사 초기에 어떤 책임을 맡는지, 한 주의 시간이 어떻게 배분되는지는 바깥의 환경을 조사해야 알 수 있는 정보다.

Kleine, Schmitt, Wisse는 대학생의 진로 탐색 연구 103개(109개 독립 표본, 34,969명)를 모아 메타분석을 수행했다. 이 연구에서 진로 탐색은 자신과 환경에 관한 정보를 모으는 행동을 뜻한다. 분석 결과 전체 탐색 행동은 진로 결정성(r_c=.22) 및 스스로 느낀 고용가능성(r_c=.35)과 각각 유의미한 관련을 보였고, 자기 탐색과 환경 탐색도 서로 상관이 높았지만 완전히 같은 행동은 아니었다.

이 수치를 읽을 때는 효과의 방향을 조심스럽게 해석해야 한다. 메타분석에 포함된 연구의 대부분이 한 시점의 상관을 본 자료이기 때문이다. 탐색을 열심히 해서 결정이 수월해졌을 수도 있지만, 반대로 원래 자기효능감이 높고 어느 정도 방향이 잡힌 학생이 탐색에도 적극적이었을 가능성을 배제할 수 없다. 고용가능성 역시 객관적인 취업 성과가 아니라 학생 스스로 느낀 가능성을 잰 값이다. 따라서 "탐색을 많이 하면 취업을 잘한다"는 식의 단정적인 결론은 이 메타분석에서 끌어낼 수 없다.

그럼에도 빈칸의 종류를 자기와 환경으로 나누어 두면 당장 움직일 행동을 고르기가 훨씬 수월해진다. 업무 내용을 모른다면 여러 채용 공고와 팀 기술 문서를 나란히 비교해 보고, 경력 단계가 서로 다른 현직자에게 실제 하루의 작업 흐름을 물으면 된다. 반대로 내가 그 작업을 견딜 수 있을지 감이 오지 않는다면 작게나마 직접 부딪혀 보아야 한다. 조직의 업무 속도와 피드백 방식만큼은 혼자 하는 개인 프로젝트보다 인턴이나 현장실습, 팀 프로젝트에서 훨씬 가깝게 겪어 볼 수 있다. 어떤 방법을 동원하든 한 번에 직업 전체를 꿰뚫어 볼 수는 없으니, 이번에 확인한 것과 아직 모르는 것을 나누어 적어 두는 습관이 중요하다.

## 충돌하는 말에 출처 붙이기

정보를 모으다 보면 이번에는 서로 다른 말이 부딪혀 머리가 복잡해진다. 같은 직무를 두고도 누구는 여유롭다고 말하고 누구는 매일 불이 난다고 말한다. 흥미롭게도 두 사람의 말이 모두 사실일 수 있다. 회사 규모와 팀 분위기, 제품의 성숙 단계, 개인의 경력과 담당 책임이 다르면 같은 직함이라도 하루의 풍경이 전혀 달라지기 때문이다. 그러니 "백엔드 개발은 원래 이렇다"고 한데 묶어 버리기 전에, 그 말이 어떤 조건에서 나왔는지 출처와 맥락을 꼬리표로 붙여 두어야 한다.

바깥의 말이 아니라 내 안의 기준끼리 충돌할 때도 잦다. 빠르게 배우고 싶으면서도 업무 강도는 낮기를 바라거나, 높은 급여와 짧은 통근이 서로 다른 선택지에 나뉘어 걸리는 식이다. 이런 갈등은 정보를 아무리 더 모아도 풀리지 않는다. 무엇을 얻으려고 어느 정도의 비용까지 감수할지 내가 선을 그어야 하는 가치 판단의 영역이기 때문이다. 이럴 때는 앞서 적어 둔 바닥과 이번 시기의 방향을 다시 꺼내어 우선순위를 확인하는 편이 빠르다(→ [3장](./chapter_03_decision_criteria.md)).

주변 사람들의 기대와 부딪힐 때는 확인 가능한 사실의 문제와 결정권의 문제를 칼같이 나누어야 한다. 취업 전망이나 생활비 수준처럼 사실 여부를 따질 수 있는 주장은 자료를 찾아 함께 확인하면 된다. 하지만 누구의 기대를 앞세울지는 결국 선택의 당사자가 정할 몫이다. 적어도 그 선택이 낳는 결과와 비용을 실제로 누가 감당하게 되는지는 분명히 짚고 넘어가야 한다.

## 정말 차이가 작을 때

필요한 정보를 충분히 모으고 기준까지 맞춰 보았는데도 두 선택지가 여전히 엇비슷하다면, 그때는 억지로 없는 차이를 만들어 내지 말아야 한다. 여기서 한 가지 구분할 점이 있다. 선택지 사이의 실질적인 차이가 작은 것과, 단순히 눈앞에 놓인 선택지 가짓수가 많은 것은 다른 문제다. 선택 과부하를 다룬 Scheibehenne와 동료들의 메타분석은 후자를 검증했다. 50개 실험과 63개 조건, 5,036명을 합쳐 분석한 결과 선택지가 많아서 결정이 나빠진다는 평균 효과는 거의 0(d=0.02)에 가까웠고 연구들 사이의 편차도 매우 컸다. 선택지 수가 많다는 사실 하나만으로 결정의 질이 떨어진다고 말하기는 어려웠다.

오히려 우리가 마주하는 곤란은 두세 개의 선택지가 정말로 비슷비슷하게 느껴질 때 찾아온다. 그럴 때는 소수점 단위까지 억지로 점수를 매기기 전에, 오히려 일이 틀어졌을 때를 상상해 보는 편이 낫다. 어느 쪽이 내 생활의 바닥을 깨뜨릴 위험이 더 큰가. 예상이 어긋났을 때 잃는 시간과 돈은 감당할 만한가. 나중에 다른 선택으로 옮겨 갈 여지가 남아 있는가. 그리고 설령 돌아가더라도 어느 쪽이 다음 판단에 쓸 더 좋은 경험과 정보를 남기는가. 이 물음들까지 대답이 비슷하다면, 그때는 작은 차이나 우연한 계기를 빌려 하나를 골라도 무방하다. 일단 고른 뒤에는 택하지 않은 길을 매일 머릿속에서 다시 채점하는 일을 멈추고, 고른 쪽에서 실제 경험을 쌓는 데 힘을 쏟아야 한다.

## 다음 한 번의 행동

비슷해 보이는 선택지 앞에서 비교표만 하나 더 늘리지 말고, 아래 여섯 줄을 채워 당장 움직일 단서를 추려 보자.

```text
지금 막힌 종류: 준비 / 자기 정보 / 환경 정보 / 정보 충돌 / 기준 충돌 / 실제 차이가 작음
결정을 막는 문장 하나:
그 문장에서 확인 가능한 사실:
사실이 아니라 내가 정해야 할 기준:
이번 주에 할 행동 하나:
그 행동 뒤에도 남을 질문:
```

이 메모를 채웠다면 행동은 욕심내지 말고 한 번에 하나만 고른다. 현직자에게 묻기로 했다면 "요즘 어떤가요" 같은 막연한 안부 대신 실제 하루의 시간 배분과 의사결정 책임을 묻는다. 직접 해 보기로 했다면 그 직업 전체가 나에게 맞는지 판정하려 들지 말고, 지금 가장 모르는 작업 하나만 떼어 내어 확인한다. 기준이 충돌하는 상태라면 자료 검색 창을 닫고 내가 감수할 비용의 상한부터 정한다.

세상 어떤 선택도 완벽하게 확신할 만큼 미리 알아낼 수는 없다. 그래도 저울질이 끝없이 이어진다면 가장 큰 빈칸 하나만 줄여 보고, 다 따져도 남은 차이가 작다면 하나를 골라 일정 기간 살아 보면서 확인하는 편이 낫다. 그런데 이렇게 자기 정보를 들여다보다 보면 많은 사람이 결국 같은 질문 앞에서 멈춰 선다. "나는 대체 무엇을 좋아할까? 아직 해 보지 않은 일에도 흥미가 생길 수 있을까?" 다음 장에서는 바로 이 흥미가 어떻게 생겨나고 자라며, 또 언제쯤 믿을 만한 신호로 굳어지는지 살펴본다.

# 6장 흥미의 변화와 지속

자기 탐색을 하다 보면 자연스럽게 마주치는 조언이 있다. 바로 "좋아하는 일을 하라"는 말이다. 하지만 이 흔한 말 속에는 좋아하는 일이 이미 내 안에 완성된 형태로 들어 있다는 가정이 숨어 있다. 정작 현실에서는 아직 한 번도 해 보지 않은 일에 처음부터 강한 흥미를 느끼기 어렵다. 반대로 어쩌다 몇 번 재미를 느꼈다고 해서 그 일이 앞으로도 오래 맞을 것이라고 성급히 단정할 수도 없다.

지금 내가 가진 흥미를 가볍게 여겨서도 안 되지만, 아직 겪어 보지 못한 일을 너무 일찍 잘라 내서도 안 된다. 두 함정을 모두 피하려면 흥미에 대해 무엇을 근거로 삼아야 할까.

## 흥미의 시작과 발달

흥미가 한순간에 완성되지 않고 자라난다는 점을 정리한 대표적인 틀이 Hidi와 Renninger의 모형이다. 두 사람은 여러 연구를 종합해 흥미가 발달하는 과정을 네 단계로 설명했다. 출발점은 낯선 자극이 잠깐 주의를 끄는 '촉발된 상황적 흥미'다. 여기에 다시 참여할 만한 이유와 주변의 지원이 보태지면 '유지된 상황적 흥미'로 이어진다. 점차 지식과 개인적 가치가 쌓이면서 남이 시키지 않아도 스스로 다시 찾기 시작하면 '초기 개인적 흥미'가 되고, 더 오랜 시간 지속되며 깊은 지식과 단단히 결합하면 마침내 '잘 발달한 개인적 흥미'로 자리 잡는다.

이 틀에서 챙겨 볼 핵심은 초반의 흥미가 생각보다 여리다는 사실이다. 처음 발을 들일 때는 친절히 설명해 주는 사람이나 알맞은 난이도, 실패해도 다시 해 볼 기회가 있어야 흥미가 꺼지지 않고 다음 단계로 넘어간다. 따라서 기초를 잘 몰라서 재미없게 느껴지는 상태와, 내용을 어느 정도 알고 난 뒤에도 여전히 관심이 가지 않는 상태는 분명히 구분해야 한다. 강의를 한 번 듣거나 입문 과제를 한 번 훑어보고 곧바로 끌리지 않았다고 해서 적합성 판단을 서둘러 끝낼 필요는 없다.

물론 이 네 단계는 여러 연구 결과를 엮어 만든 이론 모형이다. 모든 사람이 예외 없이 같은 순서와 속도로 이 단계들을 밟아 간다는 뜻은 아니며, 단순히 노출만 반복하면 어떤 일이든 결국 좋아하게 된다는 실험 결과가 있는 것도 아니다. 단계의 이름은 미래를 예언하는 도구가 아니라, 지금 내 관심이 어느 지점에 머물러 있는지 가늠하는 설명 틀로만 쓰는 편이 정확하다.

## 흥미가 자라는 범위와 안정되는 시기

흥미를 대하는 태도 자체가 새로운 탐색에 영향을 미친다는 연구도 있다. O’Keefe, Dweck, Walton은 대학생들을 대상으로 상관연구와 실험을 모두 다섯 건 수행했다. 앞선 연구들에서는 학생이 자신의 흥미가 이미 고정돼 있다고 믿는 정도가 기존 정체성 바깥의 주제에 보이는 관심과 어떻게 맞물리는지 살폈고, 이어진 실험에서는 참가자들에게 흥미가 고정된 것이라는 관점 혹은 경험에 따라 발달하는 것이라는 관점을 담은 글을 읽게 했다.

그 가운데 세 번째 연구에서는 분석에 포함된 학부생 85명에게 기존 관심 분야와 잘 맞지 않는 주제를 접하게 했는데, 흥미가 고정돼 있다는 관점의 글을 읽은 집단이 그 분야에 더 낮은 관심을 보였다(상호작용 ηp²=.07). 다섯 번째 연구에서는 블랙홀을 다룬 짧은 영상이 매우 흥미로웠다고 답한 커뮤니티 칼리지 학생 70명에게 같은 주제의 어려운 과학 글을 읽혔다. 역시 난관에 부딪힌 뒤 관심이 꺾인 정도는 고정 관점을 읽은 집단에서 더 컸으며, 이 상호작용 효과 크기 역시 ηp²=.07이었다.

이 결과를 받아들일 때는 실험의 규모와 범위를 함께 짚어야 한다. 짧은 글 한 편을 읽혀 믿음을 흔든 뒤 곧바로 자기보고식 관심도를 잰 소규모 실험이므로, 확인된 것은 실험 직후의 단기적인 관심 변화까지다. 실제 대학생이 전공을 바꾸거나 직장인이 경력을 이어 가는 장기적인 선택까지 이 실험으로 설명할 수는 없으며, 연구자들 역시 이런 효과가 현실에서 어떻게 나타나는지는 앞으로 연구할 과제라고 명시했다.

그럼에도 실마리는 분명하다. 흥미가 태어날 때부터 정해져 있다고 믿으면 기존 정체성과 낯선 분야의 문을 너무 일찍 닫아 버리거나, 처음 만나는 난관을 곧바로 "이건 내 일이 아니다"라는 증거로 읽어 버리기 쉽다. 반면 흥미가 자랄 수 있다고 열어 두더라도, 내가 과연 어느 분야를 좋아하게 될지까지 머릿속으로 미리 점칠 수는 없으니 결국 직접 겪어 보는 과정이 따른다.

그렇다고 "노력하면 무엇이든 좋아질 수 있다"며 현재 내가 느끼는 관심을 마냥 가볍게 다루어도 곤란하다. Low와 동료들은 12세부터 40세까지의 직업 흥미를 추적한 종단연구 66개(표본 107개)를 모아 메타분석을 진행했다. 분석 결과 직업 흥미의 순위 안정성은 청소년기 대부분 동안 큰 변화가 없다가 대학 시기(18~21.9세)에 들어서며 크게 높아졌고, 그 뒤 20년 동안이나 비슷한 수준을 유지했다. 물론 재검사 간격이 길어질수록 안정성은 조금씩 낮아졌다.

여기서 말하는 순위 안정성이란 한 개인의 점수가 세월이 지나도 소수점까지 그대로 머문다는 뜻이 아니라, 집단 안에서 각자가 차지하는 흥미의 상대적 위치가 시간이 흘러도 꾸준히 이어지는 정도를 가리킨다. 결국 이 결과가 보여 주는 바는, 안정성이 크게 올라가는 대학 시기를 지나면서 여러 차례 되풀이되어 나타나는 선호만큼은 꽤 믿을 만한 정보로 대우해야 한다는 점이다.

두 연구 흐름을 나란히 놓고 보면 균형이 잡힌다. 흥미에는 환경과 연습을 통해 새로 자라는 구석이 있는 동시에, 개인차와 상당한 시간적 안정성도 함께 존재한다. 흔히 들리는 "열정은 만들어 가는 것"이라는 구호 하나에 다 담기에는 현실이 훨씬 입체적이다. 그러므로 내게 맞지 않는 일을 오직 의지만으로 좋아하게 만들 책임을 개인에게 전부 떠넘길 수는 없다.

## 반복된 반응 기록하기

한순간의 기분이나 어설픈 인상만으로 진로를 결정하지 않으려면, 같은 종류의 작업을 두세 차례 이상 직접 해 보고 내 반응을 잘게 나누어 적어 두는 편이 좋다.

```text
흥미 관찰 기록

해 본 작업:
시작 전 기대:
하는 동안 자꾸 주의가 간 부분:
막혔을 때 다시 시도하고 싶었는가:
끝난 뒤 더 알고 싶어진 질문:
싫었던 작업과 그 이유:
다음 날 남은 피로와 만족:
두세 번 반복한 뒤 달라진 점:
```

단순히 '재미있었다' 한 줄만 적어 놓으면 함께한 사람 때문이었는지, 칭찬을 들어서 좋았는지, 그저 새로워서 신기했는지, 아니면 작업 자체가 맞았는지 가려내기가 어렵다. 그래서 내 주의를 붙잡은 실체가 무엇인지 쪼개어 적어야 한다. 문제를 풀어 가는 과정이 흥미로웠는지, 결과를 남에게 설명할 때 보람을 느꼈는지, 아니면 팀 분위기가 좋아서 힘든 일을 버틸 만했는지 나누어 보는 것이다. 반대로 싫었던 부분 역시 그 직업에 따라붙는 부수적인 불편인지, 아니면 매일 반복될 핵심 업무인지 구분해야 헛다리를 짚지 않는다.

물론 이런 관찰도 기한 없이 마냥 끌 수는 없으므로 언제 판단을 내릴지 미리 정해 둔다. 기초 지식을 조금 더 익혀야 재미 여부를 가릴 수 있는 영역이라면 그 기초가 쌓일 때까지는 성급한 결론을 미룬다. 하지만 몇 차례 반복해 부딪혀 본 뒤에도 핵심 작업 자체가 계속 버겁게 느껴진다면, 그 불편이 어디서 오는지 따로 떼어 내어 따져 보아야 한다. 무엇보다 건강과 생활의 바닥이 무너질 조짐이 보인다면 흥미 실험은 즉시 멈추는 것이 원칙이다. 만약 이미 받아 둔 흥미 검사 결과가 있다면, 절대적인 정답표로 삼기보다 이 관찰 기록과 나란히 놓고 다음에 시험해 볼 작업을 고르는 참고 자료로 쓰면 된다.

그런데 반응을 기록하려 해도 먼저 해 본 경험이 있어야 적을 거리가 생긴다. 늘 걷던 익숙한 길 안에서만 움직이면 결국 비슷한 반응만 되풀이해 확인하게 된다. 그렇다면 큰 손실을 감수하지 않고도 아직 만나 보지 못한 일과 반응을 어떻게 시험해 볼 수 있을까? 다음 장에서는 의도적으로 경험의 폭을 바깥으로 넓혀 보는 '랜덤 워크'의 방법을 다룬다.

---

# 7장 무작위로 시도해 보기

생각만 보태서는 판단이 더 나아가지 않을 때가 있다. 비슷한 수업을 듣고 비슷한 프로젝트를 반복하며 비슷한 사람들과만 이야기를 나누면, 새로 들어오는 판단 자료 역시 비슷할 수밖에 없다. 무엇이 나에게 맞는지 아직 모르는 동안에는 머릿속 계산보다 경험의 폭 자체를 바꾸는 편이 빠르다.

지금 세워 둔 계획대로만 움직이면 좀처럼 마주치지 못할 경험을 작게 섞어 보고, 그 시도가 어떤 정보를 남겼는지 정리하는 과정이 여기서 말하는 ‘랜덤 워크’다. 큰 손실을 감수하지 않으면서 선택지에 관한 실제 정보를 늘리려면 어떻게 시도해야 할까.

## 의도된 변이 넣기

탐색할 때 바꿔 볼 수 있는 요소는 직업명 하나에 그치지 않는다. 실제로 맡는 일의 종류, 함께 일하는 사람, 결과물을 건네는 상대, 조직의 규모, 일하는 시간과 장소까지 모두 변이가 된다. 혼자 완결하는 과제만 해 왔다면 다른 사람이 짠 코드를 읽고 고치는 협업을 섞어 보고, 기능 구현만 맡아 왔다면 배포 뒤의 운영과 사용자 반응을 직접 살펴본다. 익숙한 선배나 동기에게만 물었다면 경력 단계와 조직 형태가 다른 현직자를 찾아 이야기를 들어 본다.

어느 변이를 넣을지는 지금 내가 모르는 것이 무엇인지에 따라 정한다. “이 분야가 나와 맞는가”라는 질문은 한 번에 확인하기에는 너무 크므로, 요구사항이 자주 바뀌는 상황을 견딜 수 있는지, 반복적인 디버깅 뒤에도 호기심이 남는지, 남의 코드를 읽는 작업이 어떤지, 설명과 조율에 드는 시간을 받아들일 수 있는지처럼 작업 단위의 작은 질문으로 쪼갠다.

시도하기 전에는 잃어도 괜찮은 비용의 상한부터 정해 둔다. 한 학기를 통째로 걸기 전에 짧은 과제나 공개 저장소의 작은 이슈 하나를 맡아 보거나, 직장을 다니는 중이라면 퇴사부터 결정하기 전에 짧은 협업이나 수업으로 먼저 맛을 볼 수 있다. 되돌리기 어려운 큰 결정을 첫 실험으로 삼지 않아야 다음 시도도 이어 갈 수 있다.

## 잠정적인 나를 밖에 내놓기

작은 변이를 섞다 보면 머리로만 그리던 모습을 바깥에 꺼내 놓아야 하는 순간이 온다. Herminia Ibarra가 투자은행과 컨설팅 회사에서 상위 역할로 옮겨 가던 전문가 34명을 추적한 귀납적 질적 연구를 보면, 참여자들은 직업 정체성을 머릿속에서 먼저 완성한 뒤 움직이지 않았다. 대신 역할모델을 관찰하고, 가능한 자신의 모습을 잠정적으로 시험해 본 다음, 스스로 세운 기준과 주변 사람들의 반응을 대조하며 자신에게 맞는 방식을 구체화했다.

물론 두 업종의 34명을 살핀 질적 연구인 만큼 이 모형만으로 대학생에게도 같은 결과가 나타난다고 인과적으로 단정할 수는 없다. 이 연구가 보여 주는 범위는 작은 역할을 먼저 시험하며 정체성을 다듬어 가는 과정의 모형까지다. 다만 잠정적인 역할이 실제 정보로 굳어지려면 바깥에 내놓고 다른 사람의 반응을 받아 봐야 한다는 점만큼은 분명하다(→ [17장](./chapter_17_babble_selling.md)).

## 시도를 끝내 정보로 만들기

바깥에 내놓은 시도가 그저 산만한 방황에 그치지 않으려면, 시도를 가설과 검증으로 묶어야 한다. Camuffo와 동료들은 창업가들에게 사업 이론을 검증 가능한 가설로 바꾸고 실험하게 하는 훈련을 네 건의 무작위대조시험으로 검토했다. 모두 759개 기업과 11,463개 관측치를 분석한 결과, 훈련을 받은 집단은 관찰 기간 안에 사업을 중단할 확률이 통제 집단보다 9.8%p 높았다. 다만 중단한 사업이 실제로 성공 가능성이 낮았는지까지는 직접 재지 않았다. 사업 방향을 크게 바꾸는 급진적 피벗의 총횟수 역시 늘지 않았는데, 횟수별로 들여다보면 처치 집단은 한 번 피벗할 확률이 8.3%p 높았고 세 번 이상 피벗할 확률은 3.7%p 낮았으며, 0회와 2회에서는 뚜렷한 차이가 없었다.

이 실험은 창업기업을 대상으로 했기 때문에 대학생의 진로 선택이나 진로 만족, 행복을 잰 연구는 아니다. 저자들이 결과의 배경으로 제시한 ‘효율적 탐색’과 ‘방법적 의심’ 역시 심리 기제를 직접 검증한 것이 아니라 이론적 해석에 가깝다. 따라서 이 결과만으로 아무렇게나 진로를 바꾸라고 권할 수는 없고, 개인의 탐색에서도 무작위 시도 자체보다 틀린 가설을 가려내는 절차가 중요하다는 뜻으로 읽어야 한다. 작은 시도에서도 먼저 가설과 관찰값을 정하고, 미리 잡아 둔 계속·수정·중단 기준에 비추어 중단 조건에 걸리면 멈추며, 시도 횟수를 늘리기보다 어떤 가설을 왜 버렸는지 근거를 남긴다.

시도 하나를 실행하기 전후에는 아래 ‘작은 시도 카드’를 적어 두면 막연한 인상 대신 구체적인 판단 자료가 남는다.

```text
작은 시도 카드

지금 모르는 것 한 문장:
기존 경험과 다르게 섞을 변이 하나:
가장 작은 실행:
시간·돈·건강의 손실 상한:
관찰할 행동이나 결과:
끝낼 날짜:
계속·수정·중단을 가를 조건:
밖에 내놓고 반응을 받을 상대:
```

시도가 끝나면 잘했는지 못했는지 따지기 전에 어떤 정보가 새로 생겼는지부터 적는다. 배운 점이 거의 없다면 규모를 키우기 전에 처음 세운 질문과 관찰값부터 다시 점검하고, 판단을 움직일 만큼 정보가 모였다면 다음 실험으로 넘어가거나 한곳에 시간을 쏟는 실행 단계로 옮긴다. 작은 시도 카드는 한 번에 시도 하나에만 쓴다(→ [8장](./chapter_08_commit.md)).

## 랜덤 워크 비유와 기술 개념의 차이

이 장에서는 작은 변이를 섞어 보는 탐색을 ‘랜덤 워크’라고 불렀지만, 이 말과 관련 기술 개념들은 엄연히 다르다. 수학에서의 random walk는 확률 규칙에 따라 상태가 이동하는 확률과정이고, 강화학습의 exploration은 현재 가장 좋아 보이는 행동 말고도 다른 행동의 보상과 상태 전이를 알아보는 문제이며, Q-learning은 환경 모형을 미리 알지 못해도 행동가치를 갱신하는 off-policy 시간차 제어 알고리즘이다.

Watkins와 Dayan의 1992년 원 논문은 이산적인 제어 Markov 과정에서 Q-learning이 언제 수렴하는지를 증명했다. 모든 상태-행동 쌍을 반복해 표집하고 학습률을 비롯한 조건을 만족하면 행동가치 추정치가 확률 1로 최적값에 수렴한다는 결과로, 이 조건을 채우기만 하면 특정 탐색 정책을 강제하지도 않는다.

그러나 이 논문은 사람의 진로를 Markov 과정으로 모델링하거나 검증한 적이 없다. 삶의 선택에는 미리 정의된 상태·행동·전이 규칙이 없고, 삶의 결과를 하나의 보상값으로 환원할 수도 없으며, 같은 선택을 되풀이해 독립된 표본을 뽑는 일도 불가능하다. 그러므로 “인생도 Q-learning과 같으니 여기저기 돌아다니다 보면 최적의 진로에 수렴한다”는 말은 유한한 상태, 반복 표집, 학습률 조건이라는 정리의 가정을 넘어선 과장된 비유다.

결국 이 이름에서 빌려 올 직관은 하나뿐이다. 해 보지 않은 선택지의 가치는 해 보기 전까지는 드러나지 않으며, 지금 당장 최선처럼 보이는 길만 따라가면 그 바깥의 가능성은 끝내 빈칸으로 남는다는 점이다. 다만 작은 시도로 빈칸을 어느 정도 채우고 나면, 이제는 언제 그 탐색을 멈추고 한곳에 깊이 들어가야 하는지 기준이 필요해진다.

# 8장 탐색을 끝내는 기준

작은 시도를 섞어 보면 선택지와 정보가 빠르게 늘어나지만, 탐색만 계속해서는 몰입이 필요한 결과까지 닿기 어렵다. 한 분야의 기초를 몸에 익히고, 다른 사람이 실제로 쓸 만한 결과물을 내며, 누구나 겪는 초반의 어려운 구간을 건너려면 한곳에 시간을 들여야 한다. 어느 시점이 지나면 “조금만 더 알아보고 정하겠다”는 말이 신중함이 아니라 실행을 미루는 핑계가 되기도 한다.

그렇다면 언제 탐색을 닫아야 할까. 누구에게나 똑같이 맞는 나이나 시도 횟수, 기간을 정해 주는 연구는 없기에, 지금 멈춰도 좋은 근거와 나중에 다시 열 조건을 스스로 정해 둘 필요가 있다.

## 탐색과 활용의 보상 시간

조직학습을 연구한 James March는 새로운 대안과 실험, 변이와 발견을 찾는 ‘탐색(exploration)’과, 이미 아는 것을 다듬어 효율적으로 실행하는 ‘활용(exploitation)’을 구분했다. 그의 설명에 따르면 탐색에서 나오는 성과는 활용의 성과보다 훨씬 불확실하고 늦게 나타나며, 심지어 탐색을 시작한 조직이 그 결실을 직접 거두지 못할 수도 있다. 단기 성과를 좇는 체계가 쉽게 활용 쪽으로 기우는 반면, 탐색만 계속하는 체계는 실험 비용만 치르고 정작 얻는 이득은 거의 없게 되는 이유가 여기에 있다.

물론 March의 논문은 조직을 다룬 이론 모형과 계산 모형이므로, 대학생의 진로 선택을 실험하거나 “20대에는 탐색하고 30대에는 활용하라” 같은 인생 주기를 제시하지는 않았다. 그럼에도 개인의 경험 역시 탐색과 몰입에서 얻는 정보의 결이 다르다는 점은 맞닿아 있다. 새 분야를 짧게 맛보는 동안에는 넓고 얕은 윤곽이 잡히지만, 초보 단계가 지난 뒤의 일과 반복해서 찾아오는 문제, 책임을 맡았을 때의 실제 생활은 한곳에 머물러 봐야만 드러난다. 그런 점에서 한동안 한길을 파는 일 자체도 깊은 정보를 얻는 탐색의 한 방식이 된다.

## 더 알아볼 가치 재기

탐색을 끝낼 시점은 완벽한 확신이 들 때까지 기다려 정하기보다, 지금 더 알아볼 가치가 실제로 남아 있는지를 아래 다섯 질문으로 따져 판단한다.

- 바닥을 넘는 선택지가 하나 이상 있는가.
- 남은 질문의 답이 현재 선택을 실제로 뒤집을 가능성이 큰가.
- 그 답을 얻을 방법과 비용이 분명한가.
- 더 탐색하느라 미루는 실행에서 잃는 것은 무엇인가.
- 어느 선택지든 일정 기간 해 봐야 평가할 수 있는가.

이 목록은 March의 구분과 탐색 원리를 개인 선택에 맞게 엮은 점검표이지, 진로 분야에서 따로 검증된 중단 규칙은 아니다. 다만 막연한 불안감과 결정을 바꿀 만한 실질적 정보 공백을 가르는 데 쓸모가 있다. 남은 질문이 결정을 뒤집을 만큼 중요하고 적은 비용으로 확인할 수 있다면 한 번 더 탐색한다. 반대로 답이 나와도 선택이 바뀌지 않거나 정보를 모으는 비용이 더 크다면 이제는 고를 때다. 어느 쪽을 택해도 바닥을 넘고 차이가 크지 않다면, 되돌리기 쉬운 쪽, 다음 선택에서도 쓸 능력이 남는 쪽, 실제 일을 더 가까이에서 볼 수 있는 쪽을 고르면 된다.

## 결정 뒤 돌아보지 않는 기간 두기

일단 하나를 고른 뒤에도 고르지 않은 다른 길을 매일 기웃거리면, 정작 선택한 길에 충분한 시간을 쓰지 못한다. 그래서 결정을 내릴 때는 비교를 잠시 멈출 기간도 함께 정한다. 한 학기나 인턴 기간, 혹은 맡은 프로젝트 한 주기처럼 실제 작업과 피드백이 한 바퀴 돌아올 수 있는 구간을 잡되, 그 길이는 선택의 성격과 감당할 수 있는 손실 폭에 맞춘다.

비교를 멈췄다고 해서 실행이 저절로 굴러가지는 않는다. Gollwitzer와 Sheeran이 실행의도를 다룬 94개 독립 검정(총 8,461명)을 메타분석한 결과, “상황 Y가 오면 행동 X를 한다”처럼 구체적인 실행 계획을 세운 집단은 막연히 목표만 세운 집단보다 목표 달성률이 높았다(d=.65). 연구들은 목표 행동의 시작이 늦어지거나, 방해 요소 때문에 진행이 끊기거나, 잘 풀리지 않는 행동을 계속 붙잡고 있거나, 다음 목표에 쓸 자기조절 역량을 소진하는 상황들을 폭넓게 살폈다.

다만 이 메타분석은 이미 목표를 정한 뒤의 실행 단계만을 다루었을 뿐, 애초에 어떤 목표를 고를지나 장기 경력 성공을 다룬 연구는 아니다. 따라서 이 결과는 선택이 끝난 뒤 행동을 구체화하는 데만 가져다 쓴다. 예컨대 “이번 학기에는 이 분야를 해 보겠다”고 다짐하기보다 “월·수 수업이 끝난 뒤 두 시간은 구현에 쓰고, 막힌 지 30분이 지나면 질문을 적어 도움을 청한다”처럼 상황과 행동을 묶어 두는 편이 실행으로 이어지기 쉽다.

## 재검토 날짜와 바로 다시 열 신호

한동안 다른 길과 비교하지 않기로 했더라도, 지금 가는 길에서 들어오는 새 증거까지 눈을 감으라는 뜻은 아니다. Sleesman과 동료들은 부정적 피드백이 이어지는데도 실패하는 경로에 자원을 계속 쏟아붓는 ‘몰입 상승(escalation of commitment)’ 현상을 실험실과 현장의 학생·관리자를 포함한 166개 독립 표본에서 메타분석했다. 그 결과 초기 결정을 자신이 내렸다는 개인적 책임감이 클수록 몰입을 계속할 가능성이 높았고(ρ=.258), 실패하는 프로젝트를 이어 갔을 때 느낄 것으로 예상되는 후회가 클수록(ρ=-.434), 그리고 정보를 손실보다 이익 관점으로 제시했을 때(ρ=-.349) 몰입을 이어 가는 경향이 낮았다. 연구는 기회비용을 분명히 드러내고 추가 정보를 확보하는 일 역시 몰입 상승을 줄이는 요인으로 다뤘다.

이 메타분석에 포함된 자료는 대부분 실험실 연구와 횡단 자료여서 종단·현장 연구가 상대적으로 적었고, 매몰비용 효과 역시 프로젝트를 얼마나 마쳤는지에 관한 정보가 함께 달라진 연구에서만 두드러졌다. 그럼에도 자신이 내린 결정이라는 책임감과 이미 들인 비용 때문에 새 경고 신호를 외면하기 쉽다는 점은 분명하므로, 결정을 내리기 전에 미리 재검토 절차를 못 박아 둘 근거로 삼을 수 있다.

정기 재검토 날짜가 오기 전이라도 즉시 판단을 다시 열어야 하는 신호들이 있다. 건강과 안전, 생활비, 돌봄, 체류 조건처럼 삶을 지탱하는 바닥이 무너졌을 때가 첫째다. 입사나 참여 전에 약속받은 역할과 실제 맡은 일이 크게 다르거나, 계속할수록 되돌리기 어려운 손실이 빠르게 불어날 때도 날짜를 기다리지 않고 바로 재검토한다. 반대로 단순히 힘든 하루를 보냈거나, 포기한 선택지에서 좋은 소식이 들려왔거나, 새 근거 없이 막연한 불안이 올라온 정도라면 정해 둔 재검토일까지 기다려야 비로소 의미 있는 경험이 쌓인다.

## 몰입 계약

결정을 내리고 일정 기간 한곳에 시간을 쏟기로 했다면, 머릿속 다짐으로 넘기지 말고 아래 ‘몰입 계약’에 실행 조건과 재검토 기준을 함께 적어 둔다.

```text
이번에 고른 한곳:
여기서 확인하거나 만들 결과:
몰입 구간:

시작 행동:
상황 ______가 오면 행동 ______를 한다.

지킬 바닥:
정기 재검토일:
그때 볼 실제 근거:

날짜를 기다리지 않고 다시 열 신호:
- 건강·안전·생활 조건:
- 역할과 약속의 중대한 변화:
- 새로 확인된 기회비용:

재검토일까지 하지 않을 비교:
```

몰입 계약은 비교를 잠시 접고 실제 경험을 쌓기 위해 스스로에게 거는 약속이다. 재검토일이 돌아왔을 때는 “아직도 확신이 있는가”를 묻기보다 그동안 무엇을 배웠는지, 바닥이 지켜졌는지, 기회비용이 어떻게 달라졌는지를 확인한다. 그리고 막연한 탐색을 넘어 실제로 한곳을 고르려 할수록, 그 직업이나 직무의 이름 뒤에 어떤 하루가 놓여 있는지부터 정확히 들여다볼 필요가 생긴다.

# 9장 직업명 뒤의 일과

한곳에 시간을 쏟기로 결심하기 전이든, 실제로 지원할 곳을 추리는 중이든 결국 확인해야 하는 것은 그 직업의 실제 하루다. 학과 이름이나 채용 공고의 직무명은 검색할 때 길잡이가 되지만, 그 이름 아래에서 보내는 하루에는 직함만으로 짐작할 수 없는 일이 훨씬 많이 들어 있다. 예컨대 같은 ‘소프트웨어 개발자’라도 새 기능을 설계하는 일과 장애 원인을 추적하는 일, 고객사의 낡은 시스템을 새 서비스와 잇는 일이 한 주 안에 뒤섞인다. ‘산업공학 엔지니어’ 역시 생산계획, 품질, 비용, 물류, 자동화 가운데 어느 축을 맡느냐에 따라 하루를 채우는 과업의 결이 크게 달라진다.

그래서 직업을 살펴볼 때는 화려한 직함부터 걷어 내고 다음 질문부터 던져 보는 편이 정확하다.

> 직업명을 가리고 월요일부터 금요일까지의 일을 보여 줘도 나는 이 일을 고를까?

이 질문에 답하려면 막연한 인상 대신 직무를 구성하는 실제 활동 목록을 펼쳐 봐야 한다. 미국 노동부가 제공하는 직업 정보 체계인 O*NET은 직함 아래에 과업, 작업 활동, 지식, 기술, 작업 맥락을 나누어 정리해 둔다. 실제로 소프트웨어 개발자 항목에는 요구 분석과 설계, 수정, 시험, 문서화, 협업이 함께 실려 있고, 산업공학 엔지니어 항목에는 생산 일정 검토, 자료 분석, 비용 추정, 품질관리, 생산 조정, 현장 관계자 협의가 나란히 들어 있다. 평소에 품어 온 “코딩을 좋아한다”거나 “최적화를 배우고 싶다”는 관심이 실제 하루와 맞아떨어지는지는 바로 이런 세부 항목과 대조해 봐야 비로소 드러난다.

## 하루를 이루는 과업, 사람, 책임

같은 직업을 조사하더라도 내용을 무작정 모으기보다 과업, 함께하는 사람, 책임이라는 세 축으로 나누어 보면 윤곽이 훨씬 선명해진다. 먼저 과업은 말 그대로 손에 잡히는 실제 작업으로, 코드를 작성하는지, 도면을 검토하는지, 장비를 측정하는지, 일정을 조율하는지에 관한 부분이다. 사람 쪽에서는 혼자 깊이 파고드는 시간과 회의, 고객 응대, 현장 협의가 어떤 비율로 섞이는지를 본다. 마지막으로 책임은 일이 어긋났을 때 감당하는 무게다. 계산을 다시 해 보면 끝나는 실수인지, 한밤중에 일어나 시스템을 복구해야 하는지, 생산 라인을 세워야 하는지, 사람의 안전과 직결되는지에 따라 겉보기에 비슷한 과업도 전혀 다른 압박으로 다가온다.

현직자에게 “주로 무엇을 만드나요?”라고만 물으면 대개 완성품이나 성과 이야기만 돌아오기 쉽다. 정작 하루의 체감을 좌우하는 대기 시간과 승인 절차, 반복적인 점검, 일이 깨졌을 때의 수습 과정은 그 질문에 잘 걸리지 않는다. 실제 하루를 복원하려면 아래 표의 다섯 항목을 함께 짚어 묻는 것이 좋다.

| 확인할 것 | 구체적으로 묻는 방식 | 답에서 찾을 단서 |
|---|---|---|
| 시간 | 지난주 달력에서 가장 오래 쓴 세 가지는 무엇이었나요? | 직무 설명과 실제 배분의 차이 |
| 산출물 | 한 주가 끝날 때 무엇이 남나요? | 코드, 문서, 분석, 장비 상태, 의사결정 등 |
| 협업 | 누구의 답을 기다려야 일이 진행되나요? | 의존 관계와 조정 비용 |
| 실패 | 가장 자주 되돌아오는 일은 무엇인가요? | 검토, 수정, 장애, 민원, 재작업의 종류 |
| 리듬 | 예정된 일과 갑자기 생기는 일의 비율은 어느 정도인가요? | 계획 가능성과 긴급 대응 부담 |

표에 모인 단서를 놓고 보면 자신이 견딜 수 있는 반복과 피하고 싶은 책임이 가려진다. 긴 집중 시간이 필요한 사람에게는 회의와 조율이 잦은 직무가 큰 소모로 이어지고, 반대로 문제를 혼자 오래 붙들고 있는 편이 답답한 사람에게는 현장 대응과 협의 비중이 높은 일이 오히려 잘 맞을 수 있다.

## 공고에서 실제 일 복원하기

현직자를 만나기 전에 가장 손쉽게 구할 수 있는 첫 자료는 채용 공고다. 다만 회사는 공고에서 같은 직무명 아래 서로 다른 역할을 묶어 쓰기도 하고, 앞으로 바라는 이상적인 역할을 이미 굴러가는 일상처럼 적어 두기도 한다. 그래서 공고를 읽을 때는 ‘플랫폼’, ‘혁신’, ‘AI’ 같은 거창한 명사보다 ‘설계한다’, ‘검증한다’, ‘배포한다’, ‘조정한다’, ‘보고한다’ 같은 동사에 먼저 표시해야 하루의 움직임이 잡힌다. 그런 다음 각 동사를 산출물과 짝지어 무엇을 설계하고, 누가 검증하며, 만든 보고서를 누가 의사결정에 쓰는지까지 따라가 본다.

공고를 읽는 순서를 잡을 때는 처음부터 한 회사만 깊게 파기보다 산업과 회사 규모가 다른 공고 세 개쯤을 나란히 놓고 직함의 폭을 가늠하는 편이 낫다. 여러 회사에서 거듭 등장하는 동사는 그 직종 전체의 공통 과업에 가깝고, 특정 회사에서만 도드라지는 동사는 그 조직이나 제품 고유의 일일 가능성이 크다. 새 공고를 더 읽어도 반복되는 동사와 미확인 항목이 거의 달라지지 않을 때까지 표본을 늘린 뒤에는 현직자와의 대화, 그리고 가능하면 작업 현장이나 공개된 업무 문서를 하나쯤 보탠다. 면접용 회사 소개 페이지보다 공개 저장소의 이슈와 코드 리뷰, 기술 블로그의 장애 회고, 제조 현장의 품질 절차, 직무별 포트폴리오 예시처럼 실제 작업의 흔적이 홍보 문구보다 훨씬 정직한 단서를 준다.

## ‘하루 표본’ 직접 만들기

공고와 자료에서 모은 단서가 머릿속에서 흩어지지 않도록, 관심이 가는 직무마다 아래 네 항목을 한 장에 정리해 본다.

1. **반복 과업:** 한 달 안에 여러 번 할 가능성이 큰 일 세 가지
2. **주요 산출물:** 잘했는지 다른 사람이 확인할 수 있는 결과
3. **의존 관계:** 일을 시작하거나 끝내려면 답을 받아야 하는 사람
4. **문제가 생겼을 때:** 일정 지연, 재작업, 긴급 호출, 비용, 안전 문제 가운데 내가 책임지고 처리할 것

정리하는 동안 아직 알지 못하는 칸은 어림짐작으로 메우지 말고 ‘미확인’이라고 적어 둔다. 바로 그 빈칸이 다음에 현직자나 면접관에게 건넬 질문이 된다. 두 직무를 비교할 때도 멋있어 보이는 대표 산출물만 나란히 놓지 말고, 매일 반복되는 과업과 일이 깨졌을 때 맡는 뒷수습을 바로 옆에 붙여 본다. 입사 전에 업무 시간의 정확한 비율까지 미리 재기는 어려우므로, 판단을 바꿀 만한 빈칸을 분명히 표시해 두는 선에서 멈추어도 충분하다.

이야기를 들을 때는 가능하면 현직자 두 명 이상에게 물어보는 편이 안전하다. 같은 직무라도 경력 연차와 팀 규모, 산업, 제품의 성숙도에 따라 일의 배분이 크게 달라지고, 신입에게 맡기는 일과 5년차가 처리하는 일 역시 다르기 때문이다. 질문을 건넬 때도 “보통 하루가 어떤가요?”에서 끝내지 말고, “마감 직전인 주와 별일 없는 주의 하루가 어떻게 다른가요?”라고 한 걸음 더 물어야 평균 뒤에 가려진 실제 변동 폭이 드러난다.

## O*NET 자료의 한계

O*NET은 여러 직업을 일정한 기준으로 비교하기에 매우 유용한 공공 자료다. 직무 분석가의 평가에 직업 전문가와 실제 종사자의 자료를 결합해 과업과 작업 맥락을 체계적으로 정리해 놓았기 때문이다. 그러나 어디까지나 미국 노동시장의 직업 단위 통계이므로, 특정 회사의 팀 문화나 한국의 고용 관행까지 그대로 보여 주지는 못한다. 같은 직업 코드 안에서도 산업과 조직에 따른 편차가 크고, 빠르게 바뀌는 도구의 활용 비중 역시 조사 시점을 기준으로 삼는다.

따라서 O*NET의 과업 목록은 직무를 탐색하는 출발점이자 체크리스트로 삼는 편이 알맞다. 그 위에서 한국의 채용 공고를 훑어 반복되는 동사를 모으고, 종사자와의 대화로 시간·산출물·의존 관계·실패 책임을 메워 나가야 비로소 내가 지원하려는 일터의 하루가 그려진다. 이렇게 하루의 윤곽을 잡았다면, 다음으로 살필 질문은 그 하루 가운데 얼마나 많은 시간이 ‘새로 만들기’에 쓰이고 얼마나 많은 시간이 ‘고치고 운영하기’에 들어가는가다.

# 10장 만들기, 고치기, 운영하기

직업의 하루를 구성하는 요소를 뜯어보고 나면 곧이어 부딪히는 장면이 있다. 엔지니어의 일을 바깥에서 소개할 때는 대개 번듯한 완성품을 새로 만드는 순간을 앞세우지만, 막상 제품과 시스템이 세상에 나오고 나면 그때부터 해야 할 일이 꼬리를 물고 이어진다. 시험 단계에서 놓친 문제를 찾아내고, 달라진 사용 환경에 맞추어 구조를 손보며, 장애가 터지면 급히 복구하고, 같은 사고가 되풀이되지 않도록 관찰 방식과 작업 절차를 고친다. 오래 쓰이는 시스템일수록 새로 짜는 시간보다 고치고 운영하는 시간이 하루의 훨씬 큰 몫을 차지하기 쉽다.

그래서 엔지니어의 직무를 들여다볼 때는 무엇을 새로 만드는가 못지않게, 이미 돌아가고 있는 것을 얼마나 오래 어떤 방식으로 책임지는지를 함께 보아야 한다.

## 개발 한 번보다 전체 수명주기 보기

제품이나 설비가 한 번 만들어져 유지되는 전체 수명주기를 단계별로 펼쳐 놓으면, 직무마다 맡는 구간의 차이가 한눈에 들어온다.

**정의한다 → 설계한다 → 구현한다 → 시험한다 → 내보낸다 → 관찰한다 → 복구하고 예방한다**

이 흐름 전체를 한 사람이 두루 맡는 작은 팀도 있고, 단계마다 담당자가 나뉘는 큰 조직도 있다. O*NET의 대표 직무들을 나란히 놓아 보아도 그 결이 뚜렷하다. 소프트웨어 개발자는 요구 분석과 설계, 수정, 시험을 한 흐름으로 맡는 비중이 크고, 네트워크·시스템 관리자는 설치와 설정, 성능 관찰, 접근 권한 관리, 장애 진단과 복구에 무게가 실린다. 한편 메카트로닉스 기술자는 전기·기계 장치를 설치하고 시험할 뿐 아니라, 전기·전자·기계 부품과 장비를 직접 진단해 수리하고 유지하는 일까지 책임진다. 세 직무 모두 기술적 판단을 내리지만, 손에 남는 결과물과 대응의 긴급성, 현장을 오가는 비중은 전혀 다르다.

특정 팀의 업무를 알아볼 때는 아래 ‘책임 경계표’를 직접 채워 보면 내가 어디까지 관여하게 되는지 가늠할 수 있다. 표에 빈칸이 많이 남을수록 현직자 대화나 면접에서 꼭 확인해야 할 대목이 남아 있다는 뜻이다.

| 단계 | 내가 직접 하는 일 | 최종 승인자 | 문제가 나면 먼저 움직이는 사람 | 남는 기록 |
|---|---|---|---|---|
| 정의·설계 |  |  |  | 요구사항, 도면, 설계 기록 |
| 구현·설치 |  |  |  | 코드, 부품, 설정, 작업 기록 |
| 시험·출시 |  |  |  | 시험 결과, 검토 기록, 배포 기록 |
| 관찰·복구 |  |  |  | 로그, 점검표, 장애 기록 |
| 재발 방지 |  |  |  | 원인 분석, 자동화, 절차 변경 |

표를 채울 때 가장 중요한 원칙은 ‘내가 참여한다’와 ‘내가 책임진다’를 섞어 적지 않는 것이다. 시험 회의에 배석해 의견을 내는 일과 합격 기준을 최종 승인하는 일, 그리고 장애 원인을 사후에 분석하는 일과 새벽 호출을 받아 즉시 복구하는 일은 감당해야 할 생활의 무게가 다르다. 이 책임 경계를 짚어 보지 않고 입사하면, 관심 있는 기술 분야를 잘 골라 놓고도 일상의 리듬이 예상과 크게 어긋나기 쉽다.

## 빈 종이가 거의 없는 만들기

현업에서는 백지 상태에서 완전히 새로 만드는 일 자체가 드물다. 새 제품을 개발하더라도 이미 팔린 제품과의 호환성, 정해진 예산과 인증, 촉박한 납기, 기존 고객 데이터, 다른 팀이 관리하는 부품과 서비스라는 제약 위에서 출발해야 한다. 흔히 ‘그린필드’라 부르는 신규 프로젝트조차 사용할 인력과 일정, 이미 고른 도구, 앞으로 올라갈 운영 환경의 틀 안에서 움직인다. 반대로 유지보수라고 해서 단순 반복만 있는 것도 아니다. 거듭 터지는 장애를 줄이려고 모니터링 체계를 다시 짜거나, 섣불리 교체하기 어려운 설비의 점검 순서를 바꾸고, 낡은 코드의 얽힌 경계를 정리하는 작업에는 새 기능을 짤 때 못지않은 설계 판단이 들어간다.

수명주기의 각 일은 문제가 어디서 시작되고 무엇이 끝나야 완료되는지에 따라 성격이 갈린다. ‘만들기’는 아직 존재하지 않는 기능이나 성능을 정해진 조건 안에서 구현하는 일이고, ‘고치기’는 실제로 관측된 이상 현상을 재현하고 원인을 좁혀 기대 상태로 되돌리는 작업이다. ‘운영’은 지금 정상적으로 돌아가는 시스템이 계속 정상을 유지하도록 상태를 살피며 대응하는 흐름이며, ‘예방’은 같은 문제가 다시 발생할 확률이나 피해 규모를 줄이기 위해 구조나 절차를 바꾸는 일이다.

성격이 다른 만큼 각 작업이 안겨 주는 답답함의 종류도 다르다. 만들기에서는 요구사항이 수시로 바뀌거나 어디까지가 끝인지 모호해지는 일이 잦고, 고치기에서는 문제의 원인이 내가 손댈 수 없는 외부 영역에 있거나 현상 자체가 좀처럼 재현되지 않아 애를 먹는다. 운영은 아무 일 없이 잘 지킨 날일수록 공이 눈에 잘 띄지 않는 데다, 예외 상황이 터지면 퇴근 뒤 시간까지 밀고 들어올 수 있다. 결국 내가 어느 종류의 답답함을 비교적 잘 견디는지는 어떤 기술 스택을 좋아하는가만큼이나 중요한 직업 조건이 된다.

## 면접에서 물을 비율과 예외

면접 자리에서 “개발과 유지보수 비율이 어떻게 되나요?”라고 묻는 것은 좋은 출발이지만, “반반 정도 됩니다” 같은 평균치 하나만 듣고 넘어가면 실상을 놓치기 쉽다. 질문을 아래 순서처럼 좁혀 들어가면 팀의 실제 하루가 훨씬 선명하게 드러난다.

1. 지난 분기에 팀이 낸 결과를 새 기능, 성능 개선, 결함 수정, 운영 자동화로 나누면 어느 쪽이 컸는가.
2. 입사 첫 6개월에 신입이 맡는 일은 어느 단계인가.
3. 정상 근무 밖의 대응이 있다면 빈도, 보상, 교대 방식은 어떻게 되는가.
4. 장애 뒤에 원인 분석과 재발 방지를 할 시간이 실제로 배정되는가.
5. 오래된 시스템의 변경을 가장 크게 막는 제약은 무엇인가.

답변을 들을 때는 말로 짚어 주는 숫자뿐 아니라, 서로 다른 면접관이 비슷한 그림을 설명하는지, 최근에 겪은 구체적인 사례를 댈 수 있는지를 함께 본다. 만약 “상황에 따라 다르다”는 답이 돌아오면 어떤 상황에서 누가 최종 결정을 내리는지 한 번 더 되묻는다. 특히 온콜(근무시간 밖 호출 대기), 현장 출동, 교대 근무, 고객 직접 대응 같은 조건은 채용 공고에 한 줄로 짧게 적히거나 아예 빠지는 일이 흔하므로 면접에서 반드시 짚고 넘어가야 한다.

## O*NET 직무 자료로 볼 수 있는 범위

수명주기의 여러 지점을 한눈에 비교하려면 앞서 본 O*NET의 직무 자료를 출발점으로 삼기 좋다. 소프트웨어 개발자, 네트워크·컴퓨터 시스템 관리자, 메카트로닉스 기술자의 과업 목록을 나란히 펼쳐 보면 설계·시험·관찰·복구가 직업마다 어떤 형태와 비중으로 나타나는지 윤곽을 잡을 수 있다. 다만 이 자료가 보여 주는 범위는 어디까지나 직업 코드 단위의 대표 과업이다. 특정 회사의 팀별 업무 배분까지 담고 있지는 않으니 “개발자는 설계만 하고 관리자는 운영만 한다”는 식으로 직무를 단정 짓는 근거로 삼아서는 안 된다.

따라서 공공 직무 자료로 수명주기별 대표 과업을 파악한 뒤에는, 지원할 조직의 최근 프로젝트와 면접에서 들은 답변으로 책임 경계표의 빈칸을 채워 나가는 순서가 맞다. 그리고 직무를 비교해 본 마지막 자리에는 내가 맡을 책임이 출시에서 끝나는지, 초기 안정화까지인지, 장애 복구와 재발 방지까지 이어지는지 그 끝선을 적어 둔다. 그 끝선이 분명해야 이 일이 내 일상에 어디까지 들어오는지, 그리고 그 과정에서 어떤 충돌하는 조건들을 끊임없이 조율해야 하는지가 함께 보인다.

# 11장 제약이 충돌할 때

앞 장에서 살핀 수명주기의 어느 구간을 맡든, 엔지니어의 하루를 관통하는 핵심 작업은 결국 선택이다. 원하는 성능을 모두 손에 넣을 수 있다면 결정은 단순한 계산 문제로 끝나겠지만, 현업에서 마주하는 기술적 판단에는 대개 맞바꿈이 따른다. 출시 일정을 당기면 시험 시간이 깎이고, 안전 여유를 넉넉히 잡으면 비용이나 무게가 늘며, 기능을 하나 더 얹으면 운영 부담이 불어난다. 공학 교육 인증 기준인 ABET 역시 공학 설계를 여러 제약 안에서 해법을 찾는 과정으로 규정하면서, 정해진 요구를 충족하는 동시에 공중보건과 안전, 복지, 나아가 세계적·문화적·사회적·환경적·경제적 요인까지 함께 고려하도록 요구한다.

이처럼 요구조건이 서로 충돌할 때 엔지니어는 무엇을 끝까지 지키고 무엇을 바꿀 것인가. 기술적 선택에서는 그 비용을 누가 언제 치르는지, 그리고 어떤 가정이 달라질 때 결론이 뒤집히는지가 판단의 기준이 된다.

## 지킬 조건과 비교할 목표 나누기

모든 요구사항을 같은 점수판 위에 올려놓으면, 협상해서는 안 되는 조건까지 비용이나 속도와 거래하게 된다. 그래서 법규와 안전 기준, 사용자의 기본 권리, 계약상 반드시 지켜야 하는 최소 성능은 비교표에 넣기 전에 먼저 분리해 두어야 한다. 이 필수 조건을 통과하지 못한 대안은 가중치를 아무리 조정해도 후보군에서 제외한다.

필수 조건을 넘긴 안들 사이에서는 처리 속도, 정확도, 사용 편의, 납기, 유지보수성 같은 목표 성능을 나란히 놓고 저울질한다. 이때 비용 항목에는 돈만 적지 않고 개발에 드는 시간, 운영자가 계속 기울여야 하는 주의, 에너지 같은 자원, 장애 발생 시 복구 난이도, 특정 공급망에 대한 의존도까지 함께 올린다. 아직 측정하지 않은 항목은 어림짐작으로 점수를 매기지 말고, 어떤 방법으로 검증할지부터 붙여 두어야 판단이 흐려지지 않는다.

실제 결정 과정에서는 아래 다섯 항목을 공학 결정 기록으로 남기면 나중에 기준을 되짚기 쉽다.

| 확인할 것 | 물을 질문 | 남길 기록 |
|---|---|---|
| 규제·안전 제약 | 통과 여부를 무엇으로 검증하는가 | 적용 기준, 시험 결과, 미통과 항목 |
| 목표 성능 | 좋아졌다고 판정할 값은 무엇인가 | 비교값과 측정 조건 |
| 부담 주체와 시점 | 개발·운영·사용자 가운데 누가 언제 값을 치르는가 | 비용이 이동하는 경로 |
| 결론을 뒤집는 경계값 | 어떤 값부터 다른 안이 유리한가 | 낙관·기준·비관 범위와 추가 시험 |
| 결정권과 이의제기권 | 누가 승인하고 누가 문제를 다시 올릴 수 있는가 | 승인자, 검토자, 재검토 조건 |

표에서 보듯 처음부터 총점만 합산해 버리면 안전 1점과 비용 1점이 마치 같은 무게로 교환 가능한 것처럼 착각하기 쉽다. 제약을 먼저 통과시키고, 측정하지 않은 값은 작은 시험으로 보내 확인한 뒤, 살아남은 후보 안에서는 평균 점수보다 결론을 뒤집는 경계값과 비용이 이동하는 경로를 살피는 편이 정확하다.

## 트레이드오프에서 값을 치르는 쪽

기술적 선택이 남기는 결과는 관련된 사람들에게 똑같이 돌아가지 않는다. 개발 기간을 줄이려고 내린 결정의 대가를 몇 달 뒤 운영자가 야간 장애 대응으로 치를 수 있고, 제품 가격을 낮추느라 설치 절차를 복잡하게 만들면 그 시간 비용은 고스란히 고객이나 현장 기술자에게 넘어간다. 계산 성능을 끌어올리는 대신 전력 소모를 늘려 장비를 더 자주 교체하게 만드는 경우도 마찬가지다. 흔히 말하는 “전체적으로 효율적이다”라는 표현은 바로 이런 비용의 이동을 가리기 쉽다.

그러므로 비용을 적을 때는 액수나 시간 옆에 누가 언제 그 부담을 지는지를 반드시 함께 적어야 한다. 지금의 우리 팀인지, 다음 분기의 유지보수 팀인지, 아니면 사용자·협력사·지역사회인지가 분명해져야 맞바꿈의 실체가 보인다. 되돌리기 어려운 결정일수록 나중에 그 시스템을 넘겨받을 사람이 구조를 바꿀 권한을 잃지 않도록 설계하고, 당시 어떤 가정을 근거로 판단했는지 기록을 남겨 두어야 한다. 결정 기록은 누구를 탓하기 위한 문서가 아니라, 나중에 사정이 달라졌을 때 무엇을 근거로 수정할지 판단하는 자료다.

불확실한 수치를 억지로 단 하나의 숫자에 끼워 맞출 필요도 없다. 낙관·기준·비관 범위를 함께 적거나, “배터리 수명이 이 값 아래로 떨어지면 후보 B가 낫다”처럼 결론이 뒤집히는 경계값을 찾아 두면 추가로 무엇을 시험해야 하는지 목적이 선명해진다. 모든 불확실성이 사라질 때까지 결정을 미루면 마감에 쫓겨 더 나쁜 선택을 하기 쉬우므로, 결론을 바꿀 가능성이 큰 미확인 항목부터 줄여 나가는 편이 낫다.

## 회의에서 주장보다 가정 붙이기

여러 이해관계자가 모이는 회의에서는 대안을 무작정 많이 내놓기 전에 반드시 지켜야 할 제약과 최종 결정권자부터 확인하는 일이 우선이다. 회의가 시작되면 사람별로 찬반 의견을 받아 적기보다, 각 주장이 어떤 가정과 자료에 기대고 있는지를 옆에 붙인다. 그러면 논쟁이 취향 싸움으로 흐르지 않고 두 주장이 갈리는 구체적인 조건이 드러난다.

갈리는 조건을 작은 시험으로 확인할 수 있다면 담당자와 기한을 정한다. 반대로 시험 비용이 결정을 미루는 손실보다 크다면 불확실성을 안고서라도 하나를 고르되, 어떤 신호가 들어오면 다시 따져 볼지 재검토 조건까지 못 박아 둔다. 예컨대 법규가 개정되거나, 예상했던 사용량을 넘어서거나, 핵심 가정이 틀렸다는 측정 자료가 들어왔을 때 무엇을 다시 검토할지 적는 식이다. 개인의 일반적인 실행 약속에는 몰입 계약의 틀을 쓰더라도, 공학 결정에서는 안전 기준과 검증 결과를 재검토 신호로 삼는 편이 맞다(→ [8장](./chapter_08_commit.md)).

## 이런 결정을 직업으로 삼기

참고로 ABET 문서는 미국의 공학 교육 프로그램을 인증하는 기준이다. 따라서 이 기준에서 빌려 올 범위는 공학 설계가 정해진 요구를 충족하면서 공중보건과 안전, 복지, 여러 사회적 요인을 함께 다룬다는 출발점까지이며, 개별 회사의 의사결정 방식이나 산업별 안전 표준은 현장마다 따로 확인해야 한다.

진로를 고르는 입장에서 남는 질문은 표를 깔끔하게 채우는 요령이 아니다. 서로 충돌하는 요구를 풀어야 하는 상황이 반복될 때 흥미를 느끼는지, 일정과 비용 때문에 무언가를 포기해야 할 때 그 사실을 솔직하게 설명하고 비용이 다른 사람에게 떠넘겨지지는 않는지 살필 의지가 있는지가 더 중요하다. 자료가 완벽하지 않아도 책임자를 정해 결정을 밀어붙이고, 안전이나 권리가 걸린 문제라면 다시 이의를 제기할 수 있는 자리인지도 따져 보아야 한다.

현직자를 만날 기회가 있다면 최근에 성능과 일정, 비용이 정면으로 충돌했던 결정 사례를 하나만 들려 달라고 청해 본다. 그 자리에서 무엇을 끝까지 지켰고 무엇을 접었는지, 그리고 결과의 책임을 누가 맡았는지를 들으면 그 직무에서 날마다 마주할 판단의 성격이 보인다. 나아가 기술적 판단에서 비용의 이동을 따지는 이 눈은, 이제 막 사회로 나아가면서 내 노동과 시간을 걸고 받아 드는 ‘입사 제안’의 조건을 뜯어볼 때도 그대로 필요해진다.

# 12장 입사 제안 따져 보기

직무 내용과 기술적 판단의 결이 마음에 들어도, 그 일을 오래 이어 가려면 일을 둘러싼 조건이 자신의 생활과 맞아떨어져야 한다. 급여가 중요한 기준인 것은 맞지만, 연봉이라는 숫자 하나가 다른 모든 조건을 대신해 주지는 않는다. 실제 생활은 계약의 안정성과 근무시간, 통근 거리, 근무 장소를 고를 권한, 예고 없는 호출 빈도, 휴가를 실제로 쓸 수 있는 분위기, 아플 때 일을 멈출 수 있는 여부에 따라 한꺼번에 달라진다.

그래서 제안을 받아 들었을 때는 “연봉이 오르더라도 오히려 삶이 나빠질 수 있는 조건은 무엇인가”부터 물어야 한다. 막연히 ‘워라밸’이 좋은지 묻기보다 조건을 항목별로 쪼개 물어야 비교 가능한 답이 나온다. OECD가 일자리의 질을 살피며 쓰는 틀은 소득의 질, 노동시장 안전성, 작업환경의 질 세 축으로 나뉜다. 얼마나 많이 버는가와 함께 일자리를 잃을 위험이나 실직 시 소득 손실이 얼마나 큰가, 그리고 일하는 동안 어떤 직무 요구를 받으며 이를 감당할 자원이 얼마나 주어지는가를 따로 보는 방식이다. 개인이 입사 제안을 비교할 때도 이 구분이 그대로 쓸모가 있다.

## 제안서의 숫자를 한 주의 생활로 바꾸기

여러 제안을 나란히 놓고 볼 때는 ‘좋음·보통·나쁨’처럼 막연한 인상을 적기보다 **확정·변동·미확인** 세 칸으로 나누어 정리한다. 근로계약서와 사규에 명시되어 바꿀 수 없는 것은 확정 칸에, 개인 성과나 부서 배치에 따라 달라지는 것은 변동 칸에, 아직 면접에서 명확한 답을 얻지 못한 것은 미확인 칸에 올린다.

| 조건 | 확정된 것 | 변동하는 것 | 미확인: 아직 물어볼 것 |
|---|---|---|---|
| 보상 | 기본급, 지급일, 고정 수당 | 성과급, 주식, 교대·출장 수당 | 산정 기준과 최근 지급 범위 |
| 시간 | 소정근로시간, 휴일, 휴가 | 마감기 초과근무, 온콜, 교대 | 최근 팀의 실제 빈도와 보상 |
| 장소 | 근무지, 출근 원칙 | 재택 허용일, 고객사·현장 배치 | 정책 변경 권한과 통근 범위 |
| 안정성 | 계약 형태, 수습 조건 | 조직 개편, 프로젝트 종료 뒤 배치 | 평가 기준과 계약 종료 조건 |
| 회복 | 휴가 일수, 병가 제도 | 휴가 승인, 업무 대체 가능성 | 팀에서 실제로 쉬는 방식 |
| 생활 비용 | 정기 통근 여부, 이사 필요 여부 | 출장, 식비, 돌봄 비용 | 빈도와 본인 부담 범위 |

표에 보상을 옮길 때는 총보상 액수만 합산하지 말고 지급 조건을 기준으로 구분해 적는다. 성과급은 ‘목표치’와 실제로 지급된 ‘분포’를 나누어 적고, 주식 보상은 현금과 같은 줄에 섞지 않는다. 시간 칸에서는 통근 시간과 무급 대기, 정기적인 야간 대응을 주간 시간표에 직접 올려 본다. 한 달에 한두 번처럼 발생 빈도가 낮아 보여도 수면 리듬이나 주말 계획을 깨뜨리는 일이라면, 평균 근로시간에 잡히는 숫자보다 실제 생활에 주는 타격이 훨씬 클 수 있다.

표를 채우는 동안에는 돈으로 보상받더라도 내주지 않을 조건도 함께 가려 두어야 한다. 예컨대 당분간 거주지를 옮길 수 없는 사정이나, 밤 시간에는 반드시 잠을 자야 하는 건강상의 이유, 정해진 돌봄 시간처럼 먼저 지켜야 할 바닥이 있다. 이런 필수 조건을 확보한 뒤에야 개인의 선호를 비교한다. 원격근무가 무조건 좋은지 출근이 좋은지 일반적인 답을 찾기보다, 내 생활에서 집중과 협업, 통근 시간, 일과 삶의 경계 가운데 어느 쪽이 어떻게 달라지는지 따져 보는 편이 현실적이다.

## 평균 효과와 내 근무표

근무 형태가 실제로 일하는 경험에 어떤 차이를 만드는지는 여러 실증 자료에서도 힌트를 얻을 수 있다. Gajendran과 Harrison은 원격근무를 다룬 46개 연구(총 12,883명)를 메타분석해, 원격근무가 스스로 느끼는 자율성과 직무만족, 상사 평가나 기록으로 잰 성과와는 작은 양의 관련을, 역할 스트레스 및 이직 의도와는 작은 음의 관련을 보인다고 보고했다. 동료와의 관계는 전반적으로는 큰 차이가 없었으나 주 2.5일을 넘는 고강도 원격근무에서는 오히려 나빠지는 경향이 나타났다. 다만 포함된 연구 대부분이 비실험 자료이고 무작위 현장 실험은 없었기 때문에 인과관계를 단정하기보다는 관련성의 크기 정도로 읽어야 하며, 2007년까지의 근무 제도를 다룬 분석인 만큼 팬데믹 이후 자리 잡은 상시 화상 협업 환경은 별도로 확인해야 한다. 무엇보다 이 수치는 집단 평균의 경향일 뿐, 개인이 겪는 결과는 자율성과 원격근무 강도, 직무의 성격에 따라 크게 달라진다.

근무시간은 만족도를 넘어 건강과 직접 맞닿는다. WHO와 ILO가 여러 국가의 자료를 결합해 산출한 질병 부담 추정에서는 주 55시간 이상 일하는 집단이 주 35~40시간 일하는 집단보다 뇌졸중과 허혈성 심장질환 위험이 더 높은 것으로 나타났다. 물론 관찰 연구에서 얻은 상대위험을 국가별 노출 자료와 합친 인구 수준 모형이므로, 이번 달 초과근무가 특정 개인에게 당장 질환을 일으킬지 예측하는 도구는 아니다. 그럼에도 상시적인 장시간 근로를 단순히 “초기 경력의 성장 기회”라는 말로만 덮어 두기 어려운 이유만큼은 이 추정이 분명히 보여 준다.

한국에서 일할 때 반드시 확인해야 하는 계약과 임금, 근로시간, 휴일의 법적 바닥은 국가법령정보센터의 최신 「근로기준법」과 고용노동부의 근로계약서 안내에서 찾아볼 수 있다. 고용노동부가 제공하는 표준 양식은 임금, 소정근로시간, 휴일, 연차유급휴가 등을 서면으로 분명히 적도록 정하고 있다. 법이 보장하는 최소 기준과 회사가 현장에서 실제로 굴리는 관행은 엄연히 다르므로 둘을 섞어 보지 말아야 하며, 회사에 대한 막연한 평판이나 익명 후기 한 건은 판단의 근거가 아니라 참고 자료로만 쓴다.

## 제안을 받은 뒤의 확인 순서

입사 제안을 손에 쥐었다면 감정에 휩쓸리기 전에 서면 자료부터 펼쳐 놓는다. 근로계약서와 보상 제안서, 취업규칙에 명확히 적힌 내용만 표의 ‘확정’ 칸으로 옮긴 뒤, 질문할 대상을 나눈다. 계약 형태와 보상 산정 기준은 채용 담당자에게 묻고, 팀의 실제 퇴근 시간과 근무 장소 운영, 긴급 대응 방식은 현업 면접관이나 팀장에게 묻는다. 누구에게 무엇을 물을지 갈라 두어야 “아마 괜찮을 겁니다” 같은 모호한 대답을 줄일 수 있다.

질문을 건넬 때는 평시와 예외 상황을 꼭 나누어 묻는다. “보통 몇 시에 퇴근하나요?”라는 질문에 이어 “지난 석 달 동안 밤늦게까지 일한 주는 몇 번 있었고, 그때는 무엇 때문이었나요?”를 붙여 묻는 식이다. 재택근무 제도가 있다면 누가 승인하는지, 실제로 썼을 때 평가나 승진에서 불이익이 없는지도 짚는다. 온콜 대응이 포함된 자리라면 교대 인원 수와 실제 호출 빈도, 복구에 걸리는 시간, 다음 날 휴식 보장과 수당 지급 기준까지 확인해야 빈틈이 없다.

마지막 단계에서는 비교 중인 두 제안을 한 주짜리 빈 달력에 각각 직접 채워 넣는다. 근무시간과 통근 시간, 잠과 회복에 필요한 시간, 그리고 공부나 인간관계에 남길 시간까지 칸을 배정해 보면, 연봉 차이로 내가 실제로 얻는 것과 내어 주는 것이 한눈에 들어온다. 선택을 뒤집을 만큼 중요한 조건이 아직 미확인으로 남아 있다면 서명하기 전에 반드시 답을 받아야 하며, 끝내 답을 듣지 못했다면 그 불확실성 자체를 하나의 비용으로 계산에 넣는다.

OECD의 틀과 관련 연구가 알려 주는 것은 우리가 흔히 놓치기 쉬운 조건과 위험이 기우는 방향까지다. 실제 특정 회사에서의 생활은 최신 법적 기준과 서면 계약, 그리고 지원 팀의 최근 운영 자료로 미확인 칸을 지워 나가며 한 주 달력에 반영해 보아야 비로소 윤곽이 잡힌다. 게다가 종이 위의 계약 조건과 직무 설명이 똑같아 보여도, 막상 발을 들이고 나서 매일 부딪히는 경험은 내가 속할 바로 그 팀의 운영 방식에 따라 또 한 번 크게 갈린다.

# 13장 같은 직무, 다른 팀

입사 제안서와 근무 조건까지 확인했더라도, 막상 출근해 보면 팀에 따라 완전히 다른 직업을 살게 된다. 같은 직무 설명서를 걸고 뽑아도 어떤 팀에서는 문제를 발견한 사람이 곧장 실험하고 고칠 수 있는 반면, 어떤 팀에서는 작은 변경 하나에도 여러 단계의 결재를 기다려야 한다. 팀이 질문과 실수를 받아들이는 태도와 상사가 우선순위를 정리하고 흔드는 방식에 따라 하루의 속도와 긴장감이 달라지기 때문이다.

결국 확인해야 할 물음은 하나로 모인다. 이 팀에 들어가면 실제로 일을 배우고 잘못된 것을 고칠 수 있는가. '분위기가 좋다'는 막연한 인상 대신 자율성, 심리적 안전, 피드백, 상사의 역할이라는 네 축으로 나누어 행동 증거를 짚어 보면 그 답에 훨씬 가까워진다.

## 자율성과 방치 가르기

자율성이 팀 경험에 미치는 무게는 직무 설계 연구에서도 반복해서 확인된다. Humphrey, Nahrgang, Morgeson이 259개 연구, 219,625명의 자료를 모아 분석한 결과, 자율성과 과업의 중요성·정체성, 직무 피드백 같은 동기적 특성은 직무만족, 몰입, 수행과 뚜렷한 관련을 보였다. 동료의 사회적 지원과 업무상 상호의존 같은 사회적 특성 역시 별도의 설명력을 보태, 일의 내용 못지않게 일을 조직하는 방식이 현장의 경험을 좌우한다는 점을 뒷받침했다. 다만 이 메타분석에는 횡단면 조사와 자기보고 연구가 많이 포함되어 있어, 자율성이 만족을 끌어올렸는지 아니면 원래 일에 만족하는 사람이 자율성을 더 크게 느꼈는지 인과 방향까지는 가르기 어렵다.

연구가 보여 주는 관련성을 실제 팀에 대입해 보면, 자율성은 단순히 간섭을 줄이는 상태가 아니다. 분명한 목표와 그것을 실행할 권한이 함께 주어져야 자율성이라 부를 수 있고, 목표도 권한도 없이 결과만 떠맡기는 것은 자율성이 아니라 방치다. 그렇기에 면접에서는 "팀이 자율적인가요?"처럼 추상적인 형용사를 묻기보다 최근에 내려진 결정 하나를 꺼내 경계를 확인해야 한다.

- 신입이 혼자 판단해 바꿀 수 있는 변경과 반드시 검토를 거쳐야 하는 변경은 어디까지인가.
- 일의 우선순위가 서로 부딪힐 때 누가 교통정리를 맡고, 그 결정은 어디에 남는가.
- 필요한 장비나 데이터, 다른 팀의 협조를 얻으려면 어떤 절차를 밟아야 하는가.
- 일을 맡긴 뒤 중간 점검은 언제 하며, 막혔을 때는 누구에게 도움을 요청하는가.

이 질문들에 구체적인 경계선과 지원 경로가 따라 나온다면 자율성이 구조로 작동하고 있을 가능성이 크다. 반대로 "각자 알아서 하면 된다"는 말만 되풀이된다면, 권한과 정보, 지원까지 실제로 따라오는지 한 번 더 파고들어 확인해야 한다.

## 심리적 안전을 발언 가능성으로 보기

자율성이 일을 움직일 권한에 관한 문제라면, 심리적 안전은 문제가 생겼을 때 입을 열 수 있는가에 관한 문제다. Frazier와 동료들이 117개 연구에서 추린 136개 독립 표본, 2만 2천 명이 넘는 자료를 종합한 메타분석에서 심리적 안전은 정보 공유, 학습 행동, 발언, 수행과 함께 움직였고 리더와의 관계나 조직의 지원 같은 선행 조건과도 연결되어 있었다. 여기서 말하는 심리적 안전은 갈등이 없거나 늘 친절하게 웃는 분위기를 가리키지 않는다. 대인관계에서 불이익을 감수하고라도 질문, 우려, 자신의 실수를 꺼내 놓을 수 있다는 믿음에 가깝다. 이 메타분석 역시 산업과 측정 도구가 다양하고 자기보고식 상관 설계가 많아, 심리적 안전이 직접 성과를 높였다고 단정하기보다는 두 변수가 함께 나타나는 경향이 있다고 읽는 편이 정확하다.

지원자가 짧은 면접 시간만으로 팀의 심리적 안전을 온전히 측정하기는 어렵다. 대신 팀이 말하기 껄끄러운 일을 최근에 어떻게 처리했는지 구체적인 사례를 끌어내면 실마리가 잡힌다. 가령 최근 신입이나 주니어가 계획에 반대한 경우가 있었는지, 문제를 늦게 발견했을 때 누구에게 어떤 순서로 알리는지, 최근 회고에서 말로 그치지 않고 실제로 바뀐 절차가 무엇인지 차례로 물어볼 수 있다. 완벽한 성공담만 매끈하게 들려주는 팀보다 반대 의견이 부딪힌 자리와 실수 이후의 후속 절차를 또렷이 설명하는 팀이 훨씬 많은 단서를 준다. 이때 만나는 팀원들의 대답이 서로 어긋나지는 않는지, 공개된 회고나 작업 규칙이 있다면 그 말과 맞물리는지도 함께 견주어 본다.

## 피드백에서 양보다 방향 보기

피드백은 많을수록 좋을 것 같지만 실제 효과는 그만큼 단순하지 않다. Kluger와 DeNisi가 131편의 논문, 607개 효과크기, 23,663개 관측치를 종합한 피드백 개입 메타분석에서는 평균적으로 수행 향상이 나타났지만, 동시에 전체 개입 가운데 3분의 1이 넘는 경우에는 오히려 수행이 떨어졌다. 저자들은 피드백이 듣는 사람의 관심을 눈앞의 과업에서 자기 자신에 대한 평가로 돌려놓을수록 효과가 약해지거나 역효과가 난다고 해석했다.

그러므로 피드백이 자주 오가는지만큼이나 그 피드백이 무엇을 겨냥하고 다음 작업에 어떻게 남는지를 따져 물어야 한다. 피드백의 빈도를 확인했다면 아래 네 가지 질문으로 방향을 짚어 본다.

1. 최근 코드, 설계, 보고서 가운데 무엇을 어떤 기준으로 고쳤는가.
2. 공식 평가 면담이 오기 전에도 작업물을 수정할 기회가 있는가.
3. 납득하기 어려운 피드백에 이의를 제기하거나 다시 검토를 요청할 통로가 있는가.
4. 칭찬이나 질책을 넘어 다음 작업에서 달라져야 할 행동이 남는가.

상사와 매주 1:1 면담을 한다는 제도 설명보다 실제 산출물과 수정 사례를 연결해 들려주는 답이 훨씬 믿을 만하다. 상사의 역할 역시 이 지점에서 함께 드러난다. 좋은 상사를 가릴 때는 기술적인 질문에 곧바로 답을 주는지만 보지 말고, 일의 우선순위를 세우고 필요한 자원을 연결하며 팀 안팎의 충돌을 감당해 처리하는 책임을 지는지까지 확인한다.

## 팀 면접용 증거 카드

면접이 끝난 직후에는 첫인상과 감정이 금세 기억을 덮어 버린다. 기억이 섞이기 전에 아래 네 항목을 짧은 증거 카드로 옮겨 적는다.

**결정권:** 내가 맡을 수 있는 결정과 검토 경계가 구체적이었는가.  
**말하기:** 반대·질문·실수를 다룬 최근 행동이 나왔는가.  
**피드백:** 기준, 시점, 수정 기회가 연결되어 있었는가.  
**상사:** 우선순위, 자원, 갈등을 누가 어떻게 처리하는지 설명이 나왔는가.

카드의 각 줄에는 '분위기가 유해 보였다' 같은 인상 대신 실제로 들은 말이나 관찰한 절차를 적고, 근거를 얻지 못한 칸은 억지로 채우지 말고 미확인으로 남겨 둔다. 면접 자리에서 만나는 사람은 팀 전체의 축소판이 아닐뿐더러, 채용 과정에서는 어느 팀이든 좋은 모습을 먼저 꺼내 보여 주기 마련이다. 가능하면 직속 상사, 함께 일할 동료, 최근 입사자에게 같은 질문을 조금씩 바꾸어 던져 보고, 한 사람만 만날 수 있는 일정이라면 추가 면담이나 서면 답변을 요청해 빈칸을 줄인다. 그래도 답을 얻지 못한 항목은 입사 직후 확인할 목록으로 넘겨 두고, 면접관 사이에 말이 다를 때는 팀 안에서도 역할과 경력에 따라 경험이 갈리는지부터 확인한다.

경고 신호 역시 막연한 느낌보다 반복되는 구조에서 찾는다. 우선순위가 수시로 바뀌는데 정작 변경 권한을 쥔 사람이 불분명하거나, 검토 기준이 사람마다 달라 결과를 예측하기 어렵거나, 문제 보고가 평가상 불이익으로 곧바로 이어진다면 입사한 뒤 개인의 노력만으로 바로잡기 어렵다. 반면 현재 부족한 점이 있더라도 담당자와 변경 절차, 최근 개선 사례를 짚어 설명할 수 있다면 판단할 자료가 생긴다. 결국 눈여겨볼 대목은 문제가 아예 없는지가 아니라 문제를 발견하고 고치는 통로가 살아 있는지다.

이 증거 카드는 앞선 메타분석들의 구분을 채용 조사에 맞게 옮겨 놓은 정리 도구일 뿐, 좋은 팀을 가려내도록 타당도를 검증한 검사는 아니다. 다만 입사 뒤 일을 배우고 문제를 고치는 데 필요한 최소한의 구조가 갖춰져 있는지 확인하는 데는 실용적인 기준이 된다. 직무 자체가 흥미롭더라도 결정권 없이 책임만 떠안거나, 문제를 꺼낼 통로가 막혀 있거나, 피드백이 평가일에만 몰려 있다면 그 조건은 직업을 비교할 때 따로 떼어 적어 두어야 한다. 나아가 특정 팀의 작동 방식을 넘어 엔지니어로서 어떤 종류의 일과 책임을 반복하며 경력을 쌓을 것인지 따지려면, 이제 엔지니어링 조직 안의 여러 경로 자체를 나란히 놓고 비교할 필요가 있다.

# 14장 엔지니어의 여러 경로

팀의 작동 방식과 일하는 조건을 가늠했다면, 그보다 한 단계 큰 질문도 함께 정리해야 한다. '엔지니어가 되고 싶다'는 방향을 잡은 뒤에는 결국 어느 하루를 반복하며 살아갈지 정해야 하기 때문이다. 엔지니어링 조직 안에는 제품 기능을 만들어 내놓는 사람도 있고, 서비스와 설비가 멈추지 않게 지키는 사람, 공정과 현장의 흐름을 개선하는 사람, 아직 답이 없는 기술을 검증하는 사람, 여러 사람의 일을 묶어 결과를 내는 사람도 있다. 경력 중간에 한 경로에서 다른 경로로 옮기는 일도 흔하지만, 처음부터 각 경로가 어떤 결과를 반복해서 책임지는지 알고 고르면 불필요한 시행착오를 줄일 수 있다.

경로 이름은 회사마다 다르지만, 반복되는 일과 남는 결과물로 나누어 보면 조사할 범위가 선명해진다. 아래 표는 서로 다른 엔지니어링 경로를 나란히 놓고 무엇을 확인해야 할지 가늠하는 기준표다.

| 경로 | 반복되는 일 | 잘했을 때 남는 것 | 미리 확인할 숨은 조건 | 진입 전에 만들 수 있는 신호 |
|---|---|---|---|---|
| 제품·기능 | 요구를 해석하고 설계·구현·시험 | 사용 가능한 기능, 제품 성능, 변경 기록 | 고객이나 사용자의 반응을 확인하기까지 거치는 단계, 출시 주기, 기존 코드·부품 | 작동하는 작은 제품과 선택 기록 |
| 인프라·운영 | 상태를 관찰하고 장애를 복구·예방 | 가용성, 자동화, 복구 절차, 용량 계획 | 온콜, 권한, 장애 뒤 개선 시간 | 배포·관측·복구가 포함된 서비스 운영 |
| 현장·공정 | 장비와 흐름을 측정하고 설치·개선 | 수율, 품질, 안전, 처리시간, 작업 표준 | 교대·출장, 생산 중단 비용, 작업자 협의 | 실제 공정 자료 분석이나 장비 시험 기록 |
| R&D | 가설을 세우고 실험·분석해 불확실성을 줄임 | 재현 가능한 결과, 프로토타입, 특허·논문·기술 이전 | 성공 기준, 결과가 나오기까지 걸리는 시간, 제품과의 연결, 학위 요구 | 기존 결과 재현과 실패 조건이 적힌 실험 |
| 기술 관리 | 우선순위와 자원을 정하고 사람 사이를 조정 | 팀 결과, 인력 성장, 위험 관리, 의사결정 | 직접 만드는 시간 감소, 평가·채용·갈등 책임 | 작은 팀의 일정·검토·회고 운영 경험 |

표에 그은 경계선은 실제 현장에서 꽤 자주 겹친다. 제품 엔지니어가 운영을 함께 맡기도 하고, 현장 엔지니어가 연구 실험을 하며, 관리자 역시 중요한 기술 판단에 직접 관여한다. 회사에 따라서는 'R&D'라고 부르는 조직이 단기 고객 개발을 맡기도 하고, '개발' 팀이 장기 기술 탐색을 수행하기도 한다. 이름표만 보고 지원하기보다 매주 반복하는 일과 남는 산출물, 실패했을 때 누가 책임을 지는지부터 확인해야 하는 이유다.

## 제품과 인프라: 바뀌는 속도와 책임지는 기간

제품·기능 경로는 사용자가 겪을 변화의 가장 앞단에 서 있다. 요구를 해석하고 설계·구현·시험을 거쳐 내보낸 뒤, 사용자 반응과 사업 우선순위에 따라 다시 손본다. 새 기능이 눈에 띄게 쌓이는 보람이 큰 대신, 요구사항이 자주 바뀌거나 일정 압박과 기존 시스템 호환 문제로 작업이 흔들리기 쉽다. '무언가를 새로 만드는 일'만 기대했다면 코드 리뷰, 문서화, 결함 수정, 출시 조정이 실제 하루에서 얼마나 비중을 차지하는지 확인해야 한다.

반면 인프라·운영 경로는 다른 사람들이 일을 계속할 수 있는 바닥을 책임진다. 네트워크와 컴퓨팅 자원, 생산 설비, 배포 체계, 관측 도구가 모두 이 범주에 들어간다. 평시에는 잘 돌아가는 상태가 당연하게 여겨지다가도 이상 상태가 벌어지면 가장 먼저 호출되어 빠르게 대응해야 한다. 같은 운영 직무라도 장애 대응 권한 없이 호출만 받는지, 아니면 복구 뒤에 근본 원인을 없애는 개선 작업에 시간을 쓸 수 있는지에 따라 일의 질이 크게 갈린다.

두 경로의 윤곽을 잡을 때는 O*NET의 소프트웨어 개발자와 네트워크·시스템 관리자 과업 목록이 좋은 출발점이 된다. 다만 직업 코드마다 대표 과업을 추려 놓은 자료라 개별 조직에서 개발과 운영의 선을 어디에서 가르는지까지는 담아내지 못한다. 실제 팀의 경계는 지원하는 조직의 업무 분장으로 따로 확인해야 한다.

## 현장·공정: 기술과 물리적 흐름

현장·공정 경로에서는 모델과 도면이 실제 장비, 작업 순서, 공급망, 안전 규칙과 정면으로 부딪힌다. O*NET에 정리된 산업공학 엔지니어의 대표 과업에도 생산 흐름 분석, 품질관리, 비용 추정, 공정 개선, 관계자 협의가 나란히 들어가며, 메카트로닉스 기술자 역시 전기·기계 장치를 설치·시험하고 고장을 진단하는 일을 맡는다. 개선 결과가 생산량이나 불량률 같은 수치로 빠르게 드러나는 장점이 있는 반면, 설비를 멈출 수 있는 시간과 현장 접근성이 제한되어 있어 마음껏 실험해 볼 수 있는 범위는 좁다.

따라서 이 길을 볼 때는 '하드웨어나 장비를 좋아한다'는 관심에서 한 걸음 더 들어가야 한다. 현장 출입과 교대 근무, 소음·안전 장비 착용, 지역 배치, 생산 일정에 맞춘 작업 리듬, 그리고 오래 현장을 지켜 온 숙련 작업자와 의사소통하는 일이 내 생활에 맞는지 따져 보는 편이 현실적이다. 기술적으로 명쾌한 정답을 찾았더라도 가동 중인 공정을 세우기 어렵다면, 현장에 적용할 순서부터 다시 설계해야 하는 일이 잦다.

## R&D와 기술 관리: 결과의 단위

R&D는 아직 답이 정해지지 않은 문제 앞에서 가설과 실험으로 불확실성을 줄여 나가는 경로다. 논문과 특허가 핵심 산출물인 조직도 있고, 제품팀이 채택해 쓸 프로토타입이나 측정법이 최종 결과인 조직도 있다. 그러니 연구라는 간판만 보기보다 성공 기준이 무엇인지, 결과가 나오기까지 얼마나 시간을 주는지, 만든 기술을 제품·현장으로 어떻게 넘기는지, 실패한 실험을 어떻게 평가하는지를 먼저 확인한다. O*NET의 컴퓨터·정보 연구과학자 자료는 문제 분석과 해법 탐색, 이론의 신기술 적용, 수리 모형 구축을 대표 과업으로 보여 주지만, 기업 R&D의 실제 범위는 이보다 훨씬 넓고 석·박사 학위 요구 여부 역시 분야와 조직마다 다르다.

기술 관리자는 자신이 직접 만든 산출물 하나보다 팀 전체가 내는 결과에 책임을 진다. O*NET의 건축·엔지니어링 관리자 항목에서도 계획 수립, 예산과 인력 배분, 기술 활동 조정이 함께 나타난다. 회의 비중이 커지는 데 더해 채용, 성과 피드백, 팀 내 갈등 조율, 우선순위와 위험을 결정하는 무거운 책임을 진다. 사람의 일을 조직하고 운영하는 능력은 기술 실력과 결이 다른 별도의 학습이 필요하며, 관리자 전환을 곧바로 승진으로 보지 않는 조직도 적지 않다.

## 경로마다 한 사이클 비교하기

경로마다 일의 시작과 끝을 한 사이클로 나란히 놓아 보면 서로 다른 리듬이 한눈에 들어온다. 제품은 요구 정의에서 사용자 반응 확인까지, 인프라는 배포에서 상태 관찰·복구까지, 현장은 측정에서 개선 전후 비교까지가 한 호흡을 이룬다. R&D는 가설에서 재현 가능한 결과까지, 기술 관리는 계획에서 검토와 회고까지를 한 사이클로 볼 수 있다.

물론 가동 중인 설비나 야간 온콜, 인사평가처럼 학생이나 구직자가 직접 경험하기 어렵고 함부로 흉내 내서도 안 되는 사이클이 있다. 이때는 직접 경험을 대신할 공개 자료나 축소된 과제를 찾는다. 공개된 장애 회고 문서에서 관찰·복구·예방이 어떻게 맞물리는지 추적해 보고, 공정 자료나 캡스톤 프로젝트에서는 개선 전후 수치와 다음 작업자에게 넘길 인계 기록을 남긴다. 동아리나 팀 프로젝트에서 일정 계획과 검토, 회고 운영을 도맡아 보는 것도 좋은 훈련이며, R&D에 관심이 있다면 기존 결과를 직접 재현하면서 어떤 조건에서 실패하는지 기록을 남길 수 있다.

공공 직무 분류는 이처럼 각 경로를 설명할 어휘와 대표 과업의 지도를 제시한다. 하지만 한 회사 안에서의 이동 가능성이나 보상 체계, 팀 문화, 한국의 자격·학위 관행은 공고와 현직자 대화를 통해 따로 채워야 하며, 직업 코드별 응답 수치 역시 해당 직업 내부의 맥락 안에서 읽어야지 서로 다른 직업의 수치와 바로 견주기는 어렵다.

유망해 보이는 두 경로를 골랐다면, 각 사이클에서 끌리는 시작점과 함께 끝까지 반복해도 괜찮은 일, 일이 어긋났을 때 떠맡을 실패 책임, 그리고 아직 접근하지 못해 여전히 모르는 단계까지 적어 둔다. 일단 한 경로를 골라 몸을 담기로 했다면, 그다음 과제는 그 안에서 어떤 역량을 넓히고 무엇을 깊게 파서 내 선택지를 실제로 늘려 가는가다.

# 15장 넓게 볼 때와 깊게 팔 때

한 경로를 골라 발을 디뎠다면, 이제는 그 안에서 어떻게 실력을 쌓아야 앞으로의 선택지가 좁아지지 않고 오히려 넓어지는지 고민할 차례다. 같은 튜토리얼을 여러 언어로 따라 치다 보면 이력서에 적을 도구 이름만 늘어날 뿐 정작 낯선 문제를 풀 힘은 제자리걸음일 때가 많다. 반대로 한 도구를 오래 붙잡고 있었더라도 늘 풀던 유형의 문제만 반복했다면, 사용 시간은 쌓였어도 까다로운 조건에서 믿고 맡길 만한 능력인지는 아직 모른다. 폭과 깊이는 이력서의 항목 개수나 경과 시간보다 실제로 풀 수 있는 문제의 범위와 결과물의 신뢰도로 가려진다.

지금 배우는 것들이 서로 연결되어 돌아가는지, 그리고 그중 적어도 하나는 다른 사람이 안심하고 일을 맡길 만큼 깊어지고 있는지 물어야 한다. 이미 고른 경로 안에 한동안 머물기로 했다면, March가 구분한 활용(exploitation, 이미 아는 것을 다듬는 일)의 시기에도 무엇을 옆으로 넓히고 무엇을 아래로 깊게 만들지 정해야 다음 선택지가 열린다.

## 폭을 도구 목록보다 연결로 보기

능력의 폭은 관련 없는 분야를 백화점식으로 모을 때만 생기는 것이 아니라, 하나의 결과를 끝까지 매듭짓기 위해 인접한 일을 연결할 때도 넓어진다. 가령 센서 자료를 분석하려면 숫자를 돌리기 전에 측정 조건부터 이해해야 하고, 분석 코드를 검증한 뒤 다른 사람이 결과를 재현할 수 있게 기록까지 남겨야 일이 끝난다. 제품 기능을 만든다면 요구를 해석하고 구현하고 시험한 다음, 배포 뒤의 사용자 반응까지 읽어 내야 한 사이클이 닫힌다. 자기 손에 쥔 어느 한 단계만 할 줄 알 때보다 앞뒤 단계의 입력 조건과 실패 방식을 꿰고 있어야 함께 일할 수 있는 팀과 문제의 범위가 넓어진다.

막연히 '여러 가지를 다룬다'고 적기보다 폭을 아래 세 층위로 나누어 정리해 두면 빈틈이 훨씬 선명하게 드러난다.

- **중심 능력:** 지금 내놓는 결과의 품질을 직접 책임질 수 있는 일
- **인접 능력:** 중심 능력에 들어오는 입력을 이해하거나 결과를 다음 사람에게 매끄럽게 넘기는 일
- **공통 능력:** 다른 문제에서도 다시 꺼내 쓸 수 있는 측정, 디버깅, 설명, 조정 방식

각 항목에는 도구 이름만 나열하지 말고 그 능력이 실제 산출물 안에서 어떻게 이어졌는지를 적는다. 예를 들어 "Python, C++, ROS를 안다" 대신 "센서 로그에서 오류 구간을 찾아내고, 수정 전과 후에 각각 시험해 다른 사람이 다시 돌릴 수 있게 실행 환경을 남겼다"라고 쓰는 식이다. 새로운 도구를 배울 때도 그것이 내 중심 능력과 어떤 연결을 만드는지 설명할 수 있어야 단순한 도구 수집이 아니라 문제의 경계를 넓히는 공부인지 판단할 수 있다.

## 깊이를 반복의 구조로 만들기

오래 반복한다고 해서 저절로 실력이 깊어지지는 않는다. Macnamara와 동료들이 의도적 연습의 효과를 종합한 메타분석에서 연습은 수행 차이의 일부를 설명하기는 했지만 그 크기는 분야마다 달랐고, 수행 전체를 설명하지도 못했다. 2018년 정정 논문에서 전체 추정치와 분야별 수치가 바뀐 뒤에도 이 결론은 그대로 유지된다. 게다가 포함된 연구에는 과거 연습 시간을 회상해 적은 자료가 많았고 '의도적 연습'으로 센 활동 역시 연구마다 달랐기에, 이 결과는 연습이 수행 차이의 일부와 관련된다는 선에서 읽어야 한다.

결국 한 능력을 깊게 만들려면 같은 형식의 성공을 되풀이해 복사하기보다, 반복할 때마다 한계를 시험하고 확인할 조건을 걸어 두어야 한다.

1. **수행을 동사로 정한다.** 분야명 대신 무엇을 어느 조건에서 해낼지 구체적인 행동으로 쓴다.
2. **결과를 남긴다.** 코드, 설계, 분석, 시험 기록처럼 다른 사람이 직접 열어 보고 확인할 수 있는 산출물을 만든다.
3. **피드백을 앞당긴다.** 완성 뒤 총평만 받지 말고, 오류가 굳기 전에 테스트나 동료 검토, 사용자 반응을 중간에 연결한다.
4. **조건을 바꿔 반복한다.** 자료, 규모, 시간 제약, 인터페이스 가운데 하나를 바꾸어 보며 같은 원리가 작동하는지 살핀다.
5. **수정 전후를 비교한다.** 무엇이 나아졌고 어떤 오류가 남았는지 처음 정한 기준에 따라 기록한다.

공부의 영역에서도 비슷한 원리가 작동한다. Dunlosky와 동료들이 학생 학습 기법을 비교 검토한 연구에서는 스스로 문제를 풀어 보는 연습 시험과 한 번에 몰아치지 않고 간격을 두는 분산 연습이 여러 조건에서 두루 높은 효용을 보였다. 읽은 내용을 덮고 떠올려 설명하거나 일정 간격을 두고 문제를 다시 푸는 방식은 기초 지식을 다지는 공부에 곧바로 쓸 수 있다. 다만 이 근거가 입증한 범위는 학생의 학습 성과까지다. 현장의 설계 판단이나 돌발 대응, 팀 협업에도 같은 효과가 나타나는지는 이 자료로 알 수 없으므로, 직무 능력에서는 익힌 내용을 반드시 실제 산출물과 외부 피드백에 이어 붙여야 한다.

## 깊이를 드러내는 외부 기준

혼자 정한 완료 기준만 쓰다 보면 그저 손에 익은 느낌을 실력으로 오해하기 쉽다. 능력마다 결과가 기준을 통과했는지 아니면 수정이 필요한지 가려 줄 외부 기준을 하나 이상 두어야 하는 이유다. 소프트웨어라면 테스트와 실제 사용 조건이, 설계라면 요구사항과 안전 여유가, 분석이라면 독립적인 재현과 새로운 자료 검증이, 문서라면 다른 사람이 추가 설명 없이 곧장 실행할 수 있는지가 기준이 된다. 공개 점수나 자격증 말고도 구체적인 규격, 검토자가 던진 반례, 사용자의 실제 실패 기록이 모두 판단 자료가 된다.

아래 '능력 포트폴리오'는 내가 가진 능력의 폭과 깊이를 한 장에서 점검하고 빠진 구석을 찾아내는 정리 도구다. 표 자체가 훈련 효과를 검증받은 검사는 아니지만, 지금 어느 고리가 약한지 가늠하는 데는 충분한 틀이 된다.

| 능력 | 맡아 해낼 수 있는 일 | 반복한 산출물 | 외부 기준·피드백 | 다음 전이 시험 |
|---|---|---|---|---|
| 중심 | 결과 품질을 직접 책임질 일 | 같은 원리를 여러 조건에서 적용한 기록 | 테스트, 규격, 사용자, 검토자 | 자료·규모·제약 하나를 바꾼 과제 |
| 인접 | 입력을 이해하거나 결과를 넘길 일 | 앞뒤 단계와 연결한 기록 | 다음 단계 담당자의 수정·재작업 | 다른 도구나 팀과의 인터페이스 |
| 공통 | 여러 문제에서 다시 쓸 방식 | 측정·디버깅·설명·조정의 반복 | 새 문제에 적용했을 때 드러난 반례 | 낯선 분야의 작은 실제 과제 |

표를 채워 본 뒤에는 비어 있는 칸을 보고 다음에 무엇을 배울지 고른다. 중심 능력의 산출물이 한 번뿐이라면 비슷한 문제를 다시 풀어 보고, 반복은 많은데 외부 기준이 비어 있다면 검토자를 찾거나 테스트를 먼저 짠다. 한 환경에서만 성공했다면 다음에는 조건 하나를 일부러 바꾸어 본다. 한꺼번에 모든 빈칸을 채우려 하기보다 당장 현재 결과를 가로막고 있는 빈칸 하나부터 골라 손보는 편이 낫다.

## 전이를 새 조건에서 시험하기

배운 것이 다른 자리로 옮겨 가는지를 확인하려면 같은 원리를 낯선 자료, 다른 장비, 새로운 사용자, 더 빠듯한 시간 압력 아래에 놓아 보아야 한다. 만약 전이 시험이 실패했다면 '아직 실력이 모자란다'고 뭉뚱그리기 전에 중심 원리 자체를 이해하지 못했는지, 새 환경의 입력을 잘못 읽었는지, 결과를 넘기는 방식이 깨졌는지 단계별로 나눈다.

폭과 깊이에 정해진 보편적 비율은 없다. 수업, 생계, 눈앞의 프로젝트 일정에 따라 당분간 중심 능력에만 대부분의 시간을 써야 할 때도 많다. 중요한 것은 능력 포트폴리오 위에 지금 배우는 내용이 다룰 수 있는 문제와 협업의 경계를 실제로 넓히고 있는지, 낯선 조건에서도 외부 기준을 통과하는 결과를 반복해서 내는지 판단할 기록을 남기는 일이다. 그리고 이렇게 조건을 비틀어 시험하다가 예상대로 움직이지 않는 순간을 마주쳤을 때, 그 실패를 막연한 자책으로 흘려보내지 않고 원인을 좁혀 다음 시도를 고치는 기술이 뒤따라야 한다.
