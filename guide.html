# 16장 실패를 디버깅하기

낯선 조건에 부딪혀 시험을 거듭하다 보면 실패는 피할 수 없다. 문제는 실패 그 자체보다 시도가 어긋났을 때 우리가 내리는 설명의 크기다. 시험에 떨어졌으니 재능이 없고, 공들여 만든 것이 쓰이지 않았으니 아이디어가 나빴으며, 발표에서 말이 막혔으니 이 일과 거리가 먼 사람이라는 식이다. 사람 전체를 원인으로 써 버리면, 정작 다음 시도에서 무엇을 어떻게 고쳐야 할지가 흐려진다. 실패를 디버깅한다는 말은 관찰한 결과에서 구체적인 원인 후보를 만들고, 다음 시도에서 참·거짓을 판별할 수 있는 크기로 줄인다는 뜻이다.

이번 실패를 설명하는 여러 가설 가운데, 최소한 다음 한 번의 시도에서 하나라도 가려낼 수 있어야 배움이 앞으로 나아간다.

## 실패의 크기 먼저 제한하기

배움의 재료로 환영할 만한 실패는 어디까지나 되돌릴 수 있는 실패다. 안전과 건강, 생계, 개인정보, 법적·윤리적 의무를 깨는 일은 시행착오가 아니라 피해이므로 먼저 막아야 한다. 큰 피해를 차단할 한계를 정해 둔 다음, 그 안쪽에서 되돌릴 수 있고 비용이 제한된 범위로 시도를 설계해야 여러 가설을 주저 없이 시험해 볼 수 있다.

가령 다른 직무를 알아볼 때는 곧장 퇴사하기 전에 짧은 프로젝트나 직무 인터뷰로 실제 업무의 결을 먼저 확인해 볼 수 있다. 새로운 기술 역시 운영 중인 본 시스템이 아니라 복제된 자료나 작은 사용 사례에서 먼저 돌려 보고, 발표 방식을 바꾸려 할 때도 당락이 갈리는 중요한 평가 자리에 처음 들고나가기보다 비용이 낮은 연습 모임에서 청중의 반응부터 살피는 편이 안전하다.

본격적인 시도를 시작하기 전에는 아래 세 가지를 먼저 적어 둔다.

- **지킬 한계:** 사람과 시스템에 절대 허용하지 않을 피해
- **쓸 수 있는 비용:** 감당할 수 있는 시간, 돈, 평판, 피로의 한도
- **중단 신호:** 더 진행하면 배움보다 피해가 커진다고 볼 관찰값

이 기준을 사전에 남겨 두면, 과정이 조금 불편해졌다는 이유로 무조건 멈추거나 반대로 이미 쓴 비용이 아까워 시도를 계속 끌고 가는 일을 줄일 수 있다. 미리 정해 둔 중단 신호가 나타났다면 자료를 조금 더 얻을 수 있을 것처럼 보여도 시험을 끝낸다.

## 결과를 원인 가설로 바꾸기

실패의 크기를 제한했다면 이제 무엇이 기대와 달랐는지 차분히 관찰하고, 그 결과와 함께 참일 수 있는 원인 가설을 둘 이상 적는다. 원인은 단 한 번의 느낌으로 단정하기보다 여러 번의 결과를 겹쳐 보며 좁혀 가야 정확해진다. 어디서부터 짚어야 할지 막막할 때는 아래 표의 다섯 가지 영역에서 원인 후보를 찾기 시작한다.

| 후보 | 확인할 질문 | 관찰의 예 |
|---|---|---|
| 준비 | 필요한 자료·전제·연습이 빠졌는가 | 시작 전에 없었던 정보, 뒤늦게 발견한 요구 |
| 기술 | 수행 방법을 몰랐거나 반복 가능한 수준이 아니었나 | 특정 단계의 오류, 조건이 바뀔 때 무너진 수행 |
| 환경 | 시간·장비·자료·생활 조건이 결과를 바꿨나 | 지연, 장비 차이, 수면·통근 변화와 함께 생긴 변동 |
| 조정 | 인계·권한·의사소통이 끊겼나 | 기다린 승인, 서로 다르게 이해한 역할, 누락된 전달 |
| 평가 | 성공 기준이나 측정 방법을 잘못 알았나 | 평가자가 본 기준과 준비한 기준의 차이, 측정 누락 |

이 분류는 문제의 원인을 찾기 시작할 위치를 잡아 주는 출발점이다. 실제로는 "기술이 부족했다"와 "평가 기준을 잘못 읽었다"처럼 두 원인이 동시에 참인 경우도 흔하다. 그러니 각 가설 옆에 그 가설을 뒷받침하는 **지지 관찰**과 반대되는 **반증 관찰**을 하나씩 나란히 적는다. 전체 과정 가운데 매끄럽게 잘된 단계를 짚어 보면 기술 부족 가설의 범위를 좁힐 수 있고, 같은 조건에서 다른 사람이 성공한 기록이 있다면 환경 가설을 덜어낼 수 있다. 다음 시도의 출발점은 여러 후보 가운데 지지 관찰이 가장 또렷하게 잡힌 원인으로 고른다.

## 다음에 한 변수만 바꾸기

원인 가설을 하나 골랐다면, 이번에는 무엇을 바꾸어야 가장 적은 비용으로 그 가설을 가려낼 수 있을지 정한다. 지원 결과가 나빴다고 직무, 회사, 포트폴리오, 자기소개, 면접 준비를 한꺼번에 갈아엎으면 다음번에 결과가 달라져도 도대체 무엇이 작용했는지 알 길이 없다. 따라서 관련 관찰이 가장 많이 모여 있고, 그것을 고쳐 다음 시도를 했을 때 결과를 뒤집을 가능성이 큰 가설 하나를 골라 나머지 조건을 가능한 한 유지한 채 한 변수만 바꾼다.

머릿속에서만 조건을 조정하면 금세 앞뒤가 섞이므로, 아래 '실패 디버깅 카드'에 한 번 더 정리해 두는 편이 확실하다.

**관찰된 실패:** 무엇이 언제 기대와 달랐는가.  
**원인 가설:** 준비·기술·환경·조정·평가 중 어디를 의심하는가.  
**지지 관찰:** 이 가설이 맞다고 보는 자료는 무엇인가.  
**반증 관찰:** 맞지 않을 수 있음을 보여 주는 자료는 무엇인가.  
**한 변수 변경:** 다음 시도에서 무엇 하나만 다르게 할 것인가.  
**판별값:** 어떤 결과가 나오면 가설을 약하게 하거나 버릴 것인가.  
**중단 신호:** 더 시험하지 않을 피해와 비용의 경계는 무엇인가.

물론 직무와 생활의 시도는 실험실처럼 모든 조건을 엄밀히 통제하기 어렵다. 한 변수만 바꾸는 원칙은 여러 조건을 한꺼번에 흔들어 무엇이 결과를 바꿨는지조차 흐려지는 혼란을 막아 줄 뿐, 인과를 엄밀히 증명하지는 못한다. 다음 결과가 나오면 미리 정한 판별값과 대조해 가설을 뒷받침하는지 아니면 약하게 하는지 살피고, 그때 내가 손댄 조건 외에 주변 상황이 함께 달라지지는 않았는지도 반드시 확인한다.

## 오류관리훈련과 디브리핑 연구로 알 수 있는 범위

오류를 감추지 않고 분석 재료로 삼는 방식이 실제 학습에 도움이 된다는 점은 훈련 연구에서도 확인된다. Keith와 Frese는 오류관리훈련 연구 24개, 참가자 2,183명을 메타분석했다. 오류관리훈련은 과제를 직접 탐색하게 하면서 훈련 도중 오류를 내 보도록 권하고 그 오류를 다루는 과정에서 배우게 하는 방식이다. 분석 결과 이 방식은 오류를 피하는 절차 훈련이나 오류를 권하지 않는 일반 탐색 훈련보다 평균적으로 유리했으며(`d = 0.44`), 훈련 중 수행보다 훈련 뒤 새로운 과제로 옮겨 가는 전이에서 효과가 두드러졌다. 특히 훈련 과제와 비슷한 유추 전이(`d = 0.20`)보다 훈련 과제와 **구조가 다른 새로운 과제**에 기존 절차를 고쳐 써야 풀리는 적응적 전이(adaptive transfer)에서 이점(`d = 0.80`)이 훨씬 컸다.

다만 이 연구가 다룬 범위는 어디까지나 통제된 기술 훈련과 직무 훈련이었다. 실제 경력에서 겪는 해고, 건강 악화, 큰 금전 손실 같은 중대한 사건은 실험 대상이 아니었다. 그러므로 이 수치를 실패를 많이 겪을수록 좋다는 근거로 삼아서는 안 된다. 여기서 끌어올 원칙은 피해가 제한된 훈련 환경 안에서 의도적으로 오류를 드러내 보고, 그것을 처리하는 전략을 연습하는 방식이다.

사후 검토 역시 비슷한 맥락을 보여 준다. Tannenbaum과 Cerasoli는 디브리핑을 다룬 31개 연구의 46개 독립 표본, 개인·팀·집단을 합친 2,136개 분석 단위를 메타분석해 평균 효과 `d = 0.67`을 보고했다. 포함 자료에 무작위 배정이 없는 준실험이 많고 연구 맥락과 디브리핑 방식도 다양했기에 엄격한 인과 해석은 조심해야 하지만, 이 메타분석이 어떤 활동을 디브리핑으로 포함했는지는 분명한 기준을 준다. 연구진은 참여자가 능동적으로 관여하고, 평가나 처벌보다 개선을 목적으로 삼으며, 구체적인 사건과 여러 사람에게서 나온 정보나 객관적 자료를 검토한 경우만을 디브리핑으로 묶었다. 코치에게 개선 방법만 일방적으로 듣는 자리나 인사 평가, 강점과 약점을 두루 짚는 논의, 혼자 쓰는 일기는 제외되었고, 결과 변수 역시 수행 성과로 한정되어 진로 선택을 결과로 본 연구는 포함되지 않았다. 이 구조를 개인의 작은 시도에 옮겨 놓은 실패 디버깅 카드의 효과를 검증한 연구도 아직 없다.

## 반복 실패에서 문제 정의 다시 열기

한 변수만 바꾸어 다시 부딪혔는데도 번번이 같은 지점에서 깨진다면, 노력의 양을 늘리기 전에 판 자체를 점검해야 한다. 내 시도를 읽어 줄 관찰 장치가 부족한지, 성공 기준이 모호한지, 애초에 풀 문제를 잘못 잡았는지 확인하는 것이다. 때로는 실제 사용 환경이나 솔직한 피드백을 줄 사람이 없어 어느 가설이 맞는지조차 구분할 수 없을 때도 있다. 판별이 되지 않는 시험은 더 끌고 가 보아야 비용만 커지므로, 그때는 시험을 끝내고 문제 정의로 돌아간다.

한 번의 거절이나 낮은 점수는 내 능력을 판정하는 최종 결론이 아니라 표본 하나에 지나지 않는다. 표본 하나로 알 수 있는 범위와 그 자리의 평가 기준을 따로 분리해 읽어야 다음 걸음이 보인다. 같은 실패가 반복되는데도 지지 관찰과 반증 관찰이 비어 있다면, 시도 횟수를 채우기 전에 측정 방법부터 먼저 고치는 편이 낫다.

회고의 마지막 줄에는 늘 네 가지를 남긴다. 아직 살아 있는 원인 가설, 다음 시도에서 바꿀 한 변수, 판별값, 그리고 중단 신호다. 다음 결과가 돌아오면 이 기록을 다시 펼쳐 읽고 가설을 약하게 하거나 버린다. 이렇게 어설픈 가설이라도 실제 부딪힘 속에서 깎아 나가는 습관이 자리 잡으면, 아직 덜 된 생각마저 남 앞에 꺼내어 질문받고 시험할 만한 제안으로 키워 내는 다음 단계가 자연스럽게 이어진다.

# 17장 아이디어 내기와 설득하기

실패에서 단서를 건져 올려 고치는 데 익숙해지더라도, 막상 머릿속에 떠오른 새 생각을 남 앞에 꺼내 놓을 때는 또 다른 망설임이 따라붙는다. 처음부터 완성된 생각만 말하려고 하면 시도해 볼 수 있는 생각의 수 자체가 쪼그라든다. 막 떠오른 연결은 대개 근거가 부족하고 표현도 엉성하지만, 입 밖에 내거나 종이에 적어 보아야 비로소 빈칸이 보이고 다른 사람이 질문을 던져 주어야 쓸모가 있는지 가려진다. 여기서 필요한 능력을 굳이 점잖게 바꾸어 부르지 않겠다. 헛소리를 잘해야 한다.

> 아직 덜 된 생각을 속이지 않고 꺼내어, 시험할 만한 제안으로 바꿀 수 있는가?

물론 '잘한다'에는 분명한 조건이 붙는다. 아직 검증하지 않은 생각은 사실처럼 포장하지 말고 가설이라고 표시해야 하며, 틀린 것으로 드러난 생각은 체면과 상관없이 버릴 줄 알아야 한다. 아이디어를 아끼지 않고 많이 쏟아내는 일과 그중에서 골라 검증하는 일을 따로 떼어 둔 다음, 상대가 판단하고 작은 자원을 내줄 수 있게 문제와 시험 계획을 설명하는 **셀링**까지 이어져야 비로소 생각이 현실로 움직인다.

## 생성할 때와 고를 때 떼어 놓기

여럿이 둘러앉아 즉석에서 아이디어를 내고 곧바로 평가까지 해 버리면 생각의 양도 질도 떨어지기 쉽다. Mullen, Johnson, Salas가 브레인스토밍 연구를 메타분석한 결과, 서로 마주 앉아 대화하는 상호작용 집단은 같은 수의 개인이 따로 아이디어를 낸 뒤 합친 명목집단보다 아이디어의 양과 질 모두에서 대체로 유의하게 뒤졌다. 연구진은 발언 순서를 기다리느라 흐름이 끊기는 '생산 차단', 평가받는다는 걱정, 남에게 기대어 힘을 빼는 동기 저하를 설명 후보로 따져 보았는데, 실제 결과는 평가받는다는 걱정 같은 사회심리적 요인과 가장 잘 맞았고 동기 저하와는 가장 맞지 않았다. 포함된 연구들이 실험실 환경에서 집단을 비교한 자료여서 실제 제품팀의 장기 협업에 그대로 옮길 때는 조심해야 하지만, 적어도 아이디어를 내는 시간에 각자 먼저 적고 나중에 모여 공유하면 불필요한 눈치와 방해를 줄일 수 있다는 점은 분명하다.

게다가 생각을 많이 내는 일과 그중에서 좋은 안을 고르는 일은 서로 따로 움직이기 쉽다. Rietzschel, Nijstad, Stroebe의 실험에서는 집단이 스스로 낸 아이디어 가운데 정작 창의적인 안을 골라내는 데 어려움을 겪었다. 학생 집단이 수행한 실험 과제의 결과이므로 현업의 투자 결정에는 참고 수준으로 옮겨야 하지만, 생성하는 자리와 선택하는 자리를 한데 섞지 말아야 할 이유로는 충분하다.

실제 작업에서는 이 둘을 떼어 놓기 위해 순서를 다섯 단계로 나눈다.

1. 혼자 짧게 여러 안을 낸다. 문장을 매끄럽게 다듬는 일은 나중으로 미룬다.
2. 관찰한 사실, 내 추측, 아직 모르는 것을 표시해 출처가 있는 근거와 내 가설을 나눠 적는다.
3. 다른 사람에게 처음 보여 줄 때는 질문만 받는다. 방어와 채택은 첫 반응 뒤로 미룬다.
4. 선택 기준을 분명히 정한 뒤 후보를 줄인다. 재미, 기대 효과, 비용, 되돌림 가능성을 따로 본다.
5. 가장 싼 시험을 정한다. 결과가 나쁘면 접을 중단 조건도 함께 쓴다.

마음 놓고 헛소리를 해도 되는 곳은 딱 1단계까지다. 2단계부터는 근거를 표시하고 가설을 구분하는 책임이 따라온다.

생각이 모이기 시작하면 '아이디어 장부'를 만들어 문장의 완성도보다 현재 상태를 적어 둔다. 아직 질문조차 붙지 않은 생각은 **원석**, 관련 관찰과 근거를 찾는 단계는 **조사 중**, 비용과 중단 조건을 정해 작게 굴려 보는 단계는 **시험 중**으로 구분한다. 잠시 멈춘 안과 버린 안 역시 왜 접었는지 이유를 한 줄 남겨 두면, 나중에 같은 아이디어를 새것처럼 되풀이하거나 이미 확인한 실패 조건을 잊는 일을 줄일 수 있다. 다른 사람의 시간도 장부에서 조사할 만한 몇 개를 추린 뒤에 요청하는 편이 좋다.

## 다음 행동을 얻는 설명, 셀링

아무리 괜찮은 아이디어를 골라냈더라도 조직 안에서 실제로 굴려 보려면 누군가가 내줄 시간이나 예산, 장비, 검토 인력, 배포 창구 같은 자원과 지원이 필요하다. 이때 필요한 설명이 셀링이다. Dutton과 동료들은 한 병원의 중간관리자 42명이 들려준 이슈 셀링 경험담 82건을 질적으로 분석해, 사람들이 의사결정자의 관심을 특정 이슈로 끌어올 때 어떤 방식을 쓰고 어떤 맥락을 살폈는지 추적했다. 제안자들은 내용의 논리뿐 아니라 누구에게, 언제, 어떤 형식으로 말할지와 조직의 수용 가능성까지 치밀하게 판단했다. 표본이 한 병원에 한정된 질적 연구이므로 성공을 보장하는 법칙이라기보다 제안자들이 현장에서 구사한 전술의 종류와 맥락 감각을 보여 주는 자료로 읽으면 적당하다.

상대의 다음 행동을 끌어내는 셀링에 필요한 최소 단위는 아래 여섯 칸을 채운 한 장의 메모다.

**문제:** 누가 어떤 상황에서 무엇 때문에 막히는가.  
**관찰:** 실제로 본 자료와 아직 없는 자료는 무엇인가.  
**가설:** 바꾸면 어떤 결과가 생길 것으로 예상하는가.  
**작은 시험:** 며칠이나 몇 주 안에 무엇을 만들어 확인할 수 있는가.  
**요청:** 상대에게 요청할 시간, 자료, 권한은 정확히 얼마인가.  
**중단 조건:** 어떤 결과가 나오면 더 밀지 않을 것인가.

"좋은 아이디어가 있습니다"라고 추상적으로 꺼내는 대신 이 칸들을 채워 보여 주면, 상대는 제안 전체를 당장 다 믿지 않더라도 그 정도 비용의 작은 시험이라면 허용할 수 있다. 셀링의 핵심은 상대가 다음 판단을 내리는 데 드는 비용을 낮추는 데 있다. 그러니 마지막 요청도 "관심 있으면 알려 주세요"보다 로그 접근 30분, 사용자 세 명 인터뷰 연결, 일주일짜리 시범 승인처럼 상대가 예·아니오로 곧장 답할 수 있게 좁혀 놓는다.

## 목소리를 내는 조건

아이디어를 꺼내고 개선을 설득하는 일에는 조직 안에서의 현실적인 부담도 따른다. 특히 이미 진행 중인 일에 문제를 제기할 때는 발언의 성격에 따라 반응이 크게 달라진다. Chamberlin, Newton, LePine이 직원 발언 연구를 메타분석해 개선을 제안하는 촉진발언과 위험·문제를 지적하는 차단발언을 나누어 살펴보니, 선행 요인의 3분의 1 이상에서 두 발언이 맺는 관련 정도가 유의하게 달랐다. 촉진발언을 많이 하는 사람일수록 직무 수행이 높게 나타난 반면, 차단발언은 그 반대 경향을 보였다. 다만 연구 다수가 상관 설계이고 상사 평가에 기대고 있어, 발언이 높은 성과를 만들었는지 아니면 성과가 좋은 사람이 더 안전하게 말할 수 있었는지까지 단정하기는 어렵다.

그렇기 때문에 목소리를 내는 방식 역시 상황에 맞추어 조율해야 한다. 안전이나 윤리 문제는 사내 분위기만 살필 것이 아니라 조직의 공식 보고 절차와 법적 보호 장치부터 먼저 확인해야 한다. 반면 업무 개선 아이디어는 상대가 결정할 수 있는 범위와 시간 여유를 고려해 셀링하고, 반대 의견을 낼 때는 내가 관찰한 사실과 예상 피해, 확인 방법을 분리해 말해야 불필요한 방어를 줄인다. 권력 차이가 큰 환경일수록 기록을 남기고 동료나 공식 채널의 지원을 구해야 안전하다. 그리고 이렇게 설익은 생각을 꺼내 질문받고, 작은 시험을 설득하고, 어려운 자리에서 도움을 청하려면 결국 내 주변에 어떤 사람들이 연결되어 있고 어떤 신뢰를 쌓아 왔는지가 중요한 바탕이 된다.

# 18장 관계로 선택지 넓히기

실력을 다지고 실패를 디버깅하며 생각을 설득력 있게 다듬더라도, 정작 진로와 일의 핵심 정보가 채용 공고와 검색 결과 안에 모두 담겨 있지는 않다. 특정 팀이 실제로 무슨 일을 떠안고 있는지, 곧 새로 생길 역할이 무엇인지, 현장에서 어떤 능력을 신뢰하는지는 그 일을 직접 하는 사람들이 한발 앞서 알고 있을 때가 많다. 그렇다고 아는 사람의 머릿수만 늘리는 데 매달리면 대화는 금세 거래처럼 변질된다. 서로 다른 세계의 정보를 주고받고 작은 일이라도 함께 해 본 신뢰가 쌓여야 비로소 내 앞의 선택지가 넓어진다.

지금 내 주변 사람들은 지칠 때 기댈 수 있는 위로와 실제 협력을 주고 있는가, 그리고 내가 아직 가 보지 못한 선택지까지 비추어 주고 있는가. 이 역할을 한 사람에게 모두 기대할 필요는 없다. 여러 사람이 각자의 자리에서 나누어 맡아도 충분하다.

## 가까운 사람과 약한 연결이 주는 것

관계의 구조에 따라 들어오는 정보의 결이 달라진다는 사실은 오래전부터 연구되어 왔다. Granovetter는 고전적인 이론 논문에서 '약한 연결'이 서로 동떨어진 사회 집단 사이를 잇는 다리가 될 수 있다고 설명했다. 늘 만나는 가까운 사람들은 서로를 잘 알고 정서적인 도움을 주기 쉽지만, 같은 집단 안에 머물러 정보가 겹치기 쉽다. 반면 자주 연락하지 않는 지인, 예전 동료, 다른 학과에서 한 번 호흡을 맞추었던 사람은 내가 속한 집단 바깥의 소식을 가져올 가능성이 크다. 다만 이 논문은 개념과 기존 자료를 엮은 이론적 논의여서, 연결 강도별 평균 효과를 실험으로 비교해 검증하지는 않았다.

그로부터 수십 년 뒤, Rajkumar와 동료들은 LinkedIn의 '알 수도 있는 사람' 추천 알고리즘을 무작위로 달리 적용한 대규모 실험 자료를 통해 이 문제를 실제로 검증했다. 약 5년에 걸친 자료에는 2천만 명이 넘는 이용자와 20억 개의 새로운 연결, 플랫폼에서 확인된 약 60만 건의 새 일자리가 포함되었다. 분석 결과, 비교적 약한 연결이 직업 이동을 늘리는 데 기여하기는 했지만 그 효과는 직선이 아니었으며 상호작용이 거의 없는 가장 약한 연결이 언제나 가장 효과적인 것도 아니었다. 효과의 방향은 산업별로도 갈려 디지털화가 더 진행된 산업에서는 약한 연결이, 덜 진행된 산업에서는 오히려 강한 연결이 직업 이동을 더 늘렸다. LinkedIn 연구진이 참여해 자사 플랫폼 내 추천과 확인된 이동만을 분석한 이 대규모 무작위 실험이 보여 주는 것은 추천 변화에 따라 관계가 얼마나 달리 생겼는지, 그리고 그 연결로 평균적인 이직 이동이 얼마나 달라졌는지까지다. 특정 학생이 연락 몇 건을 보냈을 때 취업할 확률을 예측하거나, LinkedIn을 잘 쓰지 않는 산업과 지역 채용, 비공식 노동시장에 그대로 옮겨 적용하기에는 분명한 거리가 있다.

## 관계 지도를 기능별로 그리기

무작정 연락처 목록부터 늘리기 전에, 지금 내 주변 관계에서 어떤 정보와 도움이 오가고 있는지 기능별로 한 장에 펼쳐 적는 편이 낫다.

| 관계의 기능 | 떠올릴 사람 | 내가 물을 수 있는 것 | 내가 돌려줄 수 있는 것 | 다음에 관계를 이어 갈 방법 |
|---|---|---|---|---|
| 지지 | 어려울 때 솔직히 말할 수 있는 가까운 사람 | 감정과 생활의 점검 | 시간, 경청, 실제 도움 | 정기적인 안부와 함께하는 일 |
| 협력 | 함께 수업·프로젝트·업무를 한 사람 | 작업 방식, 내 강점과 약점 | 약속한 결과, 검토, 자료 공유 | 끝난 일의 후속 결과 알리기 |
| 연결 | 다른 산업·직무·지역에 있는 지인 | 그 세계의 실제 과업과 진입 조건 | 내가 아는 분야의 정보, 적절한 소개 | 구체적인 질문 하나로 짧게 연락 |
| 조언 | 내 다음 단계를 이미 지나온 사람 | 선택 기준, 놓친 위험, 연습 방향 | 준비된 질문, 실행 뒤 결과 보고 | 조언을 적용한 뒤 무엇이 달라졌는지 공유 |

표를 채워 보고 빈칸이 눈에 띈다고 해서 당장 억지로 사람을 채우려 할 필요는 없다. 어느 기능이 비어 있는지 확인한 뒤 그 기능이 자연스럽게 자라날 활동을 고르면 된다. 다른 직무의 생생한 정보가 필요하다면 공개 세미나, 동문 행사, 학과 밖 프로젝트처럼 약한 연결이 생길 장소에 나간다. 함께 일해 본 협력의 증거가 부족하다면 행사장에서 명함을 많이 모으는 것보다 작은 과업 하나를 끝까지 함께 완주하는 편이 훨씬 낫다. 지지 관계가 약할 때는 취업 정보 모임부터 쫓기보다 생활을 함께 나눌 시간을 먼저 마련하는 일이 중요할 수도 있다.

무언가를 요청할 때는 내가 지킬 수 있는 약속도 함께 적어 둔다. 관계가 매번 같은 양을 즉시 주고받는 거래는 아니더라도, 답을 받은 뒤 입을 씻고 사라졌다가 필요할 때만 다시 나타나는 습관으로는 어떤 관계에서도 신뢰가 쌓이기 어렵다.

## 연락을 작고 구체적으로 하기

처음 말을 거는 낯선 사람에게 불쑥 "멘토가 되어 주세요"라고 요청하면 상대가 감당해야 할 범위와 시간 부담이 지나치게 커진다. 상대가 부담 없이 응할 수 있으려면 다음 순서처럼 연락의 비용을 작고 구체적으로 줄여야 한다.

1. 왜 그 사람에게 묻는지 공개된 작업이나 공통 맥락을 한 문장으로 밝힌다.
2. 알고 싶은 것을 하나로 줄인다. '커리어 조언'보다 '신입이 처음 6개월 동안 맡는 운영 책임'이 답하기 쉽다.
3. 15~20분 대화나 이메일 답변처럼 필요한 시간의 크기를 분명히 제시한다.
4. 스스로 이미 조사한 것과 아직 확인하지 못한 것을 구분해 적는다.
5. 답을 받으면 감사 인사와 함께 적용한 결과를 나중에 알린다.

이 다섯 단계 순서와 '15~20분'이라는 시간 기준에는 따로 검증된 연구 근거가 없다. 상대가 답변에 들일 부담을 낮추고, 요청이 맞지 않을 때 서로 어색하지 않게 빨리 지나가려고 맞춘 실용적인 실행안일 뿐이다.

정성껏 연락을 보내도 답장이 오지 않는 경우는 흔하다. 상대가 너무 바쁘거나, 질문이 본인의 영역과 맞지 않거나, 원래 모르는 사람에게는 답하지 않는 원칙을 지킬 수도 있다. 짧고 정중하게 후속 연락을 한 번만 더 건네 본 뒤에도 반응이 없다면 미련을 두지 말고 다른 자료와 다른 사람으로 넘어간다.

## 멘토 한 사람에게 경력 맡기지 않기

완벽한 멘토 한 사람을 찾아 진로의 모든 답을 얻으려는 태도 역시 경계해야 한다. Allen과 동료들이 직장 내 멘토링과 경력 결과를 다룬 메타분석에서는 멘토링이 보상이나 승진 같은 객관적 결과와 직무·경력 만족 같은 주관적 결과 모두와 관련이 있었다. 다만 객관적 결과에 나타난 효과 크기는 작았고, 포함된 연구 대부분이 상관 설계라 멘토링 덕분에 경력이 풀린 것인지 아니면 이미 유망하고 적극적인 사람이 멘토까지 잘 얻은 것인지 완전히 분리하기 어려웠다. 직장인 표본에서 나온 결과를 학부생의 관계에 그대로 옮기는 데도 한계가 있다.

그러므로 모든 답을 줄 한 사람을 찾기보다 필요한 기능을 여러 사람에게 나누어 묻는다. 내 기술 산출물을 엄격하게 봐 줄 사람, 바깥 업계 정보를 전해주고 다리를 놓아 줄 사람, 조직 안의 문제를 해석해 줄 사람, 생활과 건강을 함께 살펴 줄 사람이 서로 달라도 괜찮다. 조언이 서로 부딪힐 때는 누구 말이 맞는지 곧장 고르기 전에 각 사람이 어떤 경험과 조건에서 그 말을 했는지부터 맥락을 적는다. 어떤 조언을 듣더라도 최종 선택과 그 결과에 대한 책임은 본인에게 남기 때문이다.

관계 지도에서 지친 생활을 버텨 낼 지지, 함께 끝까지 매듭지은 작업, 다른 산업의 정보 가운데 가장 허전한 빈칸 하나를 골라 본다. 그리고 한 번에 답할 수 있을 만큼 작게 깎은 질문이나 함께 해 볼 수 있는 작은 일을 건넨 뒤, 새로 알게 된 사실과 다음에 이어 갈 일을 기록으로 남긴다. 이렇게 실력을 다지고 실패를 쪼개 고치며, 생각을 다듬어 건네고 사람들과의 연결까지 넓혀 가는 습관은 결국 현실의 일터로 이어진다. 아직 해 본 일이 적고 정보도 부족한 첫 직장에서 당장 평생의 정답을 찾으려 하기보다, 그곳에서 다음 선택지로 옮겨 갈 수 있는 일의 증거와 생활 기반을 남기는 일이 중요해진다.

# 19장 첫 직장 보는 법

앞선 장들에서 역량을 키우고 관계를 넓히며 선택지를 만드는 법을 살폈다면, 이제는 실제로 조직에 들어간 뒤의 시간을 다룰 차례다. 첫 직장을 고를 때는 아직 해 본 일이 적고, 공고와 면접에서 들은 설명만으로는 상사나 동료, 업무 속도, 평가 방식까지 미리 가늠하기 어렵다. 정보가 모자란 상태에서 내리는 결정인데도 주변에서는 첫 회사가 앞으로의 경력을 거의 정해 버릴 것처럼 말하곤 한다. 이 말에 휘둘리면 첫 지원부터 평생의 정답을 찾으려다 발이 묶이기 쉽다.

실제 통계를 보면 첫 직장은 평생의 종착지가 아니다. 미국 노동통계국이 2026년 1월 기준으로 집계한 현재 고용주 근속기간의 중앙값은 전체 임금근로자가 4.1년, 25~34세가 3.0년이었다. 물론 이는 한 시점에 현재 직장에서 일한 기간을 보여 주는 미국 자료일 뿐, 한 사람이 평생 몇 번 이직하는지나 한국 청년이 평균 언제 회사를 옮기는지까지 알려 주지는 않는다. 그럼에도 입사 한 번으로 경력 전체가 고정되지 않는다는 사실만큼은 분명하다.

그렇다고 첫 직장이 아무 흔적도 남기지 않는 것은 아니다. Oreopoulos와 동료들이 1976~1995년 캐나다 남성 대학 졸업생을 1982~1999년 행정자료로 추적한 연구를 보면, 불황기에 노동시장에 들어온 졸업자들의 소득 손실은 약 10년 동안 이어졌다. 처음에 임금이 낮은 고용주와 일하기 시작했기 때문인데, 이들은 이후 더 나은 고용주로 옮겨 가며 손실을 일부 회복했다. 구체적인 손실액과 기간은 당시 캐나다 노동시장의 특수성을 반영한 수치지만, 졸업 시점의 경기처럼 개인이 고를 수 없는 조건이 첫 고용주를 매개로 경로를 바꿀 수 있고, 반대로 더 나은 자리로 이동하며 경로를 되돌리는 일도 가능하다는 점은 시사하는 바가 크다.

## 첫 자리에서 남길 것

첫 직장의 의미를 회사 이름 하나로만 따지면 그 안에서 무엇이 다음 경력으로 이어지는지 보기 어렵다. 다음 지원에서 실제로 힘을 발휘하는 자산은 간판이 아니라 그곳에서 직접 해낸 일과 지켜 낸 생활 조건이다. 첫 자리에서 남길 것을 네 가지로 나누어 보면 입사 뒤에 무엇을 확인해야 할지 선명해진다.

| 남길 것 | 입사 뒤 확인할 내용 | 다음 자리에서 보일 자료 |
|---|---|---|
| 익힌 일 | 반복해서 맡은 과업, 사용한 도구, 판단한 범위 | 다른 조직에서도 설명할 수 있는 기술과 문제 해결 과정 |
| 작업 증거 | 완료한 산출물, 바뀐 결과, 실패 뒤 수정 | 공개 가능한 포트폴리오, 이력서의 구체적인 성과, 면접에서 설명할 사례 |
| 함께 일한 사람 | 피드백을 준 사람, 협업 상대, 도움을 주고받은 관계 | 추천, 평판, 다른 역할에 관한 정보 |
| 생활 기반 | 소득, 건강, 주거, 보험, 회복 시간 | 다음 이동을 서두르지 않고 검토할 여유 |

이 가운데 작업 증거는 회사 밖으로 반출하는 결과물이 아니라 자기 역할과 판단의 기록이다. 비공개 코드나 고객 정보, 사내 문서는 당연히 외부에 공개할 수 없다. 대신 어떤 문제를 맡아 누구와 어떤 결정을 내렸고 그 결과 무엇이 달라졌는지는 허용된 범위 안에서 충분히 정리할 수 있다. 코드를 직접 보여 주지 못해도 모호한 요구를 어떻게 좁혔는지, 동료의 검토를 거쳐 설계를 왜 바꿨는지, 장애를 겪은 뒤 재발 방지 대책을 어떻게 세웠는지는 자신의 일로 또렷하게 설명할 수 있다.

아울러 첫 직장에서 배울 수 있는 양만큼 그 일을 계속 버텨 낼 수 있는 생활 조건도 함께 따져야 한다. 급여가 턱없이 낮거나 통근에 몇 시간씩 쓰이고, 불안정한 계약에 잦은 야간 대응까지 겹치면 기술을 익히는 동안에도 삶에 큰 비용이 쌓인다. 생활 기반이 무너지면 당장 눈앞의 일을 배울 힘은 물론 다음 선택을 차분히 준비할 시간과 여유까지 함께 줄어든다.

## 입사 초기에 알아내야 할 것

입사 직후의 혼란을 다루려면 막막한 기분을 성급히 성격이나 적성 문제로 돌리지 않아야 한다. Bauer와 동료들은 신입 구성원의 조직 적응을 다룬 70개 표본을 메타분석하면서, 적응을 역할 명료성·자기효능감·사회적 수용이라는 세 갈래로 나누었다. 내가 무엇을 해야 하는지 아는가, 그 일을 해낼 수 있다는 감각이 생기는가, 함께 일하는 사람들과 관계를 맺고 있는가 하는 질문이다. 연구에서 이 세 측면은 직무만족, 조직몰입, 업무 수행, 남으려는 의도 같은 결과와 대체로 이어졌다. 포함된 연구마다 설계와 조직 맥락이 달랐고 장기 경력 결과까지 추적하지는 못했지만, 이 구분만으로도 입사 초기의 막막함을 ‘내가 이 직업에 맞지 않는다’는 한 덩어리 결론으로 뭉뚱그리지 않을 수 있다.

불편함의 정체를 셋으로 쪼개 보면 필요한 대응도 달라진다. 역할이 불분명하다면 상사나 동료에게 작업의 완료 기준과 우선순위를 먼저 물어야 하고, 일을 해낼 자신감이 부족하다면 실제로 보완할 기술이 있는지, 아니면 익힌 능력을 써 볼 기회 자체가 없었는지부터 가려내야 한다. 기술이 모자라다면 다음 업무에 당장 필요한 학습 범위를 좁히고 어느 단계에서 피드백을 받을지 정하는 편이 낫다. 팀 안에 편하게 질문할 사람이 없다면 정기적인 일대일 면담이나 코드·설계 검토, 동료와 함께하는 작업처럼 실제 접점이 생기는 자리부터 만들어 본다. 다만 역할과 기술 지원, 관계의 접점이 모두 비어 있다면 개인의 적응 속도를 탓하기 전에 그 팀이 신입을 받아들이는 방식 자체를 점검해야 한다.

## 기간보다 기록으로 판단하기

첫 회사에서 최소 몇 년을 채워야 한다는 보편적인 기준은 없다. 분야마다 프로젝트 주기와 채용 관행이 다르고, 계약 형태나 비자, 돌봄, 건강 사정에 따라 이동 시기가 달라지기 때문이다. 그러므로 달력에 찍힌 기간 대신 그동안 남긴 기록으로 성장 여부를 확인하는 편이 정확하다. 입사 때부터 분기나 반기처럼 자신의 업무 주기에 맞춰 짧은 기록을 남겨 두면 판단이 한결 쉬워진다. 새로 맡게 된 일과 혼자 처리할 수 있게 된 범위, 다른 사람이 확인할 수 있는 결과를 적으면서도 여전히 권한이나 자원이 없어 막히는 지점을 함께 적어 둔다. 급여와 근무시간, 수면, 통근, 주변 관계 같은 생활 조건의 변화도 빠뜨리지 않는다. 나중에 이 기록을 펼쳐 보면 단순히 회사 분위기에 익숙해진 것인지, 실제로 할 수 있는 일이 늘어난 것인지 한눈에 가를 수 있다.

이런 기록은 다음 이동을 가늠할 때도 든든한 근거가 된다. De Vos와 동료들이 정리한 경력 전환 연구는 이동 전후에 쌓은 능력과 관계, 그리고 새 환경에서 그 자원을 실제로 쓸 수 있는 조건을 함께 살핀다. 입사 초기부터 남겨 둔 기록은 현재 역할이 어떻게 달라졌는지 보여 주는 생생한 자료다. 처음에는 도움을 받아야 끝내던 일을 혼자 마무리하게 됐는지, 더 넓은 판단을 맡게 됐는지, 같은 문제가 다시 터졌을 때 예전과 다른 방식으로 풀게 됐는지를 짚어 보면서 회사 이름을 지우고도 자신의 변화를 설명할 수 있는지 확인하면 경험의 알맹이가 보인다.

결국 첫 직장에서 확인해야 할 질문은 하나다. 지금 이 자리에서 다음 선택의 조건이 쌓이고 있는가 하는 점이다. 배우는 일이 눈에 띄게 줄었거나 생활 기반이 서서히 무너진다고 느낄 때는 버틴 햇수를 세는 대신, 지금 겪는 어려움이 일시적인 적응 과정인지, 조정을 통해 고쳐 볼 수 있는지, 아니면 조직 구조상 되풀이되는 문제인지를 나누어 따져야 한다.

# 20장 계속할 이유와 그만둘 이유

“일이 힘들다”는 한마디 안에는 전혀 다른 상황이 뒤섞여 있다. 새 도구를 익히느라 작업이 더딜 수도 있고, 우선순위가 수시로 뒤집혀 아무 일도 끝내지 못할 수도 있다. 직속 상사와 일하는 호흡이 어긋나는 경우가 있는가 하면, 폭언과 보복 때문에 안전을 걱정해야 하는 경우도 있다. 이 차이를 갈라 보지 않으면 초반의 서투름을 회사의 구조적 결함으로 오해하거나, 반대로 해로운 환경을 성장통이라 부르며 버티는 오류에 빠진다.

직장과 내가 맞는지를 따질 때도 갈래는 여러 개다. Kristof-Brown과 동료들이 개인과 직무, 개인과 조직, 개인과 집단, 개인과 상사 사이의 적합성을 나누어 직무 태도와 수행, 이탈 행동과의 관련성을 살핀 메타분석을 보면, 직장의 한 면만 보고 전체를 판단하기 어렵다는 점이 드러난다. 좋아하는 기술을 다루더라도 상사의 피드백 방식이 버거울 수 있고, 회사의 목표에는 공감하면서도 팀의 협업 규칙 때문에 소진될 수 있다. ‘나와 회사가 맞지 않는다’고 한꺼번에 결론 내리기 전에 어느 층위에서 어긋나는지 짚어야 무엇을 바꿀 수 있는지도 정해진다.

## 남게 만드는 힘과 남을 이유

직장을 떠날지 남을지는 만족도 하나로만 결정되지 않는다. Jiang과 동료들이 65개 표본, 총 42,907명의 자료를 종합한 메타분석에 따르면, 직무만족이나 정서적 조직몰입, 다른 일자리가 있다는 인식을 함께 고려한 뒤에도 직장 안팎의 직무 배태성(job embeddedness)이 높을수록 이직 의도와 실제 이직이 모두 낮았다. 연구자들은 사람을 자리에 붙잡아 두는 이 힘을 연계, 적합성, 희생 세 가지로 설명한다. 회사와 지역사회에 얽힌 관계가 많고, 현재 생활과 일이 맞물려 있으며, 떠날 때 포기해야 할 것이 클수록 사람은 쉽게 움직이지 못한다.

비자나 보험, 높은 보상, 마음 맞는 동료, 아이의 학교, 배우자의 직장처럼 생활을 떠받치는 요소는 가볍게 볼 조건이 아니다. 다만 판단할 때는 ‘이 일이 왜 내게 맞고 건강한가’와 ‘여기를 떠나면 무엇을 잃는가’를 서로 다른 칸에 적어야 한다. 떠날 때 잃는 것이 크다는 이유만으로 건강하지 않은 업무 환경까지 괜찮은 일로 착각하지 않기 위해서다.

이미 쏟아부은 시간 때문에 발을 빼지 못하는 심리도 경계해야 한다. 부정적인 신호를 보고도 자원을 계속 투입하는 몰입 상승(escalation of commitment)을 다룬 Sleesman과 동료들의 메타분석은 상당 부분 조직의 프로젝트와 실험 과제를 분석했고, 오래 다닌 직장에 남는 개인의 결정까지 직접 검증하지는 않았다(→ [8장](./chapter_08_commit.md)). 그럼에도 “여기서 4년을 보냈으니 한 해만 더 버티자”는 말이 앞으로 얻을 가치보다 과거에 이미 쓴 시간에 기대고 있는 것은 아닌지 점검해 볼 만하다.

## 문제의 종류에 따라 먼저 할 일

지금 겪는 어려움이 어느 성격에 가까운지 가려내면 먼저 취할 행동과 확인해야 할 근거가 달라진다. 아래 표처럼 문제의 모습을 네 가지로 나누어 대응 순서를 정리해 볼 수 있다.

| 문제의 모습 | 먼저 할 일 | 다시 볼 자료 |
|---|---|---|
| 새 업무의 학습 비용 | 기대 수준과 학습 자원, 피드백 시점을 확인한다 | 일정 기간 뒤 속도·오류·도움 없이 할 수 있는 범위의 변화 |
| 조정할 수 있는 업무 문제 | 우선순위, 역할, 인력, 마감, 근무 방식 가운데 바꿀 항목을 좁힌다 | 누가 무엇을 언제 바꾸기로 했고 실제로 달라졌는지 |
| 반복되는 구조적 문제 | 같은 문제가 팀·프로젝트가 바뀌어도 이어지는지, 결정권이 어디 있는지 확인한다 | 업무량·이직·휴가·보복·평가 관행의 반복 기록과 제3자의 정보 |
| 안전·건강·불법·괴롭힘 문제 | 직접 해결을 시험하기보다 거리를 두고 보호·신고·의료·법률 자원을 찾는다 | 공식 규정, 기록, 전문 기관의 안내 |

표의 마지막 줄을 앞의 문제들과 같은 순서로 다뤄서는 안 된다. 역할이 모호하거나 일정이 빠듯한 정도라면 완료 기준이나 우선순위를 다시 합의해 볼 여지가 있다. 그러나 폭력이나 괴롭힘, 차별, 보복, 중대한 안전 위반이 벌어지고 있다면 당사자에게 먼저 대화를 시도해 보라고 요구할 수 없다. 그럴 때는 조정이 아니라 보호와 기록, 외부 자원이 우선이다.

## 수정 가능성을 실제 변화로 확인하기

안전 문제가 아니고 바꿀 권한을 가진 사람도 분명하다면 한두 가지 조건을 실제로 조정해 볼 수 있다. 대화를 나눈 뒤에는 막연한 약속으로 끝내지 말고 무엇이 언제까지 달라지기로 했는지 기준을 남긴다. 우선순위를 누가 정할지, 동시에 맡는 일의 수를 몇 개로 제한할지, 어느 시점에 피드백을 받을지처럼 눈으로 확인할 수 있는 항목과 점검 날짜를 함께 적어 두는 편이 좋다.

약속한 날짜가 돌아왔을 때 따져 볼 것은 세 가지다. 같은 문제가 그동안 얼마나 되풀이됐는지, 합의한 대로 조건이 실제로 바뀌었는지, 그리고 업무와 일상의 피해가 줄었는지다. 말만 오가고 현장의 조건은 제자리걸음이라면 ‘조금만 더 지켜보자’는 태도는 기한 없는 유예로 흐른다. 반대로 실제 변화가 이어졌다면 처음의 어려움이 조정 가능한 문제였다는 근거가 생긴다.

## 떠나기 전에 갖출 조건

떠나야 한다는 판단이 섰더라도 당장 움직이기 어려운 현실적 조건이 남는다. 현금 여유나 건강보험, 비자, 주거, 돌봄 책임, 다음 구직에 쓸 시간, 받고 있던 치료의 연속성에 따라 실행 시점이 달라지기 때문이다. 실업이 개인에게 미치는 영향을 다룬 Paul과 Moser의 메타분석(237개 횡단연구와 87개 종단연구 종합)에서도 실업 상태는 평균적으로 더 큰 심리적 고통과 관련됐다. 종단연구와 자연실험을 따로 보면 원래 정신건강이 좋지 않아 실업으로 이어지는 선택효과도 일부 나타났지만 그 영향은 약했고, 실업 자체가 정신건강을 해치는 효과가 더 뚜렷했다. 사회보장 제도와 노동시장이 서로 다른 여러 국가와 시대의 자료를 합친 결과이므로 집단 수준의 경향으로 읽어야 하지만, 해로운 일을 끝내는 이득과 소득·보험·생활 리듬을 잃는 비용이 동시에 존재한다는 점만큼은 분명하다.

그러므로 가능하다면 떠나기 전에 다음 단계로 건너갈 기반부터 마련하는 편이 안전하다. 아울러 회사 안에서의 팀 이동이나 휴직, 근무 조건 조정이 실제 선택지가 되는지도 살펴볼 수 있다. 다만 사내 규정집에만 적힌 제도를 섣불리 믿기보다 실제로 승인되고 쓰이는 제도인지 확인한 뒤에야 선택지 목록에 올린다.

마지막 결정을 내릴 때는 현재 겪는 문제, 남을 이유, 떠날 때 치를 비용, 안전상 더 기다릴 수 없는 조건을 한 곳에 적는다. 안전 위험이 없고 바꿀 권한이 있는 사람과 실제로 조정을 시도해 보았다면 그 결과까지 덧붙이고, 위험 때문에 시도조차 하지 못했다면 그 사실 자체를 판단 근거로 남긴다. 어느 쪽을 고르든 결정의 기준은 과거에 쓴 시간이 아니라 지금부터 달라질 조건이다. 다만 팀 개편이나 프로젝트 종료처럼 조직이 먼저 판을 바꾸어 버렸다면 문제의 출발점부터 달라진다. 그때는 개인이 회사에 맞는지 따지기 전에, 바뀐 사실과 그 위에서 남은 선택지부터 새로 정리해야 한다.

# 21장 조직이 바뀐 뒤의 선택지

어제까지 핵심으로 꼽히던 프로젝트가 하루아침에 중단되는 일이 있다. 인수합병 뒤 보고 체계가 바뀌기도 하고, 새 팀장이 오면서 우선순위가 뒤집히거나, 감원 이후 남은 사람들에게 업무가 몰리기도 한다. 이런 변화는 개인의 성과와 무관하게 시작되는 경우가 적지 않지만, 조직이 먼저 조건을 바꾸어 놓았는데도 당사자는 “내가 부족해서 이런 일이 생겼나”라며 스스로를 탓하기 쉽다.

Akkermans와 동료들은 이처럼 개인의 통제 밖 요인이 개입해 경력의 흐름을 끊고 진로를 다시 고민하게 만드는 이례적 사건을 커리어쇼크(career shock)라고 부른다. 이런 충격을 다룰 때는 사건 자체와 그 뒤의 경로를 떼어 놓아야 한다. 팀 해체는 내 힘으로 막을 수 없었더라도, 이후에 내부 이동을 알아볼지, 다른 회사로 옮길지, 잠시 일을 멈출지는 개인이 가진 자원과 주변 제도에 따라 달라진다. 모든 충격을 무조건 ‘성장의 계기’로 미화하면 소득 손실이나 건강, 비자, 돌봄에서 실제로 입는 타격을 지워 버리게 된다.

## 공식 결정 전의 고용 불안

공식 발표가 나기 전의 어수선한 시기 자체가 사람들을 지치게 만든다. Shoss의 통합 검토는 고용 불안을 지금의 일자리가 안정적으로 이어지지 못하리라고 느끼는 상태로 정의한다. Cheng과 Chan이 133개 연구의 172개 독립 표본, 총 132,927명의 자료를 종합한 결과, 고용 불안은 낮은 직무 수행과 좋지 않은 건강 상태, 높은 이직 의도와 맞물려 있었으며 이직 의도나 건강과의 관련 정도는 연령과 근속기간에 따라 달랐다. 이 메타분석은 변수들 사이의 상관을 종합한 연구여서 불안이 곧바로 그 결과들의 원인이라고 단정할 수는 없지만, 앞날이 불투명한 상태로 오래 버티는 일이 일과 생활에 적지 않은 부담을 준다는 사실은 분명히 보여 준다.

막연한 불안에 휩쓸리지 않으려면 조직 안에서 흘러다니는 이야기를 성격별로 나누어 정리해야 한다. **공식 사실**은 회사가 적용 대상과 시행일을 밝혀 공식적으로 알린 내용이다. **관찰 신호**는 사업 중단이나 채용 동결, 핵심 인력의 이탈, 예산 삭감처럼 직접 확인했지만 회사가 아직 결론을 발표하지 않은 변화다. **소문**은 출처도 적용 범위도 확인되지 않은 말이다. 관찰 신호는 빠짐없이 챙겨 두되, 소문까지 공식 결정처럼 다루면 현재 선택지를 잘못 그리게 된다.

변화의 조짐이 보이면 다음 순서대로 현황을 적어 본다.

1. 공식 사실, 관찰 신호, 소문을 먼저 가른다.
2. 시행 날짜, 대상 팀, 보고 관계·인원·프로젝트·계약 가운데 구체적으로 무엇이 바뀌는지 확인한다.
3. 자신의 업무, 평가, 근무지, 보상, 비자와 보험에서 달라질 항목을 적는다.
4. 정확한 답을 줄 담당자와 답변 시점을 확인하고, 아직 모르는 항목은 ‘미확인’으로 남겨 둔다.
5. 결론을 기다리는 동안에도 반드시 지켜야 할 건강·소득·주거 조건이 있는지 점검한다.

이 목록은 확인된 상태가 달라질 때마다 고쳐 적는다. 관찰 신호가 공식 발표로 굳어지거나 적용 대상에서 내 팀이 빠지면 선택지도 함께 바뀐다. 이때 확인한 날짜를 함께 적어 두어야 오래된 소문과 새로 확인된 사실이 한 목록에 뒤섞이지 않는다.

공식 결정을 기다리는 기간이 길어지면 ‘아직 모른다’는 상태 자체가 일상을 갉아먹는다. 그 시기에 수면이 무너지거나 업무 기능이 크게 흔들린다면 단순한 걱정이 아니라 건강 문제로 함께 다루어야 한다. 회사의 근로자 지원 프로그램(EAP)이나 의료기관, 노동·법률 상담처럼 지금 상황에 맞는 외부 도움을 따로 찾는 편이 안전하다.

## 이미 준비한 것을 바뀐 조건에 맞추기

조직 개편이 시작됐다고 해서 그동안 쌓아 온 모든 기반을 처음부터 다시 적을 필요는 없다. 19장에서 정리한 업무 기록이나 18장에서 그린 관계 지도, 소득·보험·주거·돌봄 같은 생활 조건 가운데 **달라진 것과 끊길 것**만 추려 갱신하면 된다.

먼저 일과 관계 쪽에서는 중단된 프로젝트가 어디까지 완료됐는지, 앞으로 누구에게 보고하며 어떤 책임과 권한을 맡는지, 함께 일하던 동료 가운데 실제로 남는 사람이 누구인지부터 확인한다. 회사 자료의 대외비 범위는 엄격히 지키되, 자신의 기여와 판단 과정만큼은 언제든 설명할 수 있게 정리해 둔다. 이어서 생활 조건 쪽에서는 계약 종료일과 보험, 비자, 주거, 돌봄 일정에 변동이 생기는 날짜를 맞춰 본다. 이렇게 두 축을 함께 갱신하면 조직이 판을 바꾸면서 예전 선택지 가운데 무엇이 사라졌는지 정확히 가려낼 수 있다.

## 하나가 아닌 다음 자리

조직이 흔들리면 외부 이직만 떠올리기 쉽지만 실제로 선택할 수 있는 경로는 그보다 넓다. 같은 회사 안에서 다른 팀이나 역할로 옮길 수도 있고, 완전히 다른 조직으로 이동할 수도 있으며, 건강·돌봄·이주 때문에 잠시 일을 멈추거나 교육을 받은 뒤 새 분야로 넘어가는 길도 있다. 물론 각 경로가 열리는 폭은 사람마다 다르다. 내부 공모가 열려도 현 상사의 승인이 필요할 수 있고, 일을 잠시 멈추면 소득과 비자 면에서 큰 비용을 치러야 하며, 재교육을 마친다고 해서 곧바로 채용이 보장되는 것도 아니다.

실제로 전환이 어떻게 작동하는지 살핀 De Vos와 동료들의 경력 전환 문헌고찰은 이동과 고용가능성의 관계가 전환의 종류, 전후 맥락, 개인이 가진 자원에 따라 달라진다고 정리했다. 여기서 개인이 점검해 볼 수 있는 자원을 구체화한 연구가 Rudolph와 동료들의 메타분석이다. 90개 연구를 종합한 이들은 경력 적응성(career adaptability)을 미래의 과제를 준비하는 ‘관심’, 자신의 경력 발달에 책임을 지는 ‘통제’, 가능한 미래를 살피는 ‘호기심’, 경력 문제를 풀 수 있다는 ‘자신감’이라는 네 가지 심리사회적 자원으로 나누었다. 이 네 요소를 하나씩 짚어 보면 지금 내가 스스로 준비해야 할 일과 정보를 더 캐물어야 할 경로를 나누기 쉬워진다. 다만 준비할 의지와 자신감이 충분하더라도 실제로 열려 있는 자리와 감당할 수 있는 계약 조건은 별개로 확인해야 한다.

여러 갈래의 선택지를 나란히 놓고 비교할 때는 한 가지 원칙이 중요하다. 바뀐 조직에 남았을 때 맡게 될 실제 역할, 내부 이동 뒤의 처우, 외부 제안의 업무와 계약 내용, 중단 기간의 생활비와 복귀 경로를 모두 **같은 기준일**에 맞춰 올려두고 재야 한다는 점이다. 예전 팀이 좋았다는 기억과 앞으로 생길지 모르는 불확실한 자리를 맞대고 비교하면 판단의 저울이 기운다. 이미 사라진 조건은 현재 선택지 목록에서 지워야 지금 서 있는 자리에서 최선의 다음 걸음을 고를 수 있다.

# 22장 번아웃과 일의 조건

앞 장들에서 직장에 남거나 떠나는 선택을 다루었다면, 이제부터는 일하면서 스스로를 소진시키지 않는 조건을 살펴볼 차례다. 며칠 몰아서 야근한 뒤 찾아오는 피로, 오래 일하면서 쌓인 냉소, 그리고 우울이나 불안은 겉으로 드러나는 모습이 일부 겹칠 수 있다. 그렇다고 이 상태들을 모두 번아웃이라는 말로 한데 묶거나, 반대로 번아웃을 며칠 쉬면 풀릴 단순 피로로 축소하면 문제의 원인과 손봐야 할 업무 조건을 함께 놓치게 된다. 먼저 이 말이 정확히 무엇을 가리키는지 범위부터 가려야 한다.

## WHO가 말하는 번아웃

세계보건기구(WHO)는 국제질병분류 제11판(ICD-11)에서 번아웃을 의학적 질병이 아니라 ‘직업 관련 현상(occupational phenomenon)’으로 분류한다. 제대로 관리되지 않은 만성적인 직장 스트레스에서 비롯되는 상태라고 설명하며, 에너지 고갈이나 탈진, 일과의 심리적 거리 증가 또는 부정적·냉소적 감정, 직업 효능감 저하라는 세 차원을 제시한다. 아울러 WHO는 이 정의가 오직 직업 맥락에만 적용된다고 선을 긋는다.

이 세 차원은 온라인 자가진단표처럼 점수를 매겨 판정하라고 만든 기준이 아니다. 몹시 피곤한 하루를 보냈다고 번아웃이 되는 것은 아니며, 잠을 설치거나 집중이 잘 안 된다는 사실만으로는 다른 정신건강 상태와 구별할 수도 없다. WHO 분류의 핵심은 번아웃이 **만성적인 직장 스트레스에서 비롯된다**는 대목에 있다. 이 정의가 지목한 원인을 제대로 보려면 개인의 의지나 시간관리 습관 너머에 있는 직장의 조건까지 함께 들여다보아야 한다.

## 업무 요구와 자원 같이 보기

일의 조건을 뜯어볼 때 널리 쓰이는 틀이 직무요구-자원 이론이다. 여기서 ‘업무 요구(직무 요구)’란 업무량이나 시간 압박, 감정노동, 복잡한 판단, 역할 충돌처럼 지속적인 신체적·심리적 노력을 요구하고 그만큼의 비용을 수반하는 직무 특성을 뜻한다. 반대로 ‘직무 자원’은 목표 달성을 돕고 업무 요구에 따른 부담을 덜어 주거나 개인의 성장·학습·발달을 뒷받침하는 특성으로, 업무를 통제할 재량, 상사와 동료의 지원, 명확한 역할, 피드백, 회복 시간 등이 여기에 들어간다. 적절한 직무 자원 없이 높은 업무 요구가 장기간 이어질 때 소진 위험이 커진다.

Bakker와 동료들이 2023년에 발표한 종합 검토는 이 이론의 최근 연구를 정리하면서 개인과 상황의 상호작용, 팀 수준의 조건, 일과 가정의 자원까지 함께 다루었다. 이 틀이 유용한 이유는 ‘업무량이 많으면 번아웃이 온다’는 단순한 도식 대신 실제로 손댈 수 있는 지점을 찾아 주기 때문이다. 똑같이 일이 많아도 우선순위를 조정할 권한이 있는지, 막힐 때 질문할 동료가 있는지, 장애 대응 뒤에 쉴 시간이 보장되는지에 따라 몸과 마음이 버티는 정도가 크게 달라진다.

다만 위험요인마다 연구가 뒷받침하는 근거의 무게는 다르다. Aronsson과 동료들이 종단연구만 추려 업무환경과 번아웃의 관계를 살핀 체계적 고찰·메타분석에서는 포함 기준을 충족한 25편을 검토했는데, 높은 업무 통제와 이후의 낮은 정서적 소진, 그리고 낮은 직장 지원과 높은 소진 사이에는 중간 수준의 근거가 확인됐다. 반면 높은 직무 요구와 많은 업무량, 낮은 보상, 낮은 공정성, 고용 불안이 소진과 연결된다는 근거는 아직 제한적이었다. 게다가 포함된 연구 대부분이 정서적 소진에 초점을 맞추었고, 선정 기준상 유럽·북미·호주·뉴질랜드 지역 자료에 한정되었다는 점도 염두에 두어야 한다. 결국 업무량 자체만큼이나 재량과 지원이 실제로 작동하는지를 함께 살피는 편이 합리적이다.

## 조직이 만든 조건 바꾸기

번아웃과 맞물린 일의 조건을 고치려면 각 항목을 실제로 바꿀 권한이 누구에게 있는지부터 갈라 보아야 한다. 아래 표는 주요 조건별로 주된 결정권자와 확인해야 할 변화를 정리한 것이다.

| 조건 | 주된 결정권 | 확인할 변화 |
|---|---|---|
| 업무량·마감·우선순위 | 상사, 팀, 조직 | 동시에 맡는 일과 시간 압박이 실제로 줄었는가 |
| 역할·권한·지원 | 상사, 팀, 조직 | 책임에 필요한 결정권, 인력, 정보, 피드백이 생겼는가 |
| 당직·장애 대응·회복 | 팀, 조직 | 호출 빈도와 순번, 보상, 복구 뒤 휴식이 바뀌었는가 |
| 괴롭힘·차별·불공정·안전 | 조직 | 보호 절차가 작동하고 보복 없이 접근할 수 있는가 |
| 지속되는 정신·신체 상태와 기능 저하 | 당사자와 보건의료 전문가 | 상태를 평가하고 필요한 도움에 접근할 수 있는가 |

개인이 수면과 휴식을 챙기고 일터 밖에서 도움을 찾는 노력은 물론 필요하다. 하지만 다음 주의 업무량이나 야간 호출 규칙, 인력 충원, 사내 보호 절차를 정하는 권한은 개인이 아니라 조직에 있다. 직속 상사 역시 업무 우선순위는 조정해 줄 수 있어도 채용 동결을 풀거나 인력 예산을 늘리지는 못할 수 있다. 누가 결정할 수 있는 조건인지 분명히 가려내야 조직이 풀어야 할 책임이 고스란히 개인의 자책으로 넘어가지 않는다.

## 조직 개입의 결과 확인하기

조직 차원의 해법을 다룰 때도 겉으로 보이는 행사와 실제 조건의 변화를 구분해야 한다. WHO의 2022년 *Guidelines on Mental Health at Work*는 조직 개입, 관리자 교육, 근로자 교육, 개인 개입, 업무 복귀, 취업 지원을 서로 다른 권고 영역으로 나누면서, 특히 조직 개입에서는 업무 환경의 심리사회적 위험을 평가해 줄이거나 없애는 일을 우선하라고 권고한다.

현장에서 이런 개입이 얼마나 효과를 내는지는 아직 더 많은 검증이 필요하다. Bes와 동료들이 조직 수준의 번아웃 개입 연구 13건을 종합한 메타분석에서는 소진이 조금 줄어드는 경향이 나타났지만, 저자들은 근거의 질을 매우 낮게 평가했다. 연구 수가 적은 데다 연구 간 편차가 커서, 업무량을 조직 수준에서 실질적으로 바꾸는 개입 연구가 더 필요하다고 덧붙인 것이다. 회사에서 ‘웰니스 주간’을 열거나 스트레스 관리 특강을 진행했다는 사실만으로는 만성적인 업무 요구가 줄었다고 말할 수 없다. 어떤 개입이든 그 뒤에 실제 업무량과 재량, 지원, 회복 시간이 달라졌는지로 결과를 확인해야 한다.

끝으로, 번아웃은 우울이나 불안과 함께 나타날 수 있지만 같은 상태가 아니다. 어려움이 오래 이어지거나 점점 심해지고, 수면과 식사, 일상 기능, 안전에까지 문제가 번진다면 ‘직장 스트레스 때문’이라는 설명 안에만 머무르지 말고 전문가나 공식 기관의 도움 경로를 바로 확인해야 한다(→ [23장](./chapter_23_mental_health_help.md)).

# 23장 도움을 구할 시점과 경로

일이 좀처럼 손에 잡히지 않는 날, 실패 뒤 며칠 동안 마음이 가라앉는 일, 끊임없이 자격이 없다고 느끼는 일, 그리고 수면과 식사가 무너진 채 오래 지내는 일은 겉보기와 달리 모두 같은 상태가 아니다. 시작된 계기와 이어진 기간이 다르고, 일상이 흔들리는 깊이도 다르다. 그런데 도움을 받으려면 스스로 정확한 병명부터 붙여야 한다고 생각하기 시작하면, 정작 필요한 연결은 미룬 채 이름만 찾느라 귀한 시간을 보내게 된다.

도움을 구하기 전에 진단을 스스로 마칠 필요는 없다. 지금 겪는 괴로움이 얼마나 심한지, 언제부터 얼마나 이어졌는지, 평소 하던 일을 얼마나 바꾸었는지, 그리고 자신이나 다른 사람의 안전이 걱정되는지 말할 수 있으면 그것으로 충분하다. 정확한 진단과 치료 계획은 그 정보를 바탕으로 전문가가 함께 살펴 정할 영역이다.

## 사건 뒤 반응과 오래 이어지는 어려움

발표를 망치거나 시험에 떨어지고, 지원한 곳에서 연이어 불합격 통지를 받으면 마음이 크게 흔들리기 마련이다. 이처럼 특정 사건이 분명할 때는 벌어진 사실과 자기평가를 먼저 떼어 놓는 편이 좋다. 당장 처리할 일이 남았다면 기한부터 확인하고, 잠시 쉬거나 주변 사람에게 손을 내민다. 원인이 뚜렷한 일시적 타격이라도 회복하는 과정에서는 얼마든지 다른 사람의 도움을 받을 수 있다.

문제는 계기가 뚜렷하지 않거나 사건이 지나간 뒤에도 어려움이 잦아들지 않을 때다. 수면과 식사, 집중력, 수업이나 출근, 사람을 만나는 일까지 평소와 달라진 채 계속 이어진다면 ‘이번 실패를 긍정적으로 해석하자’는 식의 마음가짐만으로는 버티기 어렵다. 무엇 때문에 시작됐는지 콕 집어 말하기 어려워도 도움을 청할 이유는 충분하다.

상담이나 진료를 앞두고 자신의 상태를 설명할 때는 아래 항목을 짧게 메모해 두면 도움이 된다.

- 언제 시작됐고 최근에 어떻게 달라졌는가
- 하루나 한 주에 얼마나 자주 나타나며 어느 때 심해지는가
- 수면, 식사, 집중, 학업·업무, 대인관계에 어떤 변화가 생겼는가
- 최근의 큰 사건, 복용 중인 약, 신체 건강 문제 가운데 함께 알려야 할 것이 있는가
- 지금 자신이나 다른 사람의 안전이 걱정되는가

이 목록은 점수를 매겨 병명을 가리는 자가진단표가 아니다. 상담기관이나 의료진에게 현재 상황을 빠짐없이 전달하고, 스스로도 미처 의식하지 못했던 일상의 변화를 짚어 보기 위한 메모다. 만약 이런 내용을 정리할 힘조차 나지 않는다면, 메모를 완성하려 애쓰지 말고 지금 상태 그대로 도움을 요청하면 된다.

## 진단명이 아닌 임포스터 현상

새로운 팀에 들어가거나 난도가 높은 수업을 듣다 보면 “다른 사람은 다 아는데 나만 모른다”는 불안이 고개를 들곤 한다. 분명 성과를 내고도 그저 운이 좋았거나 평가자가 실수로 좋게 봤을 뿐이라며 자신의 자격을 의심하기도 한다. 흔히 임포스터 증후군이라고 부르지만, 이는 정식 임상 진단명이 아니다. 그래서 연구 문헌에서는 임포스터 현상(impostor phenomenon)이나 임포스터 감정이라는 표현을 쓴다.

이 현상이 얼마나 흔하고 어떻게 다뤄야 하는지에 대해서는 과장된 통념을 걸러 볼 필요가 있다. Bravata와 동료들이 62개 연구, 총 14,161명의 자료를 검토한 결과, 임포스터 현상을 겪는 사람의 비율은 연구에 따라 9%에서 82%까지 크게 엇갈렸는데, 이 차이는 주로 측정도구와 기준점(절단점)이 달랐기 때문에 생겼다. 임포스터 현상은 불안, 우울, 직무만족, 번아웃 등과 관련을 보였지만 포함된 연구들이 서로 이질적이고 대부분 한 시점의 설문조사에 머물렀으며, 치료 효과를 검증한 연구는 포함되지 않았다. 게다가 이 검토는 Crossover Health의 지원을 받았고, 저자 한 명을 제외한 모두가 해당 회사의 직원이나 자문이었다는 점도 감안해야 한다.

따라서 ‘대학생 대부분이 겪는 증후군’이라거나 특정 비법으로 금방 고칠 수 있다고 단정할 근거는 부족하다. 현장에서 먼저 해 볼 수 있는 일은 막연한 자격 의심과 외부 비교를 갈라 보는 것이다. 유독 눈에 띄는 동료의 최고 성과만 떼어 내어 자신의 평균과 견주고 있다면 비교의 기준부터 내려놓아야 한다. 이미 통과한 평가와 직접 끝낸 일까지 모두 우연으로 돌리고 있다면, 자신이 맡았던 작은 기여와 실제로 받은 피드백을 기록해 머릿속 생각과 실제 자료를 대조해 볼 수 있다. 그래도 괴로움이 가시지 않고 일상 기능이 떨어지기 시작하면 우울이나 불안 증상이 함께 자리 잡고 있는지 전문가와 확인해야 한다.

## 자기관리에서 전문적 도움으로

스스로 돌보면서 버텨 볼 단계인지, 전문적인 도움을 찾아야 할 시점인지 가늠할 때는 증상의 강도와 지속 기간, 일상 기능의 변화를 함께 본다. 미국 국립정신건강연구소(NIMH)의 2025년 개정 일반인 안내에 따르면, 가벼운 증상이 2주보다 짧게 이어지면서 자신과 주변을 돌보고 평소 활동을 무리 없이 해낼 수 있을 때는 충분한 수면, 규칙적인 운동, 사람과의 연결 같은 자기관리를 시도해 볼 수 있다. 반면 심한 증상이 2주 이상 이어져 간단한 결정을 내리거나 평소 하던 일을 해내기 어렵다면 전문적 도움을 구해야 하며, 증상이 악화되거나 자기관리만으로 나아지지 않을 때도 의료진과 상담하도록 권한다.

여기서 말하는 ‘2주’는 모든 정신질환에 일률적으로 적용되는 진단 기준이 아니며, 상담을 받기 전에 반드시 채워야 하는 대기 기간도 아니다. 증상이 매우 심하거나 일상 기능이 빠르게 무너지거나 안전이 걱정된다면 며칠이 지났는지 따지지 말고 즉시 도움을 구해야 한다. 또한 NIMH의 안내는 미국의 일반 지침이므로, 한국에서의 실제 진료 절차와 위기 연락처는 국내 공식 자원을 기준으로 따라야 한다.

도움을 시작할 문은 지금 처한 환경에 따라 여러 군데 열려 있다. 대학생이라면 교내 학생상담센터에서 재학생 상담을 제공하는 경우가 많고, 직장인이라면 회사의 근로자 지원 프로그램(EAP)을 통해 외부 상담을 연결받을 수 있다. 다만 이용 가능 여부와 비용, 횟수 제한, 비밀보장과 위기 대응 범위는 학교와 회사마다 다르므로 안내문을 먼저 확인하는 편이 좋다. 설령 처음 두드린 곳에서 원하는 도움을 바로 얻지 못했더라도 다른 기관이나 경로로 옮겨 가면 된다.

의료기관을 통하는 길도 있다. 동네 일차의료기관에서 현재 상태를 설명하고 정신건강 전문가에게 연결받을 수 있으며, 정신건강의학과 의사나 임상심리사 등 전문가의 자격과 기관에 따라 맡는 역할과 제공 서비스가 다르므로 예약 전에 확인해 두면 헛걸음을 줄일 수 있다. 각 지역의 정신건강복지센터 역시 상담을 진행하고 지역 내 이용 가능한 자원을 연결해 준다. 동료나 가족은 갈 만한 기관을 찾아보거나 예약을 돕고, 병원이나 상담실에 동행해 주거나 일상의 안부를 확인하는 식으로 힘을 보탤 수 있다. 다만 주변 사람들의 지지가 전문가의 진단이나 위기 대응을 대신할 수는 없다.

전문가를 찾아갈 때 처음부터 앞뒤가 완벽히 맞는 설명을 준비할 필요는 없다. 앞서 적어 둔 시작 시점과 빈도, 일상 기능의 변화, 안전에 관한 우려를 메모 그대로 보여 주면서 어디서부터 풀어야 할지 모르겠다고 말해도 충분하다. 구체적인 치료 방식이나 약물의 시작·중단 여부는 당사자와 자격을 갖춘 전문가가 현재 상태와 선택지를 충분히 살핀 뒤에 함께 결정할 일이다.

## 즉시 도움이 필요한 경우

자해나 자살 생각이 들거나 자신 또는 다른 사람에게 즉각적인 생명·신체 위험이 닥쳤다면 자기관리 목록을 더 시험해 보거나 2주를 기다릴 때가 아니다. 이런 위기 상황에서는 지체 없이 아래의 공식 긴급·상담 자원으로 바로 연결해야 한다.

# 24장 직업과 일 밖의 삶

직업을 하나 고르면 일의 내용만 고르는 것이 아니라 삶의 여러 조건도 한꺼번에 끌어안게 된다. 어떤 직업을 갖느냐에 따라 소득과 사는 곳이 정해지고, 하루의 시간표와 자주 만나는 사람들이 달라진다. 때로는 자신이 무엇을 잘하는 사람인지 바깥에 설명하는 사회적 언어까지 직업이 대신해 준다. 일에서 의미와 소속감을 얻는 사람들에게 직업은 단순한 생계 수단 이상이지만, 바로 그 이유 때문에 일이 흔들리는 순간 삶 전체가 함께 흔들리기도 쉽다. 그러므로 직업이 실제로 짊어지고 있는 몫이 무엇인지 살피는 동시에, 직업 하나가 떠안지 않아도 될 몫까지 몽땅 넘긴 것은 아닌지 돌아보아야 한다.

## 직업 하나로 함께 달라지는 행복의 칸

행복을 소득과 주거, 건강, 시간, 관계 같은 생활 조건과 삶의 평가, 정서, 의미, 일상 기능으로 나누어 보면 직업 선택 하나가 여러 칸을 동시에 움직이는 모습이 선명하게 드러난다. 연봉이 오르면 소득과 주거의 선택 폭은 넓어지지만, 그 대가로 통근 시간이 길어지고 밤늦은 연락까지 늘어나면 수면과 가까운 관계에 쓸 시간이 줄어든다. 도전적인 문제에서 유능감과 의미를 느끼더라도 고용이 불안정하면 앞날의 계획을 세우기 어렵고, 반대로 반복 업무가 다소 지루한 자리라도 예측 가능한 근무시간과 안정된 소득 덕분에 건강과 돌봄을 지켜 낼 수 있다. ‘좋은 직업’이라는 단일 잣대 하나로 묶어 버리면 이처럼 서로 엇갈리며 움직이는 생활 조건의 변화를 놓치기 쉽다.

## 남는 시간이 아닌 일 밖의 시간

일하고 남는 자투리 시간이 아니라 의도적으로 확보한 일 밖의 시간은 회복과 삶의 질을 떠받친다. Kuykendall과 동료들이 37개 효과크기, 총 11,834명의 자료를 종합한 메타분석에서 여가 참여는 주관적 웰빙과 중간 정도의 관련을 보였다. 종단 분석에서는 여가 만족이 이후의 웰빙으로 이어지고 반대로 웰빙이 이후의 여가 만족으로 이어지는 양방향 흐름이 나타났으며, 실험 연구에서도 여가 개입이 웰빙을 높였다. 흥미로운 점은 여가에 쏟아부은 총시간보다 얼마나 자주, 얼마나 다양한 방식으로 참여했는지가 웰빙과 더 강하게 연결됐다는 사실이다.

퇴근 뒤 일 생각에서 실제로 벗어나는 힘도 중요하다. Wendsche와 Lohmann-Haislah가 퇴근 후 심리적 분리를 다룬 86개 출판물의 91개 독립 표본, 총 38,124명의 자료를 종합한 결과, 자기보고 자료에서는 일에서 심리적으로 잘 분리될수록 소진과 피로, 신체 불편감이 적었고, 삶의 만족과 전반적인 안녕감, 긍정 정서가 높았으며 수면과 회복 상태도 더 좋았다. 물론 포함된 연구들의 편차가 크고 대부분 상관·자기보고 설계여서 업무 연락을 끊기만 하면 안녕감이 자동으로 높아진다고 단정할 수는 없다.

게다가 직업마다 심리적 분리가 가능한 여건도 다르다. 당직이나 현장 대응이 필수인 직무에서는 연락을 완전히 차단하기 어렵다. 이럴 때는 무작정 연결을 끊으려 하기보다 호출 빈도와 순번이 합리적인지, 적절한 보상이 따르는지, 장애 복구 뒤에 충분한 휴식이 보장되는지를 따져야 한다. 또한 평일 저녁에 메신저 알림이 울리지 않더라도 머릿속으로 해결하지 못한 일을 계속 되풀이한다면 시간표만 보고 분리가 이루어졌다고 말하기 어렵다. 결국 겉으로 비어 있는 시간이 아니라, 자신에게 실제로 회복이 시작되는 조건이 무엇인지 확인하는 일이 우선이다.

## 관계를 일터 하나에 모으지 않기

직장은 사람을 만나는 중요한 공간이다. 동료에게서 기술과 조언을 얻고, 함께 결과를 만들어 내며 소속감을 느끼기도 한다. 하지만 상사가 바뀌거나 이직·감원을 겪으면 직장에서 맺은 관계는 한꺼번에 재편될 수 있다. 일터 안의 유대가 아무리 깊더라도 일 밖의 관계를 따로 이어 가야 하는 이유다.

사람 사이의 연결이 삶에 미치는 무게는 여러 연구에서도 확인된다. Holt-Lunstad와 동료들이 148개 전향 관찰연구, 총 308,849명의 자료를 종합한 결과, 사회적 관계가 더 강한 집단은 평균적으로 생존 가능성이 더 높았다. 관찰연구인 만큼 이 수치로 직접적인 인과 효과를 증명하거나 특정 개인의 수명 변화를 예측할 수는 없지만, 곁에 버팀목이 되는 관계가 삶의 기초 체력과 깊이 맞물려 있다는 점만큼은 가볍게 넘기기 어렵다.

가족이나 파트너가 있는 사람이라면 일과 생활이 서로를 침범하는 방향까지 세밀하게 살펴야 한다. Amstad와 동료들은 427개 효과크기를 분석하면서 일이 가족생활을 방해하는 갈등과 가족생활이 일을 방해하는 갈등을 나누어 살폈다. 두 방향의 갈등은 직무와 조직생활, 결혼과 가족생활의 결과는 물론 삶의 만족과 건강, 심리적 고통처럼 양쪽 영역에 걸친 결과와도 모두 유의미하게 연결됐다. 연구마다 가족 형태와 성별 역할, 시대와 문화가 달라 누구에게나 통하는 이상적인 균형점을 하나로 정해 줄 수는 없지만, 돌봄과 관계를 ‘업무 밖의 개인 사정’으로 밀어낸 채 직업 선택을 계산하면 실제로 치러야 할 비용을 놓치게 된다.

## 일 밖의 역할을 일정에 넣기

사람은 직함 밖에서도 여러 역할을 맡고 산다. 누군가의 친구이자 가족이고, 누군가를 돌보거나 새로운 것을 배우는 사람이며, 운동이나 창작, 지역 활동처럼 일터의 평가 기준과 무관하게 이어 가는 몫을 지니기도 한다. 스스로 소중하다고 꼽은 역할이 실제 주간 일정표와 일상 관계 속에 자리를 잡고 있는지 들여다보아야 한다.

직업 밖의 역할에는 취미 활동만 있는 것이 아니다. 병원에 가야 할 시간, 가까운 사람과 마주 앉을 시간, 돌봄 약속, 아무 방해 없이 혼자 회복하는 시간처럼 먼저 자리를 비워 두지 않으면 금세 밀려나는 일들이 포함된다. 새 직장의 시간표를 그릴 때도 근무시간과 통근 시간을 먼저 채우고 남는 빈칸에 생활을 구겨 넣기 전에, 이번 시기에 반드시 지키려는 일 밖의 역할 한두 가지를 먼저 배치해 본다. 그 역할을 감당할 시간과 물리적 여유가 실제로 확보되는지 따져 보는 과정이 필요하다. 직업을 옮기면 직함과 동료, 잘한다고 인정받던 기준까지 한꺼번에 바뀔 수 있지만, 직함이 바뀌어도 흔들리지 않고 이어 갈 역할과 관계가 일 밖에 남아 있다면 전환기에도 삶의 중심을 잃지 않는다.

## 다음 선택표에 생활 다시 넣기

다음 직업을 비교할 때 쓰는 선택표에는 일의 조건이 생활로 번져 나가는 경로까지 나란히 적어야 한다. 막연하게 ‘워라밸이 좋은 곳’을 찾기보다 아래 표처럼 직업 조건이 내 일상의 어느 칸을 어떻게 바꾸는지 구체적으로 대조해 보면 확인할 것이 분명해진다.

| 직업에서 볼 조건 | 생활에 번지는 경로 | 확인할 자료 |
|---|---|---|
| 보상과 고용 | 주거, 의료, 저축, 실업 때의 여유 | 확정 보상, 계약 기간, 보험, 월 고정비 |
| 시간과 장소 | 수면, 통근, 돌봄, 중요한 사람을 만날 시간 | 평시·성수기 근무, 출근 빈도, 호출과 출장 |
| 일의 경계 | 회복, 여가, 퇴근 뒤 정신적 분리 | 연락 규칙, 대기 순번, 휴가 사용, 업무량의 변동 |
| 사람과 문화 | 소속, 도움, 갈등, 일 밖 관계에 남는 에너지 | 직속 상사, 팀 이동, 갈등 처리, 퇴근 뒤 상태 |
| 의미와 정체성 | 삶의 만족, 유능감, 일이 흔들릴 때의 자기평가 | 가치 있다고 느끼는 과업과 직업 밖의 역할 |

물론 표의 모든 칸을 한꺼번에 최고점으로 채울 필요는 없다. 시기에 따라서는 기술을 빠르게 익히기 위해 시간을 더 쏟을 수도 있고, 소득을 높이기 위해 긴 통근을 잠시 감수할 수도 있다. 다만 그 비용을 ‘지금만’이라고 적어 두었다면 언제 다시 점검할지, 무엇이 달라져야 그 시기를 끝낼지도 함께 정해 두어야 한다. 기한을 정하지 않은 희생은 어느새 생활의 기본값으로 굳어 버리기 쉽다.

많은 사람이 바라는 ‘안정’ 역시 한 덩어리로 보지 말고 쪼개어 살펴야 한다. 예측 가능한 소득과 일정은 분명 비교할 수 있는 유리한 생활 조건이다. 승진을 하거나 정규직으로 전환되고 더 이름 있는 회사로 옮기면 이런 조건은 한층 나아질 수 있다. 하지만 건강과 관계, 삶의 의미는 회사 간판이나 계약 형태가 대신 지켜 주지 못하므로 따로 돌보아야 한다. 다음 단계로 넘어가면서 무엇이 나아지고 무엇이 그대로 남는지, 또 무엇을 새로 챙겨야 하는지 구체적으로 적어 두어야 하는 이유다.

인생은 선택의 연속이고 우리는 기왕이면 행복하게 살고 싶다. 직업은 그 수많은 선택 가운데 하루의 시간과 생활 조건을 가장 크게 바꾸는 축이지만, 삶 전체를 대신할 수는 없다. 그러니 어떤 자리를 고를 때도 일의 내용과 보상만큼이나 건강과 관계, 사는 곳, 회복 시간, 그리고 일 밖의 역할을 같은 판 위에 올려놓고 따진다. 지킬 수 있는 바닥을 확인하고 이번 시기의 방향과 감수할 비용을 정한 뒤, 모르는 것은 직접 물어 확인하고, 일단 결정을 내렸다면 실제 경험이 쌓일 때까지 한동안 흔들리지 않고 걸어 본다. 그렇게 정해 둔 시점이 돌아왔을 때 지금 가꾸고 있는 생활이 처음 정한 방향에 맞는지 차분히 점검하며, 또 다음 선택을 이어 가면 된다.

  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
      }
      try { return hljs.highlightAuto(code).value; } catch(e) {}
      return code;
    },
    breaks: false,
    gfm: true
  });
  marked.use({ renderer: { del: function(token) { return '~' + (token.text || token) + '~'; } } });

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  }

  function protectMath(src) {
    var placeholders = [];
    var idx = 0;
    var codeBlocks = [];
    src = src.replace(new RegExp('\\x60\\x60\\x60[\\s\\S]*?\\x60\\x60\\x60', 'g'), function(m) {
      codeBlocks.push(m);
      return '%%CODEBLOCK' + (codeBlocks.length - 1) + '%%';
    });
    var inlineCodes = [];
    src = src.replace(new RegExp('\\x60[^\\x60\\n]+\\x60', 'g'), function(m) {
      inlineCodes.push(m);
      return '%%INLINECODE' + (inlineCodes.length - 1) + '%%';
    });
    src = src.replace(/\$\$([\s\S]*?)\$\$/g, function(m, math) {
      placeholders.push({ display: true, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/\$([^\s$](?:[^$]*[^\s$])?)\$/g, function(m, math) {
      placeholders.push({ display: false, math: math });
      return '%%MATH' + (idx++) + '%%';
    });
    src = src.replace(/%%CODEBLOCK(\d+)%%/g, function(m, i) { return codeBlocks[parseInt(i, 10)]; });
    src = src.replace(/%%INLINECODE(\d+)%%/g, function(m, i) { return inlineCodes[parseInt(i, 10)]; });
    return { src: src, placeholders: placeholders };
  }

  function restoreAndRenderMath(html, placeholders) {
    return html.replace(/%%MATH(\d+)%%/g, function(m, i) {
      var p = placeholders[parseInt(i, 10)];
      try {
        return katex.renderToString(p.math, { displayMode: p.display, throwOnError: false, trust: true });
      } catch(e) {
        return p.display ? '$$' + p.math + '$$' : '$' + p.math + '$';
      }
    });
  }

  var state = { observer: null, scrollHandler: null };
  var contentEl = document.getElementById('content');
  var loadingEl = document.getElementById('loading');
  var tocContainer = document.getElementById('toc-container');

  function applyChrome() {
    document.documentElement.lang = 'ko';
    document.title = DOC_TITLE;
    document.getElementById('topbar-title').textContent = TOPBAR_TITLE;
    document.getElementById('search-input').placeholder = SEARCH_PLACEHOLDER;
    document.getElementById('toc-no-results').textContent = '검색 결과 없음';
    document.getElementById('loading-text').textContent = '가이드 렌더링 중...';
    document.querySelectorAll('#lang-toggle a').forEach(function(a) { a.classList.add('active'); });
    try { localStorage.setItem(STORAGE_KEY, 'ko'); } catch(e) {}
  }

  function parseHeading(text) {
    var ch = text.trim().match(/^(\d+)장\s+(.+)$/) || text.trim().match(/^Ch\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ch) return { kind: 'chapter', num: parseInt(ch[1], 10), title: ch[2].trim(), label: parseInt(ch[1], 10) + '장' };
    var ex = text.trim().match(/^E\.?\s*(\d+)\s*[\u2014\u2013-]\s*(.+)$/);
    if (ex) return { kind: 'excerpt', num: parseInt(ex[1], 10), title: ex[2].trim(), label: 'E.' + parseInt(ex[1], 10) };
    return null;
  }

  function parseGroupLabel(label) {
    var parts = label.split('·');
    if (parts.length < 2) return { kicker: '', title: label.trim() };
    return { kicker: parts[0].trim(), title: parts.slice(1).join('·').trim() };
  }

  function findEntryHeading(item) {
    var h1s = contentEl.querySelectorAll('h1');
    for (var i = 0; i < h1s.length; i++) {
      var parsed = parseHeading(h1s[i].textContent);
      if (parsed && parsed.kind === item.kind && parsed.num === item.num) return h1s[i];
    }
    return null;
  }

  function annotateEntryHeadings() {
    contentEl.querySelectorAll('h1').forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      h1.classList.add(parsed.kind === 'excerpt' ? 'excerpt-heading' : 'chapter-heading');
    });
  }

  function buildPartIntros() {
    annotateEntryHeadings();
    CHAPTER_GROUPS.forEach(function(group, index) {
      var first = null;
      for (var i = 0; i < group.items.length; i++) {
        first = findEntryHeading(group.items[i]);
        if (first) break;
      }
      if (!first) return;

      var meta = parseGroupLabel(group.label);
      var partId = 'part-' + index + '-' + slugify(meta.title);
      if (document.getElementById(partId)) return;

      var section = document.createElement('section');
      section.className = 'part-intro';

      var kicker = document.createElement('div');
      kicker.className = 'part-kicker';
      kicker.textContent = meta.kicker || 'Part';
      section.appendChild(kicker);

      var title = document.createElement('h1');
      title.className = 'part-title';
      title.id = partId;
      title.textContent = meta.title;
      section.appendChild(title);

      if (group.intro) {
        var intro = document.createElement('p');
        intro.textContent = group.intro;
        section.appendChild(intro);
      }

      first.parentNode.insertBefore(section, first);
    });
  }

  function render() {
    applyChrome();
    contentEl.style.display = 'none';
    loadingEl.style.display = 'flex';

    requestAnimationFrame(function() {
      var src = document.getElementById('md-source-ko').value;
      src = src.replace(/\*\*([^*\n]+)\*\*(?=[가-힣])/g, '<strong>$1</strong>');
      var mathData = protectMath(src);
      var html = marked.parse(mathData.src);
      html = restoreAndRenderMath(html, mathData.placeholders);
      contentEl.innerHTML = html;
      contentEl.querySelectorAll('a[href]').forEach(function(link) {
        var url = new URL(link.getAttribute('href'), window.location.href);
        if ((url.protocol === 'http:' || url.protocol === 'https:') && url.origin !== window.location.origin) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
      });

      if (window.mermaid) {
        var mermaidBlocks = contentEl.querySelectorAll('pre > code.language-mermaid');
        mermaidBlocks.forEach(function(code, i) {
          var pre = code.parentElement;
          var container = document.createElement('div');
          container.className = 'mermaid';
          container.id = 'mermaid-ko-' + i;
          container.textContent = code.textContent;
          pre.replaceWith(container);
        });
        try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}
      }

      tocContainer.innerHTML = '';
      buildPartIntros();
      buildOverview();
      buildTOC();
      contentEl.style.display = 'block';
      loadingEl.style.display = 'none';
      setupScrollTracking();

      if (window.location.hash) {
        var initId = window.location.hash.slice(1);
        var initTarget = document.getElementById(initId);
        if (initTarget) window.scrollTo(0, initTarget.getBoundingClientRect().top + window.scrollY - 60);
      }
    });
  }

  render();
  setupSearch();
  setupProgressBar();
  setupMobileMenu();
  setupKeyboard();
  setupTocDelegation();

  function setupTocDelegation() {
    tocContainer.addEventListener('click', function(e) {
      if (e.target.closest('.toc-item')) closeMobileSidebar();
    });
  }

  function buildOverview() {
    var h1s = contentEl.querySelectorAll('h1');
    var entries = {};

    h1s.forEach(function(h1) {
      var parsed = parseHeading(h1.textContent);
      if (!parsed) return;
      if (!h1.id) h1.id = parsed.kind + '-' + parsed.num;
      var sections = [];
      var node = h1.nextElementSibling;
      while (node && node.tagName !== 'H1') {
        if (node.tagName === 'H2') {
          if (!node.id) node.id = slugify(node.textContent);
          sections.push({ text: node.textContent.trim(), id: node.id });
        }
        node = node.nextElementSibling;
      }
      entries[parsed.kind + '-' + parsed.num] = {
        kind: parsed.kind,
        num: parsed.num,
        label: parsed.label,
        title: parsed.title,
        id: h1.id,
        sections: sections
      };
    });

    if (Object.keys(entries).length === 0) return;

    var overview = document.createElement('section');
    overview.className = 'guide-overview';
    var header = document.createElement('div');
    header.className = 'overview-header';
    var oTitle = document.createElement('h1');
    oTitle.className = 'overview-title';
    oTitle.textContent = OVERVIEW_TITLE;
    header.appendChild(oTitle);
    overview.appendChild(header);

    CHAPTER_GROUPS.forEach(function(group) {
      var valid = group.items.map(function(item) { return entries[item.kind + '-' + item.num]; }).filter(Boolean);
      if (!valid.length) return;
      var groupEl = document.createElement('div');
      groupEl.className = 'overview-group';
      var label = document.createElement('div');
      label.className = 'overview-group-label';
      label.setAttribute('role', 'heading');
      label.setAttribute('aria-level', '2');
      label.textContent = group.label;
      groupEl.appendChild(label);
      if (group.intro) {
        var intro = document.createElement('p');
        intro.className = 'overview-group-intro';
        intro.textContent = group.intro;
        groupEl.appendChild(intro);
      }

      valid.forEach(function(entry) {
        var wrap = document.createElement('div');
        wrap.className = 'overview-chapter';
        var link = document.createElement('a');
        link.className = 'overview-chapter-link';
        link.href = '#' + entry.id;
        var num = document.createElement('span');
        num.className = 'overview-chapter-num';
        num.textContent = entry.label;
        link.appendChild(num);
        link.appendChild(document.createTextNode(entry.title));
        wrap.appendChild(link);
        groupEl.appendChild(wrap);
      });
      overview.appendChild(groupEl);
    });

    var about = contentEl.querySelector('.about-document');
    if (about) contentEl.insertBefore(overview, about.nextSibling);
    else contentEl.insertBefore(overview, contentEl.firstChild);
  }

  function buildTOC() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var fragment = document.createDocumentFragment();
    headings.forEach(function(heading) {
      if (!heading.id) heading.id = slugify(heading.textContent);
      if (heading.classList.contains('overview-title')) return;

      var link = document.createElement('a');
      var parsed = parseHeading(heading.textContent);
      var tocClass = 'toc-section';
      if (heading.classList.contains('part-title')) tocClass = 'toc-part';
      else if (parsed) tocClass = 'toc-chapter' + (parsed.kind === 'excerpt' ? ' toc-excerpt' : '');
      link.className = 'toc-item ' + tocClass;
      link.href = '#' + heading.id;
      if (heading.classList.contains('part-title')) {
        var kicker = heading.parentElement ? heading.parentElement.querySelector('.part-kicker') : null;
        link.textContent = (kicker ? kicker.textContent + ' · ' : '') + heading.textContent;
      } else {
        link.textContent = heading.textContent;
      }
      link.dataset.headingId = heading.id;
      fragment.appendChild(link);
    });
    tocContainer.appendChild(fragment);
  }

  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/<[^>]+>/g, '')
      .replace(/[^\w\s가-힣-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 80) || 'section';
  }

  function setupScrollTracking() {
    var headings = contentEl.querySelectorAll('h1, h2');
    var tocItems = tocContainer.querySelectorAll('.toc-item');
    if (headings.length === 0) return;
    if (state.observer) state.observer.disconnect();

    var tocMap = {};
    tocItems.forEach(function(item) { tocMap[item.dataset.headingId] = item; });
    var currentActive = null;
    var observer = new IntersectionObserver(function(entries) {
      var topHeading = null;
      var topOffset = Infinity;
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var rect = entry.target.getBoundingClientRect();
          if (rect.top < topOffset) { topOffset = rect.top; topHeading = entry.target; }
        }
      });
      if (topHeading) {
        if (currentActive) currentActive.classList.remove('active');
        var item = tocMap[topHeading.id];
        if (item) {
          item.classList.add('active');
          currentActive = item;
          var itemRect = item.getBoundingClientRect();
          var containerRect = tocContainer.getBoundingClientRect();
          if (itemRect.top < containerRect.top || itemRect.bottom > containerRect.bottom) item.scrollIntoView({ block: 'center', behavior: 'auto' });
        }
      }
    }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });
    headings.forEach(function(h) { observer.observe(h); });
    state.observer = observer;

    if (!state.scrollHandler) {
      var ticking = false;
      state.scrollHandler = function() {
        if (!ticking) {
          requestAnimationFrame(function() {
            var curHeadings = contentEl.querySelectorAll('h1, h2');
            var curTocItems = tocContainer.querySelectorAll('.toc-item');
            var curMap = {};
            curTocItems.forEach(function(item) { curMap[item.dataset.headingId] = item; });
            var found = null;
            var scrollTop = window.scrollY + 80;
            for (var i = curHeadings.length - 1; i >= 0; i--) {
              if (curHeadings[i].offsetTop <= scrollTop) { found = curHeadings[i]; break; }
            }
            if (found) {
              var active = tocContainer.querySelector('.toc-item.active');
              if (active) active.classList.remove('active');
              var item = curMap[found.id];
              if (item) item.classList.add('active');
            }
            ticking = false;
          });
          ticking = true;
        }
      };
      window.addEventListener('scroll', state.scrollHandler);
    }
  }

  function setupSearch() {
    var searchInput = document.getElementById('search-input');
    var noResults = document.getElementById('toc-no-results');
    searchInput.addEventListener('input', function() {
      var query = this.value.trim().toLowerCase();
      var tocItems = tocContainer.querySelectorAll('.toc-item');
      if (!query) {
        tocItems.forEach(function(item) { item.classList.remove('toc-hidden'); });
        noResults.style.display = 'none';
        return;
      }
      var matchCount = 0;
      tocItems.forEach(function(item) {
        var text = item.textContent.toLowerCase();
        if (text.includes(query)) { item.classList.remove('toc-hidden'); matchCount++; }
        else item.classList.add('toc-hidden');
      });
      noResults.style.display = matchCount === 0 ? 'block' : 'none';
    });
  }

  function setupProgressBar() {
    var progressBar = document.getElementById('progress-bar');
    var ticking = false;
    function updateProgress() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = Math.min(progress, 100) + '%';
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() { updateProgress(); ticking = false; });
        ticking = true;
      }
    });
    updateProgress();
  }

  function setupMobileMenu() {
    var toggle = document.getElementById('menu-toggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.querySelector('#sidebar-overlay');
    toggle.addEventListener('click', function() {
      var isOpen = sidebar.classList.toggle('open');
      overlay.classList.toggle('visible', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    overlay.addEventListener('click', closeMobileSidebar);
  }

  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.querySelector('#sidebar-overlay').classList.remove('visible');
    document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
  }

  function setupKeyboard() {
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });
  }
})();
</script>
